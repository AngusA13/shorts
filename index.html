<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>ShortsFlow</title>

<style>
:root {
    --accent: #ff174f;
    --accent-2: #ff4d75;
    --glass: rgba(18,18,22,.72);
    --glass-strong: rgba(24,24,29,.88);
    --border: rgba(255,255,255,.105);
    --text-soft: rgba(255,255,255,.64);
    --text-faint: rgba(255,255,255,.4);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

html,
body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #050506;
    color: #fff;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
}

body {
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

button {
    font: inherit;
}

button,
iframe {
    -webkit-tap-highlight-color: transparent;
}

.app {
    position: relative;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(90,80,110,.11),
            transparent 38%
        ),
        #050506;
}

/* =========================================================
   TOP NAVIGATION
   ========================================================= */

.topbar {
    position: fixed;
    z-index: 200;
    top: 0;
    left: 0;
    right: 0;
    height: calc(60px + env(safe-area-inset-top));
    padding:
        env(safe-area-inset-top)
        16px
        0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.82),
            rgba(0,0,0,.3) 60%,
            transparent
        );
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: auto;
}

.brand-icon {
    position: relative;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    background:
        linear-gradient(
            145deg,
            #ff194f,
            #ff0050 52%,
            #d90043
        );
    box-shadow:
        0 8px 30px rgba(255,0,72,.3),
        0 0 0 1px rgba(255,255,255,.13) inset;
    font-size: 15px;
    font-weight: 900;
}

.brand-text {
    font-size: 19px;
    line-height: 1;
    letter-spacing: -.7px;
    font-weight: 850;
}

.brand-text span {
    color: rgba(255,255,255,.48);
    font-weight: 650;
}

.top-actions {
    display: flex;
    align-items: center;
    gap: 9px;
    pointer-events: auto;
}

.header-pill {
    height: 36px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(18,18,22,.58);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    color: rgba(255,255,255,.75);
    font-size: 11px;
    font-weight: 700;
}

.header-pill .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #35dc75;
    box-shadow: 0 0 12px rgba(53,220,117,.7);
}

.icon-button {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255,255,255,.11);
    border-radius: 50%;
    background:
        linear-gradient(
            145deg,
            rgba(38,38,43,.82),
            rgba(16,16,19,.76)
        );
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    color: white;
    cursor: pointer;
    font-size: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.25);
    transition: transform .2s cubic-bezier(.2,.8,.2,1);
}

.icon-button:active {
    transform: scale(.9);
}

/* =========================================================
   FEED
   ========================================================= */

.feed {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    overscroll-behavior-y: contain;
    scrollbar-width: none;
}

.feed::-webkit-scrollbar {
    display: none;
}

.short {
    position: relative;
    width: 100%;
    height: 100%;
    height: 100dvh;
    min-height: 100dvh;
    overflow: hidden;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    isolation: isolate;
    background: #050506;
}

/* =========================================================
   VIDEO SHELL & TOUCH OVERLAY
   ========================================================= */

.video-shell {
    position: relative;
    z-index: 2;
    width: min(440px, 100vw);
    height: min(92vh, 790px);
    aspect-ratio: 9 / 16;
    overflow: hidden;
    border-radius: 20px;
    background: #101012;
    box-shadow: 0 40px 120px rgba(0,0,0,.6);
    touch-action: manipulation;
}

.video-touch-overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    background: transparent;
    cursor: pointer;
}

.play-state-pop {
    position: absolute;
    z-index: 15;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.6);
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 28px;
    pointer-events: none;
    opacity: 0;
    animation: popPlayState 0.5s ease forwards;
}

@keyframes popPlayState {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.6);
    }
    50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
    }
    100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1);
    }
}

.heart-pop {
    position: absolute;
    z-index: 15;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0);
    font-size: 80px;
    color: #ff2a5f;
    text-shadow: 0 10px 30px rgba(0,0,0,0.5);
    animation: popHeart 0.8s cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards;
}

@keyframes popHeart {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2) rotate(-15deg);
    }
    40% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.2) rotate(0deg);
    }
    70% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
    }
    100% {
        opacity: 0;
        transform: translate(-50%, -100%) scale(1.3) rotate(10deg);
    }
}

.video-shell iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    pointer-events: none;
}

.video-loading {
    position: absolute;
    z-index: 6;
    inset: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(circle, rgba(30,30,35,.95), rgba(8,8,10,.98));
    pointer-events: none;
    transition: opacity .45s ease, visibility .45s ease;
}

.video-shell.loaded .video-loading {
    opacity: 0;
    visibility: hidden;
}

.spinner {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.12);
    border-top-color: white;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* =========================================================
   RIGHT ACTION RAIL
   ========================================================= */

.actions {
    position: absolute;
    z-index: 20;
    right: max(12px, calc((100vw - 440px) / 2 + 12px));
    bottom: calc(30px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
}

.action {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.action-button {
    position: relative;
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 50%;
    color: white;
    background: rgba(22,22,26,.65);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    cursor: pointer;
    font-size: 20px;
    transition: transform .2s ease, background .2s ease, color .2s ease;
}

.action-button:active {
    transform: scale(.88);
}

.action-button.liked {
    color: #ff315f;
    background: rgba(255,49,95,.18);
    border-color: rgba(255,49,95,.4);
}

.action-label {
    font-size: 10px;
    font-weight: 600;
    color: rgba(255,255,255,.8);
    text-shadow: 0 2px 8px rgba(0,0,0,.8);
}

/* =========================================================
   VIDEO INFO
   ========================================================= */

.info {
    position: absolute;
    z-index: 20;
    left: max(16px, calc((100vw - 440px) / 2 + 16px));
    right: 75px;
    bottom: calc(24px + env(safe-area-inset-bottom));
    text-shadow: 0 2px 10px rgba(0,0,0,.9);
    pointer-events: none;
}

.creator-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
}

.creator-avatar {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #25252b;
    border: 1px solid rgba(255,255,255,.2);
    font-size: 13px;
    font-weight: 800;
}

.creator {
    font-size: 14px;
    font-weight: 750;
}

.follow-pill {
    padding: 3px 7px;
    border-radius: 999px;
    background: rgba(255,255,255,.15);
    color: rgba(255,255,255,.9);
    font-size: 9px;
    font-weight: 700;
}

.description {
    font-size: 13.5px;
    line-height: 1.35;
    color: rgba(255,255,255,.92);
    margin-bottom: 8px;
    font-weight: 500;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.info-bottom {
    display: flex;
    align-items: center;
    gap: 8px;
}

.category {
    display: inline-flex;
    align-items: center;
    height: 24px;
    padding: 0 9px;
    border-radius: 999px;
    background: rgba(255,255,255,.12);
    color: rgba(255,255,255,.8);
    font-size: 9.5px;
    font-weight: 700;
}

.video-number {
    color: rgba(255,255,255,.45);
    font-size: 9.5px;
    font-weight: 600;
}

/* =========================================================
   SMART FEED INDICATOR & PROGRESS
   ========================================================= */

.smart-indicator {
    position: fixed;
    z-index: 180;
    top: calc(65px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    height: 28px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(18,18,22,.62);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    color: rgba(255,255,255,.55);
    font-size: 9.5px;
    font-weight: 700;
    pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
}

.smart-indicator::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #7c5cff;
}

.smart-indicator.hidden {
    opacity: 0;
    transform: translate(-50%, -7px);
}

.progress-track {
    position: fixed;
    z-index: 190;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 120px;
    border-radius: 999px;
    background: rgba(255,255,255,.1);
    overflow: hidden;
    pointer-events: none;
}

.progress-bar {
    width: 100%;
    height: 0;
    border-radius: inherit;
    background: rgba(255,255,255,.75);
    transition: height .25s ease;
}

/* =========================================================
   SETTINGS OVERLAY
   ========================================================= */

.settings-overlay {
    position: fixed;
    z-index: 1000;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

.settings-overlay.open {
    display: flex;
}

.settings-panel {
    position: relative;
    width: min(450px, 100%);
    max-height: min(650px, 85vh);
    overflow: auto;
    padding: 20px;
    border-radius: 24px;
    background: #141418;
    border: 1px solid rgba(255,255,255,.1);
}

.settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.settings-title {
    font-size: 20px;
    font-weight: 800;
}

.close-button {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.1);
    color: white;
    cursor: pointer;
}

.setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
    border-bottom: 1px solid rgba(255,255,255,.06);
}

.setting-name {
    font-size: 14px;
    font-weight: 700;
}

.setting-description {
    color: rgba(255,255,255,.45);
    font-size: 11px;
    margin-top: 2px;
}

.toggle {
    width: 46px;
    height: 26px;
    padding: 2px;
    border: 0;
    border-radius: 999px;
    background: #37373c;
    cursor: pointer;
    transition: background .2s ease;
}

.toggle::after {
    content: "";
    display: block;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: white;
    transition: transform .22s ease;
}

.toggle.active {
    background: #20c96b;
}

.toggle.active::after {
    transform: translateX(20px);
}

.reset-button {
    width: 100%;
    height: 44px;
    margin-top: 16px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px;
    background: rgba(255,255,255,.06);
    color: white;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast {
    position: fixed;
    z-index: 1500;
    left: 50%;
    bottom: calc(30px + env(safe-area-inset-bottom));
    transform: translate(-50%, 15px) scale(.95);
    opacity: 0;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(28,28,34,.92);
    border: 1px solid rgba(255,255,255,.1);
    color: white;
    font-size: 11px;
    font-weight: 600;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
}

.toast.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
}

/* =========================================================
   MOBILE ADAPTATION
   ========================================================= */

@media (max-width: 600px) {
    .video-shell {
        width: 100vw;
        height: 100dvh;
        max-height: none;
        border-radius: 0;
        box-shadow: none;
    }

    .header-pill {
        display: none;
    }

    .actions {
        right: 12px;
        bottom: calc(20px + env(safe-area-inset-bottom));
    }

    .info {
        left: 14px;
        right: 70px;
        bottom: calc(20px + env(safe-area-inset-bottom));
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">▶</div>
            <div class="brand-text">Shorts<span>Flow</span></div>
        </div>

        <div class="top-actions">
            <div class="header-pill" id="feedStatus">
                <span class="status-dot"></span>
                <span id="feedStatusText">Smart Feed</span>
            </div>
            <button class="icon-button" id="settingsButton" aria-label="Open settings">⚙</button>
        </div>
    </header>

    <div class="smart-indicator" id="smartIndicator">Smart Feed</div>

    <main class="feed" id="feed" aria-label="Shorts feed"></main>

    <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
    </div>

</div>

<div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel">
        <div class="settings-header">
            <div class="settings-title">Settings</div>
            <button class="close-button" id="closeSettings">✕</button>
        </div>

        <div class="setting-row">
            <div>
                <div class="setting-name">Autoplay</div>
                <div class="setting-description">Start video on scroll</div>
            </div>
            <button class="toggle" id="autoplayToggle"></button>
        </div>

        <div class="setting-row">
            <div>
                <div class="setting-name">Start muted</div>
                <div class="setting-description">Start with video muted</div>
            </div>
            <button class="toggle" id="muteToggle"></button>
        </div>

        <div class="setting-row">
            <div>
                <div class="setting-name">Smart Feed</div>
                <div class="setting-description">Learn preferences automatically</div>
            </div>
            <button class="toggle" id="smartFeedToggle"></button>
        </div>

        <button class="reset-button" id="resetButton">Reset Feed Preferences</button>
    </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
const VIDEOS = [
    { id: "f7p1Ec4J8-4", title: "That one friend who NEVER has your back...", creator: "Nathan Doan Comedy", category: "Comedy" },
    { id: "WmVxEy7_RnM", title: "When you hate on bro for no reason✨", creator: "Nathan Doan Comedy", category: "Comedy" },
    { id: "fT0oo6lcmGU", title: "When the Restaurant is TOO expensive… 🥲", creator: "Nathan Doan Comedy", category: "Comedy" },
    { id: "dXnjjafO1AM", title: "what the heck", creator: "DrDonut", category: "Minecraft" },
    { id: "EShiKTGquTQ", title: "DrDonut couldn't believe it", creator: "DrDonut", category: "Minecraft" },
    { id: "ZxTU43S9W-Q", title: "A pal's day in palworld", creator: "Shorts", category: "Gaming" },
    { id: "lVgjUWFSR6w", title: "Minecraft Nostalgia", creator: "GEVids", category: "Minecraft" },
    { id: "z90RcaZVM6g", title: "22 Life Hacks I Wish I Knew Sooner!", creator: "Life Hacks", category: "Life Hacks" },
    { id: "7HMftA6q_9E", title: "Cutting Open Food Fidgets ASMR!", creator: "Shorts", category: "Satisfying" },
    { id: "imx8h7IfHwY", title: "Hilarious, Awkward Interactions", creator: "Nick Fleetwood", category: "Comedy" }
];

const SETTINGS_KEY = "shortsflow_settings_v4";
const SMART_KEY = "shortsflow_smart_v4";
const LIKES_KEY = "shortsflow_likes_v4";

let settings = { autoplay: true, mute: false, smartFeed: true };
let smartData = { categories: {}, videos: {} };
let likes = {};

try {
    settings = { ...settings, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") };
    smartData = JSON.parse(localStorage.getItem(SMART_KEY) || '{"categories":{},"videos":{}}');
    likes = JSON.parse(localStorage.getItem(LIKES_KEY) || "{}");
} catch(e){}

let orderedVideos = [];
let currentIndex = 0;
let activeArticle = null;
let observer = null;
let toastTimer = null;

const feed = document.getElementById("feed");
const settingsOverlay = document.getElementById("settingsOverlay");
const smartIndicator = document.getElementById("smartIndicator");
const toast = document.getElementById("toast");
const progressBar = document.getElementById("progressBar");

function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
function saveLikes() { localStorage.setItem(LIKES_KEY, JSON.stringify(likes)); }

function youtubeURL(videoId) {
    const params = new URLSearchParams({
        autoplay: settings.autoplay ? "1" : "0",
        mute: settings.mute ? "1" : "0",
        controls: "0",
        rel: "0",
        playsinline: "1",
        enablejsapi: "1"
    });
    return "https://www.youtube.com/embed/" + encodeURIComponent(videoId) + "?" + params.toString();
}

function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
}

function createShort(video, index) {
    const article = document.createElement("article");
    article.className = "short";
    article.dataset.videoId = video.id;
    article.dataset.index = index;

    article.innerHTML = `
        <div class="video-shell">
            <div class="video-touch-overlay"></div>
            <div class="video-loading"><div class="spinner"></div></div>
            <iframe title="${escapeHTML(video.title)}" src="about:blank" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="actions">
            <div class="action">
                <button class="action-button like-button" aria-label="Like">♡</button>
                <div class="action-label like-label">Like</div>
            </div>
            <div class="action">
                <button class="action-button share-button" aria-label="Share">↗</button>
                <div class="action-label">Share</div>
            </div>
            <div class="action">
                <button class="action-button youtube-button" aria-label="YouTube">▶</button>
                <div class="action-label">YouTube</div>
            </div>
        </div>
        <div class="info">
            <div class="creator-row">
                <div class="creator-avatar">${escapeHTML((video.creator||'S')[0].toUpperCase())}</div>
                <div class="creator">${escapeHTML(video.creator)}</div>
                <div class="follow-pill">SHORT</div>
            </div>
            <div class="description">${escapeHTML(video.title)}</div>
            <div class="info-bottom">
                <div class="category">#${escapeHTML(video.category)}</div>
                <div class="video-number">${index + 1} / ${VIDEOS.length}</div>
            </div>
        </div>
    `;

    const iframe = article.querySelector("iframe");
    const shell = article.querySelector(".video-shell");
    const touchOverlay = article.querySelector(".video-touch-overlay");

    iframe.addEventListener("load", () => {
        if (iframe.src !== "about:blank") shell.classList.add("loaded");
    });

    /* Tap & Double Tap Logic */
    let tapCount = 0;
    let tapTimer = null;
    let isPaused = false;

    touchOverlay.addEventListener("click", (e) => {
        tapCount++;
        if (tapCount === 1) {
            tapTimer = setTimeout(() => {
                tapCount = 0;
                // Single tap -> Toggle Play/Pause
                isPaused = !isPaused;
                const command = isPaused ? "pauseVideo" : "playVideo";
                iframe.contentWindow.postMessage(JSON.stringify({
                    event: 'command',
                    func: command,
                    args: []
                }), '*');
                triggerPlayStateAnimation(shell, isPaused ? '❚❚' : '▶');
            }, 280);
        } else if (tapCount === 2) {
            clearTimeout(tapTimer);
            tapCount = 0;
            // Double tap -> Like
            triggerHeartAnimation(shell, e);
            if (!likes[video.id]) {
                toggleLike(article, video);
            }
        }
    });

    article.querySelector(".like-button").addEventListener("click", (e) => {
        e.stopPropagation();
        toggleLike(article, video);
    });

    article.querySelector(".share-button").addEventListener("click", async (e) => {
        e.stopPropagation();
        const url = `https://www.youtube.com/shorts/${video.id}`;
        if (navigator.share) {
            try { await navigator.share({ title: video.title, url }); } catch(err){}
        } else {
            await navigator.clipboard.writeText(url);
            showToast("Short link copied!");
        }
    });

    article.querySelector(".youtube-button").addEventListener("click", (e) => {
        e.stopPropagation();
        window.open(`https://www.youtube.com/shorts/${video.id}`, "_blank");
    });

    updateLikeButton(article, video);
    return article;
}

function triggerPlayStateAnimation(container, symbol) {
    const pop = document.createElement("div");
    pop.className = "play-state-pop";
    pop.textContent = symbol;
    container.appendChild(pop);
    setTimeout(() => pop.remove(), 500);
}

function triggerHeartAnimation(container, event) {
    const rect = container.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    const heart = document.createElement("div");
    heart.className = "heart-pop";
    heart.innerHTML = "❤️";
    heart.style.left = `${x}px`;
    heart.style.top = `${y}px`;

    container.appendChild(heart);
    setTimeout(() => heart.remove(), 800);
}

function updateLikeButton(article, video) {
    const button = article.querySelector(".like-button");
    const label = article.querySelector(".like-label");
    const liked = !!likes[video.id];

    button.classList.toggle("liked", liked);
    button.textContent = liked ? "♥" : "♡";
    label.textContent = liked ? "Liked" : "Like";
}

function toggleLike(article, video) {
    if (likes[video.id]) {
        delete likes[video.id];
        showToast("Removed from likes");
    } else {
        likes[video.id] = true;
        showToast("Added to likes ❤️");
    }
    saveLikes();
    updateLikeButton(article, video);
}

function playShort(article) {
    if (!article) return;
    const iframe = article.querySelector("iframe");
    const shell = article.querySelector(".video-shell");
    if (shell) shell.classList.remove("loaded");
    if (iframe) iframe.src = youtubeURL(article.dataset.videoId);
}

function stopShort(article) {
    if (!article) return;
    const iframe = article.querySelector("iframe");
    const shell = article.querySelector(".video-shell");
    if (iframe) iframe.src = "about:blank";
    if (shell) shell.classList.remove("loaded");
}

function observeShorts() {
    if (observer) observer.disconnect();
    observer = new IntersectionObserver(entries => {
        const visible = entries.find(entry => entry.isIntersecting && entry.intersectionRatio >= 0.65);
        if (!visible) return;

        const nextArticle = visible.target;
        if (nextArticle === activeArticle) return;

        if (activeArticle) stopShort(activeArticle);
        activeArticle = nextArticle;
        playShort(activeArticle);

        currentIndex = Number(nextArticle.dataset.index);
        updateProgress();
    }, { threshold: [0.65] });

    feed.querySelectorAll(".short").forEach(short => observer.observe(short));
}

function buildFeed() {
    orderedVideos = [...VIDEOS];
    feed.innerHTML = "";
    orderedVideos.forEach((video, index) => {
        feed.appendChild(createShort(video, index));
    });
    observeShorts();
    updateProgress();
}

function updateProgress() {
    const percentage = ((currentIndex + 1) / orderedVideos.length) * 100;
    progressBar.style.height = `${percentage}%`;
}

feed.addEventListener("scroll", () => {
    const height = feed.clientHeight;
    if (!height) return;
    currentIndex = Math.round(feed.scrollTop / height);
    updateProgress();
}, { passive: true });

/* Settings logic */
document.getElementById("settingsButton").onclick = () => settingsOverlay.classList.add("open");
document.getElementById("closeSettings").onclick = () => settingsOverlay.classList.remove("open");
document.getElementById("autoplayToggle").onclick = function() {
    settings.autoplay = !settings.autoplay;
    this.classList.toggle("active", settings.autoplay);
    saveSettings();
};
document.getElementById("muteToggle").onclick = function() {
    settings.mute = !settings.mute;
    this.classList.toggle("active", settings.mute);
    saveSettings();
};
document.getElementById("smartFeedToggle").onclick = function() {
    settings.smartFeed = !settings.smartFeed;
    this.classList.toggle("active", settings.smartFeed);
    smartIndicator.classList.toggle("hidden", !settings.smartFeed);
    saveSettings();
};
document.getElementById("resetButton").onclick = () => {
    localStorage.clear();
    location.reload();
};

/* Init UI state */
document.getElementById("autoplayToggle").classList.toggle("active", settings.autoplay);
document.getElementById("muteToggle").classList.toggle("active", settings.mute);
document.getElementById("smartFeedToggle").classList.toggle("active", settings.smartFeed);

buildFeed();
</script>
