<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    color: white;
}

button {
    font: inherit;
}

.app {
    position: relative;
    width: 100%;
    height: 100%;
    background:
        radial-gradient(circle at 50% 45%, rgba(70,70,90,.12), transparent 45%),
        #000;
}

/* =========================
   TOP BAR
========================= */

.topbar {
    position: fixed;
    z-index: 100;
    top: 0;
    left: 0;
    right: 0;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    pointer-events: none;
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,.72),
        rgba(0,0,0,0)
    );
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -.5px;
    pointer-events: auto;
    text-shadow: 0 2px 12px rgba(0,0,0,.8);
}

.brand-icon {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    position: relative;
    background: linear-gradient(135deg, #ff0050, #ff3b30 48%, #7c3aed);
    box-shadow: 0 5px 25px rgba(255,0,80,.35);
}

.brand-icon::after {
    content: "";
    position: absolute;
    left: 11px;
    top: 7px;
    width: 0;
    height: 0;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-left: 12px solid white;
}

.top-actions {
    pointer-events: auto;
}

.icon-button {
    width: 43px;
    height: 43px;
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 50%;
    background: rgba(25,25,28,.7);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    color: white;
    cursor: pointer;
    font-size: 19px;
    transition: .2s ease;
    box-shadow: 0 5px 20px rgba(0,0,0,.3);
}

.icon-button:hover {
    transform: scale(1.07);
    background: rgba(55,55,60,.8);
}

.icon-button:active {
    transform: scale(.94);
}

/* =========================
   FEED
========================= */

.feed {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none;
    overscroll-behavior-y: contain;
}

.feed::-webkit-scrollbar {
    display: none;
}

.short {
    position: relative;
    width: 100%;
    height: 100dvh;
    min-height: 100vh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(
            circle at center,
            rgba(40,40,50,.35),
            rgba(0,0,0,.95) 72%
        );
}

.video-shell {
    position: relative;
    height: min(86vh, 900px);
    aspect-ratio: 9 / 16;
    max-width: calc(100vw - 180px);
    border-radius: 18px;
    overflow: hidden;
    background: #090909;
    box-shadow:
        0 20px 80px rgba(0,0,0,.65),
        0 0 0 1px rgba(255,255,255,.08);
}

.video-shell iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #000;
}

.video-loading {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    background: #080808;
    transition: opacity .35s ease;
}

.video-loading.hidden {
    opacity: 0;
}

.spinner {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15);
    border-top-color: white;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================
   RIGHT ACTIONS
========================= */

.actions {
    position: absolute;
    right: max(22px, calc((100vw - 720px) / 2 - 100px));
    bottom: 115px;
    display: flex;
    flex-direction: column;
    gap: 17px;
    z-index: 10;
}

.action {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
}

.action-button {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(20,20,23,.72);
    color: white;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    cursor: pointer;
    font-size: 23px;
    transition: .2s ease;
    box-shadow: 0 7px 25px rgba(0,0,0,.32);
}

.action-button:hover {
    transform: scale(1.08);
    background: rgba(55,55,60,.8);
}

.action-button:active {
    transform: scale(.92);
}

.action-button.liked {
    color: #ff2d55;
}

.action-label {
    font-size: 11px;
    color: rgba(255,255,255,.85);
    text-shadow: 0 2px 8px #000;
}

/* =========================
   VIDEO INFO
========================= */

.info {
    position: absolute;
    z-index: 10;
    left: max(22px, calc((100vw - 720px) / 2 - 100px));
    bottom: 42px;
    width: min(390px, 43vw);
    text-shadow: 0 2px 10px rgba(0,0,0,.8);
}

.creator {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 7px;
}

.description {
    font-size: 14px;
    line-height: 1.4;
    color: rgba(255,255,255,.9);
}

.category {
    display: inline-flex;
    margin-top: 9px;
    padding: 5px 9px;
    border-radius: 999px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.1);
    font-size: 11px;
    color: rgba(255,255,255,.8);
}

/* =========================
   SCROLL HINT
========================= */

.scroll-hint {
    position: fixed;
    z-index: 30;
    bottom: 17px;
    left: 50%;
    transform: translateX(-50%);
    padding: 9px 15px;
    border-radius: 999px;
    background: rgba(25,25,28,.72);
    border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(15px);
    color: rgba(255,255,255,.7);
    font-size: 12px;
    pointer-events: none;
    transition: opacity .5s ease;
}

.scroll-hint.hidden {
    opacity: 0;
}

/* =========================
   SETTINGS
========================= */

.settings-overlay {
    position: fixed;
    inset: 0;
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.58);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
}

.settings-overlay.open {
    opacity: 1;
    pointer-events: auto;
}

.settings {
    width: min(430px, calc(100vw - 30px));
    padding: 24px;
    border-radius: 24px;
    background: rgba(25,25,28,.94);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 30px 100px rgba(0,0,0,.65);
}

.settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
}

.settings-header h2 {
    font-size: 22px;
}

.close-settings {
    width: 35px;
    height: 35px;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.09);
    color: white;
    cursor: pointer;
    font-size: 17px;
}

.setting {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
    border-bottom: 1px solid rgba(255,255,255,.07);
}

.setting:last-of-type {
    border-bottom: 0;
}

.setting-title {
    font-size: 15px;
    font-weight: 700;
}

.setting-description {
    margin-top: 4px;
    color: rgba(255,255,255,.48);
    font-size: 12px;
}

.toggle {
    width: 50px;
    height: 29px;
    border-radius: 20px;
    border: 0;
    background: #45454b;
    cursor: pointer;
    position: relative;
    transition: .2s ease;
}

.toggle::after {
    content: "";
    position: absolute;
    width: 23px;
    height: 23px;
    border-radius: 50%;
    top: 3px;
    left: 3px;
    background: white;
    transition: .2s ease;
    box-shadow: 0 2px 5px rgba(0,0,0,.35);
}

.toggle.active {
    background: #0a84ff;
}

.toggle.active::after {
    transform: translateX(21px);
}

.reset-button {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 13px;
    background: rgba(255,255,255,.08);
    color: white;
    cursor: pointer;
    font-weight: 700;
    transition: .2s ease;

.reset-button:hover {
    background: rgba(255,255,255,.14);

   MOBILE
========================= */

    .topbar {

    .actions {

    .description {

    .scroll-hint {
        bottom: 8px;
        font-size: 11px;

@media (max-height: 650px) and (min-width: 701px) {

    .video-shell {
        height: 78vh;
    }

    .actions {
        bottom: 80px;
    }

    .info {
        bottom: 20px;
    }
}

/* =========================================================
   YOUTUBE EMBED URL
========================================================= */

function youtubeURL(videoId) {

    const params =
        new URLSearchParams({

            autoplay:
                autoplay ? "1" : "0",

            mute:
                muted ? "1" : "0",

            playsinline: "1",

            rel: "0",

            modestbranding: "1",

            controls: "1",

            enablejsapi: "1"

        });

    return (
        "https://www.youtube.com/embed/" +
        videoId +
        "?" +
        params.toString()
    );
}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================================
   LIKES
========================================================= */

function isLiked(videoId) {

    return (
        localStorage.getItem(
            "liked_" + videoId
        ) === "true"
    );

}


function setLiked(videoId, value) {

    localStorage.setItem(
        "liked_" + videoId,
        value ? "true" : "false"
    );

}


/* =========================================================
   CREATE SHORT
========================================================= */

function createShort(video, index) {

    const article =
        document.createElement("article");

    article.className = "short";

    article.dataset.index = index;

    article.dataset.videoId = video.id;

    const liked =
        isLiked(video.id);


    article.innerHTML = `

        <div class="video-shell">

            <div class="video-loading">
                <div class="spinner"></div>
            </div>

            <iframe
                src="${youtubeURL(video.id)}"
                title="${escapeHTML(video.description)}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
                loading="${index < 2 ? "eager" : "lazy"}">
            </iframe>

        </div>


        <div class="actions">

            <div class="action">

                <button
                    class="action-button like-button ${liked ? "liked" : ""}"
                    data-action="like">
                    ${liked ? "♥" : "♡"}
                </button>

                <span class="action-label">
                    Like
                </span>

            </div>


            <div class="action">

                <button
                    class="action-button"
                    data-action="share">
                    ↗
                </button>

                <span class="action-label">
                    Share
                </span>

            </div>


            <div class="action">

                <button
                    class="action-button"
                    data-action="open">
                    ▶
                </button>

                <span class="action-label">
                    YouTube
                </span>

            </div>

        </div>


        <div class="info">

            <div class="creator">
                @${escapeHTML(
                    video.creator
                        .replace(/\s+/g, "")
                        .toLowerCase()
                )}
            </div>

            <div class="description">
                ${escapeHTML(video.description)}
            </div>

            <div class="category">
                ${escapeHTML(video.category)}
            </div>

        </div>

    `;


    /* =========================
       LOADING
    ========================= */

    const iframe =
        article.querySelector("iframe");

    const loading =
        article.querySelector(".video-loading");


    iframe.addEventListener("load", () => {

        setTimeout(() => {

            loading.classList.add("hidden");

        }, 250);

    });


    /* =========================
       LIKE
    ========================= */

    article
        .querySelector("[data-action='like']")
        .addEventListener("click", () => {

            const newValue =
                !isLiked(video.id);

            setLiked(
                video.id,
                newValue
            );

            const button =
                article.querySelector(
                    ".like-button"
                );

            button.classList.toggle(
                "liked",
                newValue
            );

            button.textContent =
                newValue ? "♥" : "♡";

        });


    /* =========================
       SHARE
    ========================= */

    article
        .querySelector("[data-action='share']")
        .addEventListener("click", async () => {

            const url =
                "https://www.youtube.com/shorts/" +
                video.id;


            try {

                if (navigator.share) {

                    await navigator.share({

                        title:
                            video.description,

                        text:
                            "Check out this Short!",

                        url

                    });

                } else {

                    await navigator.clipboard.writeText(
                        url
                    );

                    showTemporaryMessage(
                        "Short link copied!"
                    );

                }

            } catch (error) {

                /* Share cancelled. */

            }

        });


    /* =========================
       OPEN YOUTUBE
    ========================= */

    article
        .querySelector("[data-action='open']")
        .addEventListener("click", () => {

            window.open(
                "https://www.youtube.com/shorts/" +
                video.id,
                "_blank",
                "noopener,noreferrer"
            );

        });


    return article;

}


/* =========================================================
   BUILD FEED
========================================================= */

function buildFeed() {

    feed.innerHTML = "";

    VIDEOS.forEach((video, index) => {

        feed.appendChild(
            createShort(
                video,
                index
            )
        );

    });

    currentIndex = 0;

    observeShorts();

}


/* =========================================================
   INTERSECTION OBSERVER
========================================================= */

const observer =
    new IntersectionObserver(

        entries => {

            entries.forEach(entry => {

                if (!entry.isIntersecting) {
                    return;
                }

                const index =
                    Number(
                        entry.target.dataset.index
                    );

                currentIndex = index;

                updateActiveVideos();


                if (index > 0) {

                    scrollHint.classList.add(
                        "hidden"
                    );

                }

            });

        },

        {
            threshold: .65
        }

    );


/* =========================================================
   OBSERVE SHORTS
========================================================= */

function observeShorts() {

    document
        .querySelectorAll(".short")
        .forEach(short => {

            observer.observe(short);

        });

}


/* =========================================================
   ACTIVE VIDEO MANAGEMENT
========================================================= */

function updateActiveVideos() {

    const shorts =
        document.querySelectorAll(".short");


    shorts.forEach((short, index) => {

        const iframe =
            short.querySelector("iframe");


        if (!iframe) {
            return;
        }


        if (
            Math.abs(
                index - currentIndex
            ) <= 1
        ) {

            if (!iframe.src) {

                iframe.src =
                    youtubeURL(
                        VIDEOS[index].id
                    );

            }

        }

    });

}


/* =========================================================
   KEYBOARD CONTROLS
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            settingsOverlay.classList.contains(
                "open"
            )
        ) {

            if (
                event.key === "Escape"
            ) {

                closeSettingsPanel();

            }

            return;

        }


        if (
            event.key === "ArrowDown" ||
            event.key === "PageDown"
        ) {

            event.preventDefault();

            goToShort(
                currentIndex + 1
            );

        }


        if (
            event.key === "ArrowUp" ||
            event.key === "PageUp"
        ) {

            event.preventDefault();

            goToShort(
                currentIndex - 1
            );

        }

    }
);


/* =========================================================
   GO TO SHORT
========================================================= */

function goToShort(index) {

    if (index < 0) {
        index = 0;
    }


    if (
        index >= VIDEOS.length
    ) {

        index =
            VIDEOS.length - 1;

    }


    const target =
        document.querySelector(
            `.short[data-index="${index}"]`
        );


    if (!target) {
        return;
    }


    target.scrollIntoView({

        behavior: "smooth",

        block: "start"

    });

}


/* =========================================================
   SETTINGS OPEN/CLOSE
========================================================= */

function openSettingsPanel() {

    settingsOverlay.classList.add(
        "open"
    );

}


function closeSettingsPanel() {

    settingsOverlay.classList.remove(
        "open"
    );

}


settingsButton.addEventListener(
    "click",
    openSettingsPanel
);


closeSettings.addEventListener(
    "click",
    closeSettingsPanel
);


settingsOverlay.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            settingsOverlay
        ) {

            closeSettingsPanel();

        }

    }
);


/* =========================================================
   UPDATE TOGGLES
========================================================= */

function updateToggleUI() {

    autoplayToggle.classList.toggle(
        "active",
        autoplay
    );

    muteToggle.classList.toggle(
        "active",
        muted
    );

}


/* =========================================================
   AUTOPLAY
========================================================= */

autoplayToggle.addEventListener(
    "click",
    () => {

        autoplay =
            !autoplay;

        localStorage.setItem(
            "shortsflow_autoplay",
            autoplay
        );

        updateToggleUI();

    }
);


/* =========================================================
   MUTE
========================================================= */

muteToggle.addEventListener(
    "click",
    () => {

        muted =
            !muted;

        localStorage.setItem(
            "shortsflow_muted",
            muted
        );

        updateToggleUI();

    }
);


/* =========================================================
   RESET
========================================================= */

resetFeed.addEventListener(
    "click",
    () => {

        localStorage.removeItem(
            "shortsflow_autoplay"
        );

        localStorage.removeItem(
            "shortsflow_muted"
        );

        autoplay = true;

        muted = true;

        updateToggleUI();

        buildFeed();


        setTimeout(() => {

            const first =
                document.querySelector(
                    ".short"
                );

            if (first) {

                first.scrollIntoView({
                    behavior: "instant"
                });

            }

        }, 50);


        closeSettingsPanel();

    }
);


/* =========================================================
   TEMPORARY MESSAGE
========================================================= */

function showTemporaryMessage(message) {

    const existing =
        document.getElementById(
            "temporaryMessage"
        );


    if (existing) {
        existing.remove();
    }


    const element =
        document.createElement("div");

    element.id =
        "temporaryMessage";

    element.textContent =
        message;


    Object.assign(
        element.style,
        {

            position: "fixed",

            left: "50%",

            bottom: "75px",

            transform:
                "translateX(-50%)",

            zIndex: "1000",

            padding:
                "11px 17px",

            borderRadius:
                "999px",

            background:
                "rgba(30,30,32,.92)",

            border:
                "1px solid rgba(255,255,255,.1)",

            color: "white",

            fontSize: "13px",

            fontWeight: "700",

            boxShadow:
                "0 10px 30px rgba(0,0,0,.4)",

            backdropFilter:
                "blur(15px)",

            transition:
                "opacity .25s ease"

        }
    );


    document.body.appendChild(
        element
    );


    setTimeout(() => {

        element.style.opacity =
            "0";


        setTimeout(() => {

            element.remove();

        }, 300);

    }, 1500);

}


/* =========================================================
   START APP
========================================================= */

updateToggleUI();

buildFeed();

setTimeout(() => {

    scrollHint.classList.remove(
        "hidden"
    );

}, 100);

</script>

</body>
</html>
