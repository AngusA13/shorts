<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>ShortsFlow</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:#fff;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input{
    font:inherit;
}

button{
    border:0;
    color:inherit;
}

.app{
    position:relative;
    width:100%;
    height:100%;
    background:#050505;
    overflow:hidden;
}

.feed{
    position:absolute;
    inset:0;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
    scrollbar-width:none;
    background:#050505;
}

.feed::-webkit-scrollbar{
    display:none;
}

.short{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    min-height:560px;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    overflow:hidden;
    background:#111;
}

.video-wrap{
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 30% 20%,rgba(100,120,255,.2),transparent 30%),
        linear-gradient(135deg,#151515,#050505);
    overflow:hidden;
}

.video{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    background:#111;
}

.fallback{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
        radial-gradient(circle at 30% 20%,rgba(255,255,255,.18),transparent 28%),
        radial-gradient(circle at 75% 65%,rgba(100,80,255,.22),transparent 35%),
        linear-gradient(135deg,#20243b,#111827 45%,#030303);
}

.fallback.hidden{
    display:none;
}

.orb{
    width:210px;
    height:210px;
    border-radius:50%;
    background:
        radial-gradient(circle at 32% 28%,#fff 0%,#9eeaff 9%,#7c3aed 40%,transparent 70%);
    filter:blur(1px);
    animation:float 5s ease-in-out infinite;
}

.grid{
    position:absolute;
    left:-20%;
    right:-20%;
    top:48%;
    bottom:-20%;
    background:
        linear-gradient(rgba(100,220,255,.12) 1px,transparent 1px),
        linear-gradient(90deg,rgba(100,220,255,.12) 1px,transparent 1px);
    background-size:42px 42px;
    transform:perspective(350px) rotateX(60deg);
    transform-origin:top;
}

@keyframes float{
    50%{
        transform:translateY(-25px) scale(1.08);
    }
}

.shade{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.62) 0%,
            rgba(0,0,0,.08) 25%,
            transparent 48%,
            rgba(0,0,0,.15) 65%,
            rgba(0,0,0,.9) 100%
        );
}

.topbar{
    position:fixed;
    z-index:30;
    top:0;
    left:0;
    right:0;
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    background:linear-gradient(180deg,rgba(0,0,0,.65),transparent);
    pointer-events:none;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:21px;
    font-weight:900;
    letter-spacing:-.7px;
    pointer-events:auto;
}

.logo{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:11px;
    background:#fff;
    color:#000;
    box-shadow:0 8px 28px rgba(255,255,255,.16);
}

.logo svg{
    width:20px;
    height:20px;
}

.tabs{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:5px;
    padding:5px;
    border:1px solid rgba(255,255,255,.13);
    background:rgba(18,18,18,.52);
    backdrop-filter:blur(22px);
    border-radius:15px;
    pointer-events:auto;
}

.tab{
    padding:8px 15px;
    border-radius:10px;
    background:transparent;
    color:rgba(255,255,255,.6);
    font-weight:750;
    cursor:pointer;
}

.tab.active{
    background:rgba(255,255,255,.14);
    color:#fff;
}

.top-actions{
    display:flex;
    gap:8px;
    pointer-events:auto;
}

.icon-btn{
    width:41px;
    height:41px;
    display:grid;
    place-items:center;
    border-radius:13px;
    background:rgba(20,20,20,.55);
    border:1px solid rgba(255,255,255,.13);
    backdrop-filter:blur(18px);
    cursor:pointer;
    transition:.18s;
}

.icon-btn:hover{
    background:rgba(255,255,255,.15);
    transform:translateY(-1px);
}

.icon-btn:active{
    transform:scale(.93);
}

.icon-btn svg{
    width:20px;
    height:20px;
}

.sound-btn{
    position:absolute;
    z-index:15;
    top:92px;
    right:24px;
}

.info{
    position:absolute;
    z-index:12;
    left:28px;
    bottom:35px;
    max-width:min(650px,calc(100% - 145px));
    text-shadow:0 2px 15px rgba(0,0,0,.65);
}

.creator{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:13px;
}

.avatar{
    width:46px;
    height:46px;
    min-width:46px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:linear-gradient(135deg,#fff,#8be4ff);
    color:#071019;
    font-size:13px;
    font-weight:900;
    border:2px solid rgba(255,255,255,.7);
}

.creator-name{
    font-size:16px;
    font-weight:850;
}

.verified{
    display:inline-grid;
    place-items:center;
    width:15px;
    height:15px;
    margin-left:3px;
    border-radius:50%;
    background:#3b82f6;
    font-size:9px;
}

.follow{
    padding:7px 13px;
    border-radius:9px;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.18);
    font-weight:800;
    cursor:pointer;
    backdrop-filter:blur(12px);
}

.follow.following{
    background:#fff;
    color:#111;
}

.caption{
    font-size:16px;
    line-height:1.45;
    font-weight:550;
}

.hashtags{
    margin-top:8px;
    font-weight:800;
}

.audio{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:11px;
    color:rgba(255,255,255,.85);
    font-size:13px;
    font-weight:650;
}

.vinyl{
    width:21px;
    height:21px;
    border-radius:50%;
    border:5px solid #222;
    background:#eee;
    box-shadow:inset 0 0 0 2px #777;
    animation:spin 3s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.short-actions{
    position:absolute;
    z-index:15;
    right:22px;
    bottom:31px;
    width:62px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px;
}

.action{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    cursor:pointer;
    user-select:none;
}

.bubble{
    width:49px;
    height:49px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:rgba(20,20,20,.48);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(18px);
    box-shadow:0 8px 25px rgba(0,0,0,.3);
    transition:.18s;
}

.action:hover .bubble{
    transform:scale(1.07);
    background:rgba(255,255,255,.15);
}

.action:active .bubble{
    transform:scale(.9);
}

.action svg{
    width:24px;
    height:24px;
}

.count{
    font-size:12px;
    font-weight:800;
    text-shadow:0 2px 8px #000;
}

.like.liked .bubble{
    background:rgba(255,45,90,.24);
}

.like.liked svg{
    fill:#ff365d;
    stroke:#ff365d;
}

.progress{
    position:absolute;
    z-index:20;
    left:0;
    right:0;
    bottom:0;
    height:3px;
    background:rgba(255,255,255,.16);
}

.progress i{
    display:block;
    width:0%;
    height:100%;
    background:#fff;
    box-shadow:0 0 12px rgba(255,255,255,.8);
}

.loading{
    position:absolute;
    inset:0;
    z-index:8;
    display:grid;
    place-items:center;
    pointer-events:none;
    opacity:0;
    transition:.2s;
}

.loading.show{
    opacity:1;
}

.loader{
    width:35px;
    height:35px;
    border:3px solid rgba(255,255,255,.25);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .75s linear infinite;
}

.pause-indicator{
    position:absolute;
    z-index:14;
    inset:0;
    display:grid;
    place-items:center;
    pointer-events:none;
    opacity:0;
}

.pause-indicator span{
    width:75px;
    height:75px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:rgba(0,0,0,.48);
    backdrop-filter:blur(12px);
    font-size:27px;
}

.short.paused .pause-indicator{
    opacity:1;
}

.side-hint{
    position:fixed;
    z-index:18;
    right:22px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
    color:rgba(255,255,255,.55);
    font-size:11px;
    font-weight:750;
    pointer-events:none;
}

.chev{
    font-size:20px;
    animation:bounce 1.5s infinite;
}

@keyframes bounce{
    50%{transform:translateY(5px)}
}

.search-panel{
    position:fixed;
    z-index:80;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    width:min(560px,calc(100% - 30px));
    display:none;
}

.search-panel.open{
    display:block;
}

.search-box{
    display:flex;
    gap:8px;
    padding:8px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:17px;
    background:rgba(20,20,20,.86);
    backdrop-filter:blur(25px);
}

.search-box input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    padding:11px 13px;
}

.primary{
    border-radius:12px;
    padding:0 15px;
    background:#fff;
    color:#111;
    font-weight:850;
    cursor:pointer;
}

.modal-backdrop{
    position:fixed;
    z-index:100;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.64);
    backdrop-filter:blur(10px);
}

.modal-backdrop.open{
    display:flex;
}

.modal{
    width:min(520px,100%);
    max-height:90vh;
    overflow:auto;
    padding:20px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:24px;
    background:rgba(20,20,20,.95);
    box-shadow:0 30px 100px rgba(0,0,0,.55);
}

.modal[hidden]{
    display:none;
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:17px;
}

.modal h2{
    margin:0;
    font-size:20px;
}

.close{
    width:36px;
    height:36px;
    border-radius:11px;
    background:rgba(255,255,255,.08);
    cursor:pointer;
}

.settings-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 0;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.switch{
    width:48px;
    height:28px;
    padding:3px;
    border-radius:99px;
    background:#333;
    cursor:pointer;
}

.switch i{
    display:block;
    width:22px;
    height:22px;
    border-radius:50%;
    background:#fff;
    transition:.2s;
}

.switch.on{
    background:#fff;
}

.switch.on i{
    background:#111;
    transform:translateX(20px);
}

.upload-box{
    margin-top:15px;
    padding:23px;
    text-align:center;
    border:1px dashed rgba(255,255,255,.23);
    border-radius:18px;
}

.upload-label{
    display:inline-flex;
    padding:11px 16px;
    border-radius:12px;
    background:#fff;
    color:#111;
    font-weight:850;
    cursor:pointer;
}

.upload-label input{
    display:none;
}

.comment-list{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.comment{
    display:flex;
    gap:11px;
}

.comment .avatar{
    width:36px;
    height:36px;
    min-width:36px;
    font-size:11px;
}

.comment strong{
    font-size:13px;
}

.comment p{
    margin:3px 0 0;
    color:#ccc;
    font-size:14px;
    line-height:1.4;
}

.comment-input{
    display:flex;
    gap:8px;
    margin-top:18px;
}

.comment-input input{
    flex:1;
    min-width:0;
    border:1px solid rgba(255,255,255,.12);
    outline:0;
    background:rgba(255,255,255,.07);
    color:#fff;
    border-radius:13px;
    padding:12px 14px;
}

.toast{
    position:fixed;
    z-index:200;
    left:50%;
    bottom:24px;
    transform:translate(-50%,20px);
    padding:11px 15px;
    border-radius:13px;
    background:rgba(25,25,25,.92);
    border:1px solid rgba(255,255,255,.13);
    backdrop-filter:blur(15px);
    opacity:0;
    pointer-events:none;
    transition:.25s;
    font-size:13px;
    font-weight:750;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.empty{
    width:100%;
    height:100%;
    display:grid;
    place-items:center;
    text-align:center;
    padding:30px;
}

.empty-card{
    max-width:450px;
}

.empty-card h2{
    margin:0 0 9px;
    font-size:28px;
}

.empty-card p{
    color:#aaa;
    line-height:1.5;
}

@media(min-width:900px){
    .short{
        width:min(100%,760px);
        margin:auto;
    }

    .topbar{
        left:50%;
        right:auto;
        width:min(100%,760px);
        transform:translateX(-50%);
    }
}

@media(max-width:700px){
    .topbar{
        height:64px;
        padding:0 12px;
    }

    .brand{
        font-size:18px;
    }

    .logo{
        width:30px;
        height:30px;
    }

    .tabs{
        right:80px;
        left:auto;
        transform:none;
    }

    .tab{
        padding:7px 10px;
        font-size:13px;
    }

    .top-actions{
        gap:5px;
    }

    .icon-btn{
        width:36px;
        height:36px;
        border-radius:11px;
    }

    .info{
        left:15px;
        bottom:24px;
        max-width:calc(100% - 105px);
    }

    .caption{
        font-size:14px;
    }

    .short-actions{
        right:9px;
        bottom:24px;
        width:52px;
        gap:11px;
    }

    .bubble{
        width:45px;
        height:45px;
    }

    .sound-btn{
        right:12px;
        top:77px;
    }

    .side-hint{
        display:none;
    }
}
</style>

</head>

<body>

<div class="app">

<header class="topbar">

<div class="brand">
    <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
            <path d="M8 4l10 6-10 6V4z"/>
            <path d="M5 8v8"/>
        </svg>
    </div>
    ShortsFlow
</div>

<nav class="tabs">
    <button class="tab active" data-feed="for-you">For You</button>
    <button class="tab" data-feed="following">Following</button>
</nav>

<div class="top-actions">

<button class="icon-btn" id="searchBtn" aria-label="Search">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<circle cx="10.8" cy="10.8" r="6.8"/>
<path d="m16 16 5 5"/>
</svg>
</button>

<button class="icon-btn" id="settingsBtn" aria-label="Settings">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<circle cx="12" cy="12" r="3"/>
<path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.1h-2.6v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6v-2.6h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1L9 6.9l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.1h2.6v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.1v2.6h-.1a1.7 1.7 0 0 0-1.1.7Z"/>
</svg>
</button>

</div>
</header>

<div class="search-panel" id="searchPanel">
<div class="search-box">
<input id="searchInput" type="search" placeholder="Search Shorts..." autocomplete="off">
<button class="primary" id="clearSearch">Clear</button>
</div>
</div>

<main class="feed" id="feed"></main>

<div class="side-hint">
<span>SWIPE</span>
<span class="chev">⌄</span>
</div>

</div>

<div class="modal-backdrop" id="modalBackdrop">

<section class="modal" id="commentsModal" hidden>

<div class="modal-head">
<h2>Comments</h2>
<button class="close" data-close>✕</button>
</div>

<div class="comment-list" id="commentList"></div>

<form class="comment-input" id="commentForm">
<input id="commentInput" maxlength="180" placeholder="Add a comment..." autocomplete="off">
<button class="primary">Post</button>
</form>

</section>

<section class="modal" id="settingsModal" hidden>

<div class="modal-head">
<h2>Settings</h2>
<button class="close" data-close>✕</button>
</div>

<div class="settings-row">
<div>
<strong>Autoplay</strong>
<div style="color:#888;font-size:12px;margin-top:3px">
Play the visible Short automatically
</div>
</div>
<div class="switch on" id="autoplaySwitch"><i></i></div>
</div>

<div class="settings-row">
<div>
<strong>Remember likes</strong>
<div style="color:#888;font-size:12px;margin-top:3px">
Save likes in this browser
</div>
</div>
<div class="switch on" id="likesSwitch"><i></i></div>
</div>

<div class="upload-box">
<h3 style="margin:0 0 7px">Add your own Short</h3>
<p style="margin:0 0 15px;color:#888;font-size:13px">
Choose an MP4, WebM or other browser-supported video.
</p>

<label class="upload-label">
Choose video
<input id="videoUpload" type="file" accept="video/*" multiple>
</label>
</div>

</section>

<section class="modal" id="shareModal" hidden>

<div class="modal-head">
<h2>Share Short</h2>
<button class="close" data-close>✕</button>
</div>

<p style="color:#aaa;font-size:14px">
Share this Short with another app or copy its link.
</p>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">

<button class="primary" id="nativeShare" style="height:46px">
Share
</button>

<button class="follow" id="copyLink" style="height:46px">
Copy link
</button>

</div>

</section>

</div>

<div class="toast" id="toast"></div>

<script>

/* =========================================================
   SAFE STORAGE
   ========================================================= */

function loadJSON(key,fallback){

    try{

        const value = localStorage.getItem(key);

        if(!value){
            return fallback;
        }

        return JSON.parse(value);

    }catch(error){

        console.warn(
            "ShortsFlow storage error:",
            error
        );

        return fallback;
    }
}

function saveJSON(key,value){

    try{

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

    }catch(error){

        console.warn(
            "ShortsFlow could not save:",
            error
        );
    }
}

/* =========================================================
   HELPERS
   ========================================================= */

function esc(value){

    return String(value)
        .replace(/[&<>"']/g,char=>({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[char]));
}


function formatNumber(number){

    if(number>=1000000){
        return (
            number/1000000
        ).toFixed(1)+"M";
    }

    if(number>=1000){
        return (
            number/1000
        ).toFixed(
            number%1000>=100 ? 1 : 0
        )+"K";
    }

    return String(number);
}


function showToast(message){

    if(!toast){
        return;
    }

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer =
        setTimeout(
            ()=>{
                toast.classList.remove("show");
            },
            1900
        );
}

function renderFeed(list){

    try{

        if(!Array.isArray(list)){
            list = videos;
        }

        feed.innerHTML = "";

        if(!list.length){

            feed.innerHTML = `
                <div class="empty">
                    <div class="empty-card">
                        <h2>No Shorts found</h2>
                        <p>
                            Try another search or add your own
                            video from Settings.
                        </p>
                    </div>
                </div>
            `;

            return;
        }

        list.forEach(
            (videoData,index)=>{
                createShort(videoData,index);
            }
        );

        setupObserver();

        requestAnimationFrame(
            ()=>{
                activateIndex(
                    Math.min(
                        currentIndex,
                        list.length-1
                    )
                );
            }
        );

    }catch(error){

        console.error(
            "ShortsFlow render error:",
            error
        );

        feed.innerHTML = `

                    <h2>ShortsFlow</h2>
                    <p>

                        style="height:44px;margin-top:12px"

}

/* =========================================================
   VIDEO SETUP
   ========================================================= */

function setupVideo(section,v){

    const video =
        section.querySelector(".video");

    const loading =
        section.querySelector(".loading");

    const fallback =
        section.querySelector(".fallback");

    if(!video){
        return;
    }

    video.addEventListener(
        "loadstart",
        ()=>{
            loading.classList.add("show");
        }
    );

    video.addEventListener(
        "canplay",
        ()=>{
            loading.classList.remove("show");
            fallback.classList.add("hidden");
        }
    );

    video.addEventListener(
        "playing",
        ()=>{
            loading.classList.remove("show");
            fallback.classList.add("hidden");
        }
    );

    video.addEventListener(
        "waiting",
        ()=>{
            loading.classList.add("show");
        }
    );

    video.addEventListener(
        "timeupdate",
        ()=>{
            if(
                video.duration &&
                Number.isFinite(video.duration)
            ){

                const percentage =
                    (
                        video.currentTime /
                        video.duration
                    ) * 100;

                const bar =
                    section.querySelector(
                        ".progress i"
                    );

                if(bar){
                    bar.style.width =
                        percentage+"%";
                }
            }
        }
    );

    video.addEventListener(
        "error",
        ()=>{
            loading.classList.remove("show");
            fallback.classList.remove("hidden");

            /*
               IMPORTANT:
               A failed video ONLY affects this Short.
               It does NOT stop the application.
            */
        }
    );
}


/* =========================================================
   OBSERVER
   ========================================================= */

function setupObserver(){

    if(observer){
        observer.disconnect();
    }

    const shorts =
        [...document.querySelectorAll(".short")];

    if(!shorts.length){
        return;
    }

    observer =
        new IntersectionObserver(
            entries=>{

                entries.forEach(
                    entry=>{

                        if(
                            entry.isIntersecting &&
                            entry.intersectionRatio>=.65
                        ){

                            const index =
                                shorts.indexOf(
                                    entry.target
                                );

                            if(index>=0){

                                currentIndex =
                                    index;

                                activateShort(
                                    entry.target
                                );
                            }
                        }
                    }
                );

            },
            {
                root:feed,
                threshold:[.65,.8]
            }
        );

    shorts.forEach(
        short=>{
            observer.observe(short);
        }
    );
}


/* =========================================================
   ACTIVATION
   ========================================================= */

function activateIndex(index){

    const shorts =
        [...document.querySelectorAll(".short")];

    const target =
        shorts[index];

    if(!target){
        return;
    }

    currentIndex =
        index;

    target.scrollIntoView({
        behavior:"auto",
        block:"start"
    });

    activateShort(target);
}


function activateShort(short){

    if(!short){
        return;
    }

    document
        .querySelectorAll(".short")
        .forEach(
            other=>{

                const video =
                    other.querySelector(".video");

                if(!video){
                    return;
                }

                if(other===short){

                    other.classList.add(
                        "active"
                    );

                    if(autoplay){

                        video.play()
                            .catch(
                                ()=>{}
                            );
                    }

                }else{

                    other.classList.remove(
                        "active"
                    );

                    video.pause();

                    /*
                       Restart when leaving the Short.
                       When the user comes back, it starts
                       from the beginning.
                    */
                    try{
                        video.currentTime = 0;
                    }catch(error){}
                }
            }
        );
}


/* =========================================================
   CURRENT SHORT
   ========================================================= */

function getCurrentShort(){

    const shorts =
        [...document.querySelectorAll(".short")];

    return (
        shorts[currentIndex] ||
        shorts[0] ||
        null
    );
}


/* =========================================================
   FEED CLICK EVENTS
   ========================================================= */

feed.addEventListener(
    "click",
    event=>{

        const short =
            event.target.closest(".short");

        if(!short){
            return;
        }

        const index =
            Number(short.dataset.index);

        const videoData =
            videos[index];

        if(!videoData){
            return;
        }

        const action =
            event.target.closest(
                "[data-action]"
            );

        if(action){

            const type =
                action.dataset.action;

            if(type==="like"){
                toggleLike(
                    videoData,
                    short
                );
            }

            if(type==="comments"){
                openComments(
                    videoData
                );
            }

            if(type==="share"){
                openShare(
                    videoData
                );
            }

            if(type==="more"){
                showToast(
                    "More options coming soon"
                );
            }

            return;
        }

        if(
            event.target.closest(".follow")
        ){

            toggleFollow(
                videoData,
                short
            );

            return;
        }

        if(
            event.target.closest(".sound-btn")
        ){

            toggleSound(short);

            return;
        }

        if(
            event.target.closest(".video-wrap")
        ){

            togglePlay(short);

            return;
        }
    }
);


/* =========================================================
   DOUBLE TAP LIKE
   ========================================================= */

feed.addEventListener(
    "dblclick",
    event=>{

        const short =
            event.target.closest(".short");

        if(!short){
            return;
        }

        const index =
            Number(short.dataset.index);

        const videoData =
            videos[index];

        if(
            videoData &&
            !liked.includes(videoData.id)
        ){

            toggleLike(
                videoData,
                short
            );
        }
    }
);


/* =========================================================
   LIKE
   ========================================================= */

function toggleLike(videoData,short){

    const exists =
        liked.includes(
            videoData.id
        );

    if(exists){

        liked =
            liked.filter(
                id=>id!==videoData.id
            );

    }else{

        liked.push(
            videoData.id
        );
    }

    if(rememberLikes){

        saveJSON(
            "shortsflow-liked",
            liked
        );
    }

    const button =
        short.querySelector(".like");

    if(button){

        button.classList.toggle(
            "liked",
            !exists
        );

        const count =
            button.querySelector(".count");

        if(count){

            count.textContent =
                formatNumber(
                    videoData.likes +
                    (!exists?1:0)
                );
        }
    }

    if(!exists){
        showToast("Liked ❤️");
    }
}


/* =========================================================
   FOLLOW
   ========================================================= */

function toggleFollow(videoData,short){

    const exists =
        following.includes(
            videoData.creator
        );

    if(exists){

        following =
            following.filter(
                creator =>
                    creator!==videoData.creator
            );

    }else{

        following.push(
            videoData.creator
        );
    }

    saveJSON(
        "shortsflow-following",
        following
    );

    const button =
        short.querySelector(".follow");

    if(button){

        button.classList.toggle(
            "following",
            !exists
        );

        button.textContent =
            exists ?
            "Follow" :
            "Following";
    }

    showToast(
        exists ?
        "Unfollowed" :
        "Following @"+videoData.creator
    );
}


/* =========================================================
   PLAY / PAUSE
   ========================================================= */

function togglePlay(short){

    const video =
        short.querySelector(".video");

    if(!video){
        return;
    }

    if(video.paused){

        video.play()
            .catch(()=>{});

        short.classList.remove(
            "paused"
        );

    }else{

        video.pause();

        short.classList.add(
            "paused"
        );
    }
}


/* =========================================================
   SOUND
   ========================================================= */

function toggleSound(short){

    const video =
        short.querySelector(".video");

    if(!video){
        return;
    }

    const soundOn =
        video.muted;

    document
        .querySelectorAll(".video")
        .forEach(
            other=>{
                other.muted=true;
            }
        );

    video.muted =
        !soundOn;

    const button =
        short.querySelector(
            ".sound-btn"
        );

    if(button){

        button.innerHTML =
            video.muted ?
            icon("mute") :
            icon("volume");
    }

    showToast(
        video.muted ?
        "Muted" :
        "Sound on"
    );
}

function openComments(videoData){

    const list =
        document.getElementById(
            "commentList"
        );

    list.innerHTML="";

    const saved =
        comments[videoData.id];

    const commentList =
        saved && saved.length ?
        saved :
        [
            {
                name:"Alex",
                avatar:"A",
                text:"This is actually really cool 👀"
            },
            {
                name:"Mia",

        ];

    commentList.forEach(

            const row =
                document.createElement(

                );

                "comment";

            row.innerHTML = `
                <div class="avatar">
                    ${esc(comment.avatar)}
                </div>

document.getElementById(
    "commentForm"
).addEventListener(
    "submit",
    event=>{

        event.preventDefault();

        const input =
            document.getElementById(
                "commentInput"
            );

        const text =
            input.value.trim();

        if(
            !text ||
            !currentShare
        ){
            return;
        }

        if(
            !comments[currentShare.id]
        ){

            comments[currentShare.id]=[];
        }

        comments[currentShare.id].push({
            name:"You",
            avatar:"Y",
            text:text
        });

        saveJSON(
            "shortsflow-comments",
            comments
        );

        input.value="";

        openComments(
            currentShare
        );

        showToast(
            "Comment posted"
        );
    }
);

   SHARE
   ========================================================= */

function openShare(videoData){

    openModal(
        shareModal
    );

document.getElementById(
    "copyLink"
).addEventListener(
    "click",
    async()=>{

            return;
        }

        const link =
            location.href
            .split("#")[0] +
            "#short-" +
            encodeURIComponent(
                currentShare.id
            );

            await navigator.clipboard.writeText(

            );

            showToast(
                "Link copied"
            );

        }catch(error){

            showToast(
                "Copy the page URL manually"
            );
        }
    }
);


document.getElementById(
    "nativeShare"
).addEventListener(
    "click",
    async()=>{

        if(!currentShare){
            return;
        }

        const link =
            location.href
            .split("#")[0] +
            "#short-" +
            encodeURIComponent(
                currentShare.id
            );

        if(
            navigator.share
        ){

            try{

                await navigator.share({
                    title:"ShortsFlow",
                    text:currentShare.caption,
                    url:link
                });

                closeModal();

            }catch(error){}

        }else{

            try{

                await navigator.clipboard.writeText(
                    link
                );

                showToast(
                    "Link copied"
                );

            }catch(error){

                showToast(
                    "Copy the page URL manually"
                );
            }
        }

);

document.getElementById(

document.getElementById(
    "clearSearch"
).addEventListener(

            "searchInput"
        ).value="";

        renderFeed(
            videos
        );
    }
);


document.getElementById(
    "searchInput"
).addEventListener(
    "input",
    event=>{

        const query =
            event.target.value
            .toLowerCase()
            .trim();

        if(!query){

            currentIndex=0;

            renderFeed(
                videos
            );

            return;
        }

        const results =
            videos.filter(
                video=>{

                    return [
                        video.creator,
                        video.caption,
                        video.tags,
                        video.category
                    ]
                    .join(" ")
                    .toLowerCase()
                    .includes(query);
                }
            );

        currentIndex=0;

        renderFeed(
            results
        );
    }
);


/* =========================================================
   FEED TABS
   ========================================================= */

document.querySelectorAll(
    ".tab"
).forEach(
    tab=>{

        tab.addEventListener(
            "click",
            ()=>{

                document.querySelectorAll(
                    ".tab"
                ).forEach(
                    other=>{
                        other.classList.remove(
                            "active"
                        );
                    }
                );

                tab.classList.add(
                    "active"
                );

                currentIndex=0;

                if(
                    tab.dataset.feed===
                    "following"
                ){

                    const list =
                        videos.filter(
                            video =>
                                following.includes(
                                    video.creator
                                )
                        );

                    if(!list.length){

                        showToast(
                            "Follow creators to see them here"
                        );

                        return;
                    }

                    renderFeed(list);

                }else{

                    renderFeed(
                        videos
                    );
                }
            }
        );
    }
);

}

        setSwitch(
            document.getElementById(
                "likesSwitch"
            ),
            rememberLikes
        );
    }
);


/* =========================================================
   LOCAL VIDEO UPLOADS
   ========================================================= */

document.getElementById(
    "videoUpload"
).addEventListener(
    "change",
    event=>{

        const files =
            [...event.target.files];

        if(!files.length){
            return;
        }

        files.forEach(
            (file,index)=>{

                const url =
                    URL.createObjectURL(
                        file
                    );

                videos.push({

                    id:
                        "local-" +
                        Date.now() +
                        "-" +
                        index,

                    src:url,

                    creator:
                        "Your Upload",

                    avatar:
                        "YOU",

                    caption:
                        file.name.replace(
                            /\.[^.]+$/,
                            ""
                        ),

                    tags:
                        "#myshort #upload",

                    likes:0,

                    comments:0,

                    audio:
                        "Original sound · Your Upload",

                    category:
                        "upload"
                });
            }
        );

        closeModal();

        currentIndex =
            videos.length -
            files.length;

        renderFeed(
            videos
        );

        showToast(
            files.length===1 ?
            "Short added" :
            "Shorts added"
        );

        event.target.value="";
    }
);


/* =========================================================
   MOUSE WHEEL NAVIGATION
   ========================================================= */

feed.addEventListener(
    "wheel",
    event=>{

        if(
            Math.abs(event.deltaY)<10 ||
            wheelLock
        ){
            return;
        }

        wheelLock=true;

        const current =
            getCurrentShort();

        const target =
            event.deltaY>0 ?
            current?.nextElementSibling :
            current?.previousElementSibling;

        if(
            target &&
            target.classList.contains(
                "short"
            )
        ){

            target.scrollIntoView({
                behavior:"smooth",
                block:"start"
            });
        }

        setTimeout(
            ()=>{
                wheelLock=false;
            },
            550
        );
    },
    {
        passive:true
    }
);


/* =========================================================
   TOUCH NAVIGATION
   ========================================================= */

feed.addEventListener(
    "touchstart",
    event=>{

        touchStartY =
            event.touches[0].clientY;

    },
    {
        passive:true
    }
);


feed.addEventListener(
    "touchend",
    event=>{

        const endY =
            event.changedTouches[0].clientY;

        const distance =
            touchStartY-endY;

        if(
            Math.abs(distance)<55
        ){
            return;
        }

        const current =
            getCurrentShort();

        const target =
            distance>0 ?
            current?.nextElementSibling :
            current?.previousElementSibling;

        if(
            target &&
            target.classList.contains(
                "short"
            )
        ){

            target.scrollIntoView({
                behavior:"smooth",
                block:"start"
            });
        }
    },
    {
        passive:true
    }
);


/* =========================================================
   KEYBOARD NAVIGATION
   ========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Escape"
        ){

            closeModal();

            return;
        }

        if(
            event.target.matches(
                "input,textarea"
            )
        ){
            return;
        }

        if(
            event.key==="ArrowDown" ||
            event.key==="PageDown"
        ){

            event.preventDefault();

            const current =
                getCurrentShort();

            const target =
                current?.nextElementSibling;

            if(
                target &&
                target.classList.contains(
                    "short"
                )
            ){

                target.scrollIntoView({
                    behavior:"smooth",
                    block:"start"
                });
            }
        }

        if(
            event.key==="ArrowUp" ||
            event.key==="PageUp"
        ){

            event.preventDefault();

            const current =
                getCurrentShort();

            const target =
                current?.previousElementSibling;

            if(
                target &&
                target.classList.contains(
                    "short"
                )
            ){

                target.scrollIntoView({
                    behavior:"smooth",
                    block:"start"
                });
            }
        }

        if(
            event.key===" " &&
            !event.ctrlKey &&
            !event.altKey
        ){

            event.preventDefault();

            const current =
                getCurrentShort();

            if(current){
                togglePlay(
                    current
                );
            }
        }
    }
);


/* =========================================================
   HASH LINKS
   ========================================================= */

window.addEventListener(
    "hashchange",
    ()=>{
        openHashShort();
    }
);


function openHashShort(){

    const hash =
        location.hash;

    if(
        !hash.startsWith(
            "#short-"
        )
    ){
        return;
    }

    const id =
        decodeURIComponent(
            hash.slice(7)
        );

    const index =
        videos.findIndex(
            video =>
                video.id===id
        );

    if(index<0){
        return;
    }

    currentIndex =
        index;

    setTimeout(
        ()=>{
            activateIndex(
                index
            );
        },
        50
    );
}


/* =========================================================
   STARTUP
   ========================================================= */

/*
   Render FIRST.
   Nothing involving video playback is allowed to
   prevent the actual interface from appearing.
*/

try{

    renderFeed(
        videos
    );

}catch(error){

    console.error(
        "ShortsFlow startup error:",
        error
    );

    feed.innerHTML = `
        <div class="empty">
            <div class="empty-card">
                <h2>ShortsFlow</h2>
                <p>
                    The app loaded, but something went
                    wrong while creating the feed.
                </p>
                <button
                    class="primary"
                    style="height:44px;margin-top:12px"
                    onclick="location.reload()"
                >
                    Reload ShortsFlow
                </button>
            </div>
        </div>
    `;
}

openHashShort();

</script>
