<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050505;
        color: white;
        font-family:
            Inter,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Helvetica,
            Arial,
            sans-serif;
    }

    body {
        overscroll-behavior: none;
    }

    button {
        font: inherit;
    }

    .app {
        position: relative;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 20%, rgba(50, 50, 50, 0.18), transparent 35%),
            #050505;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
        position: fixed;
        z-index: 100;
        top: 0;
        left: 0;
        right: 0;

        height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;

        padding:
            env(safe-area-inset-top)
            18px
            0
            18px;

        background: linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0.72),
            rgba(0, 0, 0, 0)
        );

        pointer-events: none;
    }

    .brand,
    .top-actions {
        pointer-events: auto;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 10px;

        padding: 8px 12px;
        border-radius: 16px;

        background: rgba(20, 20, 20, 0.58);
        border: 1px solid rgba(255,255,255,0.08);

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        box-shadow:
            0 10px 30px rgba(0,0,0,0.22),
            inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .brand-icon {
        position: relative;
        width: 27px;
        height: 27px;
        border-radius: 8px;

        background:
            linear-gradient(145deg, #ff304f, #ff0050);

        box-shadow:
            0 4px 14px rgba(255, 0, 80, 0.32);
    }

    .brand-icon::before {
        content: "";
        position: absolute;

        left: 10px;
        top: 7px;

        width: 0;
        height: 0;

        border-top: 7px solid transparent;
        border-bottom: 7px solid transparent;
        border-left: 10px solid white;
    }

    .brand span {
        font-size: 15px;
        font-weight: 750;
        letter-spacing: -0.2px;
    }

    .top-actions {
        display: flex;
        gap: 8px;
    }

    .icon-button {
        width: 42px;
        height: 42px;

        display: grid;
        place-items: center;

        border: 1px solid rgba(255,255,255,0.09);
        border-radius: 50%;

        color: white;
        background: rgba(20,20,20,0.58);

        cursor: pointer;

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        box-shadow:
            0 8px 24px rgba(0,0,0,0.22),
            inset 0 1px 0 rgba(255,255,255,0.05);

        transition:
            transform .18s ease,
            background .18s ease;
    }

    .icon-button:hover {
        background: rgba(50,50,50,0.78);
        transform: scale(1.06);
    }

    .icon-button:active {
        transform: scale(.92);
    }

    /* =========================
       FEED
    ========================= */

    .feed {
        width: 100%;
        height: 100dvh;

        overflow-y: auto;
        overflow-x: hidden;

        scroll-snap-type: y mandatory;
        scroll-behavior: smooth;

        scrollbar-width: none;
        overscroll-behavior-y: contain;
    }

    .feed::-webkit-scrollbar {
        display: none;
    }

    .short {
        position: relative;

        width: 100%;
        min-height: 100dvh;
        height: 100dvh;

        display: flex;
        align-items: center;
        justify-content: center;

        scroll-snap-align: start;
        scroll-snap-stop: always;

        isolation: isolate;
    }

    .short::before {
        content: "";

        position: absolute;
        z-index: -2;
        inset: 0;

        background:
            radial-gradient(
                circle at 50% 45%,
                rgba(60,60,60,.15),
                transparent 45%
            );
    }

    .video-shell {
        position: relative;

        width: min(430px, 92vw);
        height: min(765px, 86dvh);

        max-height: calc(100dvh - 100px);

        overflow: hidden;

        border-radius: 22px;

        background: #101010;

        box-shadow:
            0 25px 80px rgba(0,0,0,.62),
            0 0 0 1px rgba(255,255,255,.07),
            inset 0 1px 0 rgba(255,255,255,.05);

        transform: translateZ(0);
    }

    .video-shell::after {
        content: "";

        position: absolute;
        inset: 0;

        pointer-events: none;

        border-radius: inherit;

        box-shadow:
            inset 0 0 50px rgba(0,0,0,.18),
            inset 0 1px 0 rgba(255,255,255,.08);
    }

    .video-shell iframe {
        width: 100%;
        height: 100%;

        display: block;

        border: 0;
        background: #080808;
    }

    .video-loading {
        position: absolute;
        z-index: 3;
        inset: 0;

        display: grid;
        place-items: center;

        background:
            radial-gradient(
                circle,
                rgba(30,30,30,.7),
                rgba(5,5,5,.94)
            );

        pointer-events: none;

        transition:
            opacity .35s ease,
            visibility .35s ease;
    }

    .video-loading.hidden {
        opacity: 0;
        visibility: hidden;
    }

    .spinner {
        width: 34px;
        height: 34px;

        border-radius: 50%;

        border: 3px solid rgba(255,255,255,.16);
        border-top-color: white;

        animation: spin .75s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    /* =========================
       ACTION BUTTONS
    ========================= */

    .actions {
        position: absolute;
        z-index: 20;

        right: max(18px, calc((100vw - 520px) / 2));

        bottom: 100px;

        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .action {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
    }

    .action-button {
        width: 52px;
        height: 52px;

        display: grid;
        place-items: center;

        border: 1px solid rgba(255,255,255,.1);
        border-radius: 50%;

        color: white;
        background: rgba(18,18,18,.72);

        font-size: 24px;
        line-height: 1;

        cursor: pointer;

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        box-shadow:
            0 10px 25px rgba(0,0,0,.28),
            inset 0 1px 0 rgba(255,255,255,.06);

        transition:
            transform .18s ease,
            background .18s ease,
            color .18s ease;
    }

    .action-button:hover {
        transform: scale(1.08);
        background: rgba(48,48,48,.86);
    }

    .action-button:active {
        transform: scale(.9);
    }

    .action-button.liked {
        color: #ff3158;
        background: rgba(70,20,32,.82);
    }

    .action-label {
        font-size: 11px;
        font-weight: 650;

        color: rgba(255,255,255,.82);

        text-shadow:
            0 2px 8px rgba(0,0,0,.8);
    }

    /* =========================
       INFO
    ========================= */

    .info {
        position: absolute;
        z-index: 15;

        left: max(18px, calc((100vw - 520px) / 2));
        right: 110px;

        bottom: 38px;

        max-width: 560px;

        text-shadow:
            0 2px 12px rgba(0,0,0,.9);
    }

    .creator {
        margin-bottom: 7px;

        font-size: 15px;
        font-weight: 800;

        color: white;
    }

    .description {
        font-size: 14px;
        line-height: 1.4;

        color: rgba(255,255,255,.9);
    }

    .category {
        display: inline-flex;

        margin-top: 9px;
        padding: 5px 9px;

        border-radius: 999px;

        font-size: 10px;
        font-weight: 750;

        color: rgba(255,255,255,.85);

        background: rgba(20,20,20,.68);
        border: 1px solid rgba(255,255,255,.09);

        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    /* =========================
       SCROLL HINT
    ========================= */

    .scroll-hint {
        position: fixed;
        z-index: 50;

        left: 50%;
        bottom: 15px;

        transform: translateX(-50%);

        padding: 8px 13px;

        border-radius: 999px;

        background: rgba(15,15,15,.72);
        border: 1px solid rgba(255,255,255,.08);

        color: rgba(255,255,255,.68);

        font-size: 11px;
        font-weight: 600;

        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        pointer-events: none;

        transition:
            opacity .35s ease,
            transform .35s ease;
    }

    .scroll-hint.hidden {
        opacity: 0;
        transform:
            translateX(-50%)
            translateY(8px);
    }

    /* =========================
       SETTINGS
    ========================= */

    .settings-overlay {
        position: fixed;
        z-index: 500;

        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;

        background: rgba(0,0,0,.58);

        opacity: 0;
        visibility: hidden;

        transition:
            opacity .25s ease,
            visibility .25s ease;

        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    .settings-overlay.open {
        opacity: 1;
        visibility: visible;
    }

    .settings-panel {
        width: min(430px, 100%);

        padding: 24px;

        border-radius: 24px;

        background:
            linear-gradient(
                145deg,
                rgba(32,32,32,.97),
                rgba(13,13,13,.97)
            );

        border: 1px solid rgba(255,255,255,.1);

        box-shadow:
            0 30px 100px rgba(0,0,0,.6),
            inset 0 1px 0 rgba(255,255,255,.06);

        transform: translateY(16px) scale(.97);

        transition: transform .25s ease;
    }

    .settings-overlay.open .settings-panel {
        transform: translateY(0) scale(1);
    }

    .settings-header {
        display: flex;
        align-items: center;
        justify-content: space-between;

        margin-bottom: 22px;
    }

    .settings-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -.5px;
    }

    .close-button {
        width: 36px;
        height: 36px;

        border: 0;
        border-radius: 50%;

        background: rgba(255,255,255,.08);
        color: white;

        cursor: pointer;

        transition: .18s ease;
    }

    .close-button:hover {
        background: rgba(255,255,255,.15);
    }

    .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 18px;

        padding: 16px 0;

        border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .setting-row:last-of-type {
        border-bottom: 0;
    }

    .setting-info {
        min-width: 0;
    }

    .setting-name {
        font-size: 14px;
        font-weight: 700;
    }

    .setting-description {
        margin-top: 3px;

        font-size: 11px;
        line-height: 1.4;

        color: rgba(255,255,255,.48);
    }

    .toggle {
        position: relative;

        width: 48px;
        height: 28px;

        flex: 0 0 auto;

        border: 0;
        border-radius: 999px;

        background: #3b3b3b;

        cursor: pointer;

        transition: background .2s ease;
    }

    .toggle::after {
        content: "";

        position: absolute;

        width: 22px;
        height: 22px;

        top: 3px;
        left: 3px;

        border-radius: 50%;

        background: white;

        box-shadow: 0 2px 7px rgba(0,0,0,.35);

        transition: transform .2s ease;
    }

    .toggle.active {
        background: #28c76f;
    }

    .toggle.active::after {
        transform: translateX(20px);
    }

    .reset-button {
        width: 100%;

        margin-top: 20px;
        padding: 13px 16px;

        border: 1px solid rgba(255,255,255,.09);
        border-radius: 13px;

        background: rgba(255,255,255,.07);
        color: white;

        font-weight: 700;

        cursor: pointer;

        transition:
            background .18s ease,
            transform .18s ease;
    }

    .reset-button:hover {
        background: rgba(255,255,255,.12);
    }

    .reset-button:active {
        transform: scale(.98);
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
        position: fixed;
        z-index: 1000;

        left: 50%;
        bottom: 28px;

        transform:
            translateX(-50%)
            translateY(15px);

        padding: 11px 16px;

        border-radius: 999px;

        background: rgba(30,30,30,.94);
        border: 1px solid rgba(255,255,255,.1);

        color: white;

        font-size: 12px;
        font-weight: 650;

        opacity: 0;
        pointer-events: none;

        transition:
            opacity .25s ease,
            transform .25s ease;

        box-shadow: 0 10px 35px rgba(0,0,0,.35);
    }

    .toast.show {
        opacity: 1;
        transform:
            translateX(-50%)
            translateY(0);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {
        .topbar {
            height: 64px;
            padding-left: 12px;
            padding-right: 12px;
        }

        .brand {
            padding: 7px 10px;
        }

        .brand span {
            font-size: 14px;
        }

        .video-shell {
            width: min(100vw, 430px);
            height: min(82dvh, 765px);

            border-radius: 18px;
        }

        .actions {
            right: 10px;
            bottom: 120px;
            gap: 10px;
        }

        .action-button {
            width: 47px;
            height: 47px;
            font-size: 21px;
        }

        .info {
            left: 13px;
            right: 75px;
            bottom: 35px;
        }

        .description {
            font-size: 13px;
        }

        .scroll-hint {
            bottom: 8px;
        }
    }

    @media (max-height: 650px) {
        .video-shell {
            height: 82dvh;
        }

        .actions {
            bottom: 82px;
        }

        .info {
            bottom: 18px;
        }
    }

    /* =========================
       REDUCED MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            scroll-behavior: auto !important;
            animation-duration: .001ms !important;
            transition-duration: .001ms !important;
        }
    }
</style>
</head>

/* =========================================================
   STATE
========================================================= */

let autoplay =
    localStorage.getItem("shortsflow_autoplay") !== "false";

let muted =
    localStorage.getItem("shortsflow_muted") !== "false";

let currentIndex = 0;

let observer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const feed = document.getElementById("feed");
const settingsButton = document.getElementById("settingsButton");
const settingsOverlay = document.getElementById("settingsOverlay");
const closeSettings = document.getElementById("closeSettings");

const autoplayToggle =
    document.getElementById("autoplayToggle");

const muteToggle =
    document.getElementById("muteToggle");

const resetFeed =
    document.getElementById("resetFeed");

const toast =
    document.getElementById("toast");

const scrollHint =
    document.getElementById("scrollHint");


/* =========================================================
   YOUTUBE URL
========================================================= */

function youtubeURL(videoId) {

    const params = new URLSearchParams({
        autoplay: autoplay ? "1" : "0",
        mute: muted ? "1" : "0",
        playsinline: "1",
        rel: "0",
        modestbranding: "1",
        controls: "1",
        enablejsapi: "1"
    });

    return (
        "https://www.youtube.com/embed/" +
        videoId +
        "?" +
        params.toString()
    );
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   LIKES
========================================================= */

function isLiked(videoId) {

    return localStorage.getItem(
        "shortsflow_like_" + videoId
    ) === "true";
}


function setLiked(videoId, value) {

    localStorage.setItem(
        "shortsflow_like_" + videoId,
        value ? "true" : "false"
    );
}


/* =========================================================
   CREATE SHORT
========================================================= */

function createShort(video, index) {

    const article =
        document.createElement("article");

    article.className = "short";

    article.dataset.index = index;
    article.dataset.videoId = video.id;

    const liked = isLiked(video.id);

    article.innerHTML = `
        <div class="video-shell">

            <div class="video-loading">
                <div class="spinner"></div>
            </div>

            <iframe
                src="${youtubeURL(video.id)}"
                title="${escapeHTML(video.description)}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
                loading="${index < 2 ? "eager" : "lazy"}"
            ></iframe>

        </div>

        <div class="actions">

            <div class="action">
                <button
                    class="action-button like-button ${liked ? "liked" : ""}"
                    data-action="like"
                    aria-label="Like"
                >
                    ${liked ? "♥" : "♡"}
                </button>

                <span class="action-label">
                    Like
                </span>
            </div>

            <div class="action">
                <button
                    class="action-button"
                    data-action="share"
                    aria-label="Share"
                >
                    ↗
                </button>

                <span class="action-label">
                    Share
                </span>
            </div>

            <div class="action">
                <button
                    class="action-button"
                    data-action="open"
                    aria-label="Open on YouTube"
                >
                    ▶
                </button>

                <span class="action-label">
                    YouTube
                </span>
            </div>

        </div>

        <div class="info">

            <div class="creator">
                @${escapeHTML(
                    video.creator
                        .replace(/\s+/g, "")
                        .toLowerCase()
                )}
            </div>

            <div class="description">
                ${escapeHTML(video.description)}
            </div>

            <div class="category">
                ${escapeHTML(video.category)}
            </div>

        </div>
    `;


    const iframe =
        article.querySelector("iframe");

    const loading =
        article.querySelector(".video-loading");


    iframe.addEventListener("load", () => {

        setTimeout(() => {
            loading.classList.add("hidden");
        }, 250);

    });


    /* LIKE */

    const likeButton =
        article.querySelector('[data-action="like"]');

    likeButton.addEventListener("click", event => {

        event.stopPropagation();

        const newValue =
            !isLiked(video.id);

        setLiked(video.id, newValue);

        likeButton.classList.toggle(
            "liked",
            newValue
        );

        likeButton.textContent =
            newValue ? "♥" : "♡";

    });


    /* SHARE */

    const shareButton =
        article.querySelector('[data-action="share"]');

    shareButton.addEventListener("click", async event => {

        event.stopPropagation();

        const url =
            "https://www.youtube.com/shorts/" +
            video.id;

        try {

            if (navigator.share) {

                await navigator.share({
                    title: video.description,
                    text:
                        "Check out this Short on ShortsFlow!",
                    url
                });

            } else if (navigator.clipboard) {

                await navigator.clipboard.writeText(url);

                showTemporaryMessage(
                    "Short link copied!"
                );

            } else {

                showTemporaryMessage(
                    "Sharing isn't available here."
                );

            }

        } catch (error) {

            if (error && error.name !== "AbortError") {

                showTemporaryMessage(
                    "Couldn't share this Short."
                );

            }

        }

    });


    /* OPEN YOUTUBE */

    const openButton =
        article.querySelector('[data-action="open"]');

    openButton.addEventListener("click", event => {

        event.stopPropagation();

        window.open(
            "https://www.youtube.com/shorts/" +
            video.id,
            "_blank",
            "noopener,noreferrer"
        );

    });


    return article;
}


/* =========================================================
   BUILD FEED
========================================================= */

function buildFeed() {

    feed.innerHTML = "";

    VIDEOS.forEach((video, index) => {

        feed.appendChild(
            createShort(video, index)
        );

    });

    currentIndex = 0;

    observeShorts();

}


/* =========================================================
   INTERSECTION OBSERVER
========================================================= */

function observeShorts() {

    if (observer) {
        observer.disconnect();
    }

    observer =
        new IntersectionObserver(
            entries => {

                entries.forEach(entry => {

                    if (
                        entry.isIntersecting &&
                        entry.intersectionRatio >= 0.65
                    ) {

                        const index =
                            Number(
                                entry.target.dataset.index
                            );

                        if (!Number.isNaN(index)) {
                            currentIndex = index;
                        }

                    }

                });

            },
            {
                root: feed,
                threshold: [0.65]
            }
        );


    document
        .querySelectorAll(".short")
        .forEach(short => {
            observer.observe(short);
        });

}


/* =========================================================
   GO TO SHORT
========================================================= */

function goToShort(index) {

    if (!VIDEOS.length) {
        return;
    }

    index = Math.max(
        0,
        Math.min(
            VIDEOS.length - 1,
            index
        )
    );

    const target =
        feed.querySelector(
            `.short[data-index="${index}"]`
        );

    if (!target) {
        return;
    }

    currentIndex = index;

    target.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

}


/* =========================================================
   KEYBOARD CONTROLS
========================================================= */

document.addEventListener("keydown", event => {

    if (settingsOverlay.classList.contains("open")) {

        if (event.key === "Escape") {

            settingsOverlay.classList.remove("open");

        }

        return;
    }


    if (
        event.key === "ArrowDown" ||
        event.key === "PageDown"
    ) {

        event.preventDefault();

        goToShort(currentIndex + 1);

    }


    if (
        event.key === "ArrowUp" ||
        event.key === "PageUp"
    ) {

        event.preventDefault();

        goToShort(currentIndex - 1);

    }

});


/* =========================================================
   SETTINGS
========================================================= */

function updateToggleUI() {

    autoplayToggle.classList.toggle(
        "active",
        autoplay
    );

    muteToggle.classList.toggle(
        "active",
        muted
    );

}


settingsButton.addEventListener("click", () => {

    settingsOverlay.classList.add("open");

});


closeSettings.addEventListener("click", () => {

    settingsOverlay.classList.remove("open");

});


settingsOverlay.addEventListener("click", event => {

    if (event.target === settingsOverlay) {

        settingsOverlay.classList.remove("open");

    }

});


/* =========================================================
   AUTOPLAY
========================================================= */

autoplayToggle.addEventListener("click", () => {

    autoplay = !autoplay;

    localStorage.setItem(
        "shortsflow_autoplay",
        autoplay ? "true" : "false"
    );

    updateToggleUI();

    showTemporaryMessage(
        autoplay
            ? "Autoplay enabled"
            : "Autoplay disabled"
    );

});


/* =========================================================
   MUTE
========================================================= */

muteToggle.addEventListener("click", () => {

    muted = !muted;

    localStorage.setItem(
        "shortsflow_muted",
        muted ? "true" : "false"
    );

    updateToggleUI();

    showTemporaryMessage(
        muted
            ? "Videos will start muted"
            : "Videos will start unmuted"
    );

});


/* =========================================================
   RESET
========================================================= */

resetFeed.addEventListener("click", () => {

    autoplay = true;
    muted = true;

    localStorage.setItem(
        "shortsflow_autoplay",
        "true"
    );

    localStorage.setItem(
        "shortsflow_muted",
        "true"
    );

    updateToggleUI();

    buildFeed();

    settingsOverlay.classList.remove("open");

    showTemporaryMessage(
        "Feed settings reset"
    );

});


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showTemporaryMessage(message) {

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        }, 2200);

}


/* =========================================================
   START
========================================================= */

updateToggleUI();

buildFeed();

setTimeout(() => {

    scrollHint.classList.add("hidden");

}, 3500);

</script>
