<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>ShortsFlow</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#050505;color:#fff;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
button,input{font:inherit}
button{border:0;color:inherit}
.app{position:relative;width:100%;height:100%;background:#050505;overflow:hidden}

.feed{
  position:absolute;inset:0;
  overflow-y:auto;overflow-x:hidden;
  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;
  scrollbar-width:none;
  background:#050505;
}
.feed::-webkit-scrollbar{display:none}

.short{
  position:relative;width:100%;height:100dvh;min-height:560px;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  overflow:hidden;background:#090909;
}

.video-wrap{
  position:absolute;inset:0;
  background:#080808;
  display:grid;place-items:center;
  overflow:hidden;
}

.youtube-frame{
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#080808;
}

.shade{
  position:absolute;inset:0;
  pointer-events:none;
  z-index:3;
  background:
    linear-gradient(180deg,
      rgba(0,0,0,.62) 0%,
      rgba(0,0,0,.15) 19%,
      rgba(0,0,0,0) 44%,
      rgba(0,0,0,.12) 63%,
      rgba(0,0,0,.88) 100%);
}

.topbar{
  position:fixed;
  z-index:50;
  top:0;left:0;right:0;
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  background:linear-gradient(180deg,rgba(0,0,0,.62),transparent);
  pointer-events:none;
}

.brand{
  display:flex;align-items:center;gap:10px;
  font-weight:900;font-size:21px;
  letter-spacing:-.7px;
  pointer-events:auto;
}

.logo{
  width:35px;height:35px;border-radius:11px;
  display:grid;place-items:center;
  background:#fff;color:#000;
  box-shadow:0 7px 28px rgba(255,255,255,.15);
}
.logo svg{width:20px;height:20px}

.tabs{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  display:flex;gap:5px;
  padding:5px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(20,20,20,.52);
  backdrop-filter:blur(22px);
  border-radius:15px;
  pointer-events:auto;
}

.tab{
  padding:8px 15px;
  border-radius:10px;
  background:transparent;
  color:rgba(255,255,255,.62);
  font-weight:750;
  cursor:pointer;
  transition:.2s;
}
.tab:hover{color:#fff}
.tab.active{
  background:rgba(255,255,255,.14);
  color:#fff;
}

.top-actions{
  display:flex;gap:8px;
  pointer-events:auto;
}

.icon-btn{
  width:41px;height:41px;
  border-radius:13px;
  display:grid;place-items:center;
  background:rgba(20,20,20,.55);
  border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(18px);
  cursor:pointer;
  transition:.2s;
  box-shadow:0 8px 30px rgba(0,0,0,.2);
}
.icon-btn:hover{
  background:rgba(255,255,255,.15);
  transform:translateY(-1px);
}
.icon-btn:active{transform:scale(.93)}
.icon-btn svg{width:20px;height:20px}

.info{
  position:absolute;
  z-index:8;
  left:28px;
  bottom:34px;
  max-width:min(650px,calc(100% - 145px));
  text-shadow:0 2px 14px rgba(0,0,0,.6);
}

.creator{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:13px;
}

.avatar{
  width:45px;height:45px;
  border-radius:50%;
  display:grid;place-items:center;
  font-weight:900;
  background:linear-gradient(135deg,#fff,#7dd3fc);
  color:#081018;
  border:2px solid rgba(255,255,255,.7);
  box-shadow:0 5px 22px rgba(0,0,0,.35);
}

.creator-name{
  font-weight:850;
  font-size:16px;
}

.verified{
  display:inline-grid;
  place-items:center;
  width:15px;height:15px;
  margin-left:3px;
  border-radius:50%;
  background:#3b82f6;
  font-size:10px;
}

.category-pill{
  display:inline-flex;
  align-items:center;
  margin-bottom:9px;
  padding:5px 9px;
  border-radius:999px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(12px);
  font-size:11px;
  font-weight:800;
}

.caption{
  font-size:16px;
  line-height:1.45;
  font-weight:550;
}

.audio{
  margin-top:11px;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  font-weight:650;
  color:rgba(255,255,255,.85);
}

.vinyl{
  width:21px;height:21px;
  border-radius:50%;
  border:5px solid #222;
  background:#eee;
  box-shadow:inset 0 0 0 2px #777;
  animation:spin 3s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.follow{
  padding:7px 13px;
  border-radius:9px;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.18);
  font-weight:750;
  cursor:pointer;
  backdrop-filter:blur(12px);
}
.follow.following{
  background:#fff;
  color:#111;
}

.short-actions{
  position:absolute;
  z-index:10;
  right:22px;
  bottom:31px;
  width:62px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:15px;
}

.action{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  cursor:pointer;
  user-select:none;
}

.action .bubble{
  width:49px;height:49px;
  border-radius:50%;
  display:grid;place-items:center;
  background:rgba(20,20,20,.48);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(18px);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
  transition:.18s;
}

.action:hover .bubble{
  transform:scale(1.07);
  background:rgba(255,255,255,.15);
}
.action:active .bubble{transform:scale(.9)}
.action svg{width:24px;height:24px}

.count{
  font-size:12px;
  font-weight:800;
  text-shadow:0 2px 7px #000;
}

.like.liked .bubble{
  background:rgba(255,50,90,.22);
  border-color:rgba(255,100,130,.45);
}
.like.liked svg{
  fill:#ff365d;
  stroke:#ff365d;
}

.sound-btn{
  position:absolute;
  z-index:12;
  right:24px;
  top:91px;
}

.open-youtube{
  position:absolute;
  z-index:12;
  right:24px;
  top:141px;
  width:41px;height:41px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:rgba(20,20,20,.55);
  border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(18px);
  cursor:pointer;
  transition:.2s;
}
.open-youtube:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,.15);
}
.open-youtube svg{width:20px;height:20px}

.progress{
  position:absolute;
  z-index:12;
  left:0;right:0;bottom:0;
  height:3px;
  background:rgba(255,255,255,.16);
}
.progress i{
  display:block;
  height:100%;
  width:0;
  background:#fff;
  box-shadow:0 0 10px rgba(255,255,255,.8);
  transition:width .15s linear;
}

.loading{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  z-index:5;
  pointer-events:none;
  opacity:0;
  transition:.2s;
}
.loading.show{opacity:1}

.loader{
  width:35px;height:35px;
  border:3px solid rgba(255,255,255,.25);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .75s linear infinite;
}

.pause-indicator{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  pointer-events:none;
  opacity:0;
  transition:.18s;
  z-index:7;
}
.pause-indicator span{
  width:76px;height:76px;
  border-radius:50%;
  display:grid;place-items:center;
  background:rgba(0,0,0,.42);
  backdrop-filter:blur(12px);
  font-size:29px;
}
.short.paused .pause-indicator{opacity:1}

.side-hint{
  position:fixed;
  z-index:18;
  right:22px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:8px;
  align-items:center;
  color:rgba(255,255,255,.55);
  font-size:11px;
  font-weight:700;
  pointer-events:none;
}
.side-hint .chev{
  font-size:20px;
  animation:bounce 1.5s infinite;
}
@keyframes bounce{50%{transform:translateY(5px)}}

.search-panel{
  position:fixed;
  z-index:90;
  top:70px;
  left:50%;
  transform:translateX(-50%);
  width:min(580px,calc(100% - 30px));
  display:none;
}
.search-panel.open{display:block}

.search-box{
  display:flex;
  gap:8px;
  padding:8px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:17px;
  background:rgba(20,20,20,.86);
  backdrop-filter:blur(25px);
}
.search-box input{
  flex:1;
  min-width:0;
  border:1px solid rgba(255,255,255,.12);
  outline:0;
  background:rgba(255,255,255,.07);
  color:#fff;
  border-radius:13px;
  padding:12px 14px;
}

.primary{
  background:#fff;
  color:#111;
  border-radius:13px;
  padding:0 15px;
  font-weight:800;
  cursor:pointer;
}

.modal-backdrop{
  position:fixed;
  z-index:100;
  inset:0;
  background:rgba(0,0,0,.64);
  backdrop-filter:blur(10px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-backdrop.open{display:flex}

.modal{
  width:min(520px,100%);
  max-height:min(720px,90vh);
  overflow:auto;
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  background:rgba(20,20,20,.94);
  box-shadow:0 30px 100px rgba(0,0,0,.5);
  padding:20px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}
.modal h2{margin:0;font-size:20px}

.close{
  width:36px;height:36px;
  border-radius:11px;
  background:rgba(255,255,255,.08);
  cursor:pointer;
}

.settings-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.settings-row:last-child{border-bottom:0}

.switch{
  width:48px;height:28px;
  border-radius:99px;
  background:#333;
  padding:3px;
  cursor:pointer;
}
.switch i{
  display:block;
  width:22px;height:22px;
  background:#fff;
  border-radius:50%;
  transition:.2s;
}
.switch.on{background:#fff}
.switch.on i{
  background:#111;
  transform:translateX(20px);
}

.reset-btn{
  width:100%;
  margin-top:15px;
  height:44px;
  border-radius:13px;
  background:#222;
  border:1px solid rgba(255,255,255,.1);
  cursor:pointer;
  font-weight:800;
}

.comment-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.comment{
  display:flex;
  gap:11px;
}
.comment .avatar{
  width:36px;height:36px;
  min-width:36px;
  font-size:11px;
}
.comment strong{font-size:13px}
.comment p{
  margin:3px 0 0;
  color:#ccc;
  font-size:14px;
  line-height:1.4;
}

.comment-input{
  display:flex;
  gap:8px;
  margin-top:18px;
}
.comment-input input{
  flex:1;
  min-width:0;
  border:1px solid rgba(255,255,255,.12);
  outline:0;
  background:rgba(255,255,255,.07);
  color:#fff;
  border-radius:13px;
  padding:12px 14px;
}

.toast{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:24px;
  transform:translate(-50%,20px);
  padding:11px 15px;
  border-radius:13px;
  background:rgba(25,25,25,.92);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(15px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
  font-size:13px;
  font-weight:700;
}
.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.empty{
  height:100dvh;
  display:grid;
  place-items:center;
  text-align:center;
  padding:30px;
}
.empty-card{max-width:430px}
.empty-card h2{
  font-size:28px;
  margin:0 0 8px;
}
.empty-card p{color:#aaa}

.smart-badge{
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:13;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(14px);
  color:rgba(255,255,255,.65);
  font-size:10px;
  font-weight:800;
  pointer-events:none;
}

@media(max-width:700px){
  .topbar{
    height:64px;
    padding:0 12px;
  }
  .brand{font-size:18px}
  .logo{width:30px;height:30px}

  .tabs{
    left:auto;
    right:82px;
    transform:none;
  }
  .tab{
    padding:7px 10px;
    font-size:13px;
  }

  .top-actions{gap:5px}
  .icon-btn{
    width:36px;
    height:36px;
    border-radius:11px;
  }

  .info{
    left:16px;
    bottom:24px;
    max-width:calc(100% - 105px);
  }

  .caption{font-size:14px}

  .short-actions{
    right:10px;
    bottom:24px;
    width:52px;
    gap:11px;
  }

  .action .bubble{
    width:45px;
    height:45px;
  }

  .sound-btn{
    right:12px;
    top:77px;
  }

  .open-youtube{
    right:12px;
    top:123px;
    width:36px;
    height:36px;
  }

  .side-hint{display:none}
  .smart-badge{top:9px}
}

@media(min-width:900px){
  .short{
    width:min(100%,760px);
    margin:0 auto;
    border-left:1px solid rgba(255,255,255,.05);
    border-right:1px solid rgba(255,255,255,.05);
  }
  .topbar{
    left:50%;
    right:auto;
    width:min(100%,760px);
    transform:translateX(-50%);
  }
  .feed{background:#050505}
}
</style>

</head>

function esc(value){
  return String(value).replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}

function showToast(message){
  toast.textContent=message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>toast.classList.remove("show"),1900);
}

function clamp(n,min,max){
  return Math.max(min,Math.min(max,n));
}

function formatNumber(n){
  if(n>=1000000)return (n/1000000).toFixed(1).replace(".0","")+"M";
  if(n>=1000)return (n/1000).toFixed(1).replace(".0","")+"K";
  return String(n);
}

function saveSettings(){
  localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
}

function saveSmart(){
  localStorage.setItem(SMART_KEY,JSON.stringify(smartData));
}

function categoryData(category){
  if(!smartData.categories[category]){
    smartData.categories[category]={
      score:0,
      skips:0,
      watches:0,
      lastAction:null
    };
  }
  return smartData.categories[category];
}

function videoData(id){
  if(!smartData.videos[id]){
    smartData.videos[id]={
      skips:0,
      watches:0,
      totalSeconds:0
    };
  }
  return smartData.videos[id];
}

/* =========================================================
   SMART FEED
   ========================================================= */

function recordSkip(video){
  if(!settings.smartFeed||!video)return;

  const cat=categoryData(video.category);
  const vd=videoData(video.id);

  cat.skips++;
  cat.score--;
  cat.lastAction="skip";

  vd.skips++;

  if(cat.skips>=SKIP_LIMIT){
    cat.score-=2;
  }

  cat.score=clamp(cat.score,MIN_SCORE,MAX_SCORE);

  saveSmart();
}

function recordWatch(video,seconds){
  if(!settings.smartFeed||!video||seconds<WATCH_THRESHOLD)return;

  const cat=categoryData(video.category);
  const vd=videoData(video.id);

  cat.watches++;
  cat.lastAction="watch";

  vd.watches++;
  vd.totalSeconds+=seconds;

  if(seconds>=STRONG_WATCH_THRESHOLD){
    cat.score+=3;
  }else{
    cat.score+=1;
  }

  if(cat.score>0&&cat.skips>0){
    cat.skips--;
  }

  cat.score=clamp(cat.score,MIN_SCORE,MAX_SCORE);

  saveSmart();
}

function smartSortVideos(list){
  if(!settings.smartFeed)return [...list];

  const groups={};

  list.forEach(video=>{
    if(!groups[video.category])groups[video.category]=[];
    groups[video.category].push(video);
  });

  const categories=Object.keys(groups);

  categories.sort((a,b)=>{
    const A=categoryData(a);
    const B=categoryData(b);
    return B.score-A.score;
  });

  const normal=[];
  const demoted=[];

  categories.forEach(category=>{
    const data=categoryData(category);

    if(data.score<=-3){
      demoted.push(category);
    }else{
      normal.push(category);
    }
  });

  const output=[];

  /*
    Positive categories receive more turns near the
    front of the feed. Categories that are repeatedly
    skipped get pushed toward the end.
  */
  let pools=normal.map(category=>({
    category,
    videos:[...groups[category]],
    credit:Math.max(1,categoryData(category).score+2)
  }));

  let safety=0;

  while(pools.some(p=>p.videos.length)&&safety<10000){
    safety++;

    pools.sort((a,b)=>b.credit-a.credit);

    const active=pools.find(p=>p.videos.length);
    if(!active)break;

    output.push(active.videos.shift());
    active.credit--;

    if(active.credit<=0){
      active.credit=Math.max(
        1,
        categoryData(active.category).score+2
      );
    }
  }

  demoted.forEach(category=>{
    output.push(...groups[category]);
  });

  return output;
}

function youtubeURL(videoId){
  const params=new URLSearchParams({
    autoplay:settings.autoplay?"1":"0",
    mute:settings.muted?"1":"0",
    controls:"1",
    rel:"0",
    modestbranding:"1",
    playsinline:"1",
    enablejsapi:"1"
  });

  return "https://www.youtube.com/embed/"+encodeURIComponent(videoId)+"?"+params.toString();
}

function restartShort(article){
  if(!article)return;

  const iframe=article.querySelector("iframe");
  if(!iframe)return;

  const videoId=article.dataset.videoId;
  if(!videoId)return;

  if(resettingVideos.has(videoId))return;

  resettingVideos.add(videoId);

  iframe.src="about:blank";

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      iframe.src=youtubeURL(videoId);

      setTimeout(()=>{
        resettingVideos.delete(videoId);
      },350);
    });
  });
}

function sendYouTubeCommand(iframe,func){
  try{
    iframe.contentWindow.postMessage(JSON.stringify({
      event:"command",
      func,
      args:[]
    }),"*");
  }catch{}
}

function playArticle(article){
  const iframe=article?.querySelector("iframe");
  if(!iframe)return;

  if(settings.autoplay){
    sendYouTubeCommand(iframe,"playVideo");
  }
}

function pauseArticle(article){
  const iframe=article?.querySelector("iframe");
  if(!iframe)return;
  sendYouTubeCommand(iframe,"pauseVideo");
}

        <path d="M14 5h5v5"/>
        <path d="M19 5 10 14"/>
        <path d="M19 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>

    </button>

    <div class="pause-indicator">

    </div>

        <div class="avatar">

        </div>

        <div class="creator-name">
          @${esc(video.creator)}
          <span class="verified">✓</span>
        </div>

        <button class="follow" data-action="follow">
          Follow
        </button>
      </div>

      <div class="caption">
        ${esc(video.title)}
      </div>

      <div class="audio">
        <span class="vinyl"></span>

      </div>

    </div>

    <div class="short-actions">

      <div class="action like ${likedNow?"liked":""}" data-action="like">
        <div class="bubble">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.8 8.8c0 5.5-8.8 10.2-8.8 10.2S3.2 14.3 3.2 8.8A4.7 4.7 0 0 1 12 6.2a4.7 4.7 0 0 1 8.8 2.6Z"/>
          </svg>
        </div>
        <div class="count">${likedNow?"Liked":"Like"}</div>
      </div>

      <div class="action" data-action="comments">
        <div class="bubble">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.5 8.5 0 0 1-3.2-.6L4 20l1.6-3.8A7.1 7.1 0 0 1 4 11.5 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5Z"/>
          </svg>
        </div>
        <div class="count">Comments</div>
      </div>

      <div class="action" data-action="share">
        <div class="bubble">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m14 5 7 7-7 7"/>
            <path d="M21 12H6"/>
            <path d="M6 5v3M6 16v3"/>
          </svg>
        </div>
        <div class="count">Share</div>
      </div>

    </div>

    <div class="progress">
      <i></i>
    </div>
  `;

  return article;
}

function buildFeed(list=VIDEOS){
  stopWatchTimer();

  if(activeArticle){
    pauseArticle(activeArticle);
  }

  orderedVideos=smartSortVideos(list);
  lastFeedList=list;

  feed.innerHTML="";

  if(!orderedVideos.length){
    feed.innerHTML=`
      <div class="empty">
        <div class="empty-card">
          <h2>No Shorts found</h2>
          <p>Try another search or switch back to For You.</p>
        </div>
      </div>
    `;
    activeArticle=null;
    return;
  }

  orderedVideos.forEach((video,index)=>{
    feed.appendChild(createShort(video,index));
  });

  currentIndex=0;
  activeArticle=null;

  setupObserver();

  requestAnimationFrame(()=>{
    const first=feed.querySelector(".short");
    if(first)activateShort(first);
  });
}

/* =========================================================
   OBSERVER / WATCH TRACKING
   ========================================================= */

function startWatchTimer(video){
  stopWatchTimer();

  if(!video)return;

  watchStartedAt=Date.now();

  watchTimer=setInterval(()=>{
    if(!activeArticle)return;

    const seconds=(Date.now()-watchStartedAt)/1000;
    const bar=activeArticle.querySelector(".progress i");

    /*
      This is only a visual progress indicator because
      YouTube playback time is inside the iframe.
    */
    if(bar){
      const visual=Math.min(96,seconds*3.2);
      bar.style.width=visual+"%";
    }
  },250);
}

function stopWatchTimer(){
  if(watchTimer){
    clearInterval(watchTimer);
    watchTimer=null;
  }
  watchStartedAt=0;
}

function finishWatching(article){
  if(!article)return;

  const videoId=article.dataset.videoId;
  const video=VIDEOS.find(v=>v.id===videoId);

  if(!video)return;

  const seconds=watchStartedAt
    ? (Date.now()-watchStartedAt)/1000
    : 0;

  if(seconds>=WATCH_THRESHOLD){
    recordWatch(video,seconds);
  }else{
    recordSkip(video);
  }

  const bar=article.querySelector(".progress i");
  if(bar)bar.style.width="0";

  stopWatchTimer();
}

function setupObserver(){
  if(observer)observer.disconnect();

  const shorts=[...feed.querySelectorAll(".short")];

  observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting || entry.intersectionRatio<.65)return;

      const article=entry.target;
      const index=shorts.indexOf(article);

      if(index<0)return;

      if(activeArticle!==article){

        if(activeArticle){
          finishWatching(activeArticle);
          pauseArticle(activeArticle);
          restartShort(activeArticle);
          activeArticle.classList.remove("active");
          activeArticle.classList.remove("paused");
        }

        activeArticle=article;
        currentIndex=index;

        article.classList.add("active");
        article.classList.remove("paused");

        startWatchTimer(
          VIDEOS.find(v=>v.id===article.dataset.videoId)
        );

        if(settings.autoplay){
          setTimeout(()=>playArticle(article),100);
        }
      }
    });
  },{
    root:feed,
    threshold:[.65,.8,.95]
  });

  shorts.forEach(short=>observer.observe(short));
}

/* =========================================================
   ACTIONS
   ========================================================= */

function toggleLike(video,article){
  const exists=liked.includes(video.id);

  if(exists){
    liked=liked.filter(id=>id!==video.id);
  }else{
    liked.push(video.id);
  }

  localStorage.setItem(LIKES_KEY,JSON.stringify(liked));

  const button=article.querySelector(".like");

  button.classList.toggle("liked",!exists);
  button.querySelector(".count").textContent=exists?"Like":"Liked";

  showToast(exists?"Like removed":"Liked ❤️");
}

function toggleFollow(video,article){
  const creatorKey="shortsflow_following_v3";

  let following=[];

  try{
    following=JSON.parse(localStorage.getItem(creatorKey)||"[]");
    if(!Array.isArray(following))following=[];
  }catch{}

  const exists=following.includes(video.creator);

  if(exists){
    following=following.filter(x=>x!==video.creator);
  }else{
    following.push(video.creator);
  }

  localStorage.setItem(creatorKey,JSON.stringify(following));

  const button=article.querySelector(".follow");

  button.classList.toggle("following",!exists);
  button.textContent=exists?"Follow":"Following";

  showToast(exists
    ?"Unfollowed @"+video.creator
    :"Following @"+video.creator
  );
}

function toggleMute(article){
  settings.muted=!settings.muted;
  saveSettings();

  const iframe=article.querySelector("iframe");

  if(settings.muted){
    sendYouTubeCommand(iframe,"mute");
  }else{
    sendYouTubeCommand(iframe,"unMute");
  }

  updateSoundIcons();

  showToast(settings.muted?"Muted":"Sound on");
}

function updateSoundIcons(){
  document.querySelectorAll(".sound-btn").forEach(button=>{
    button.innerHTML=settings.muted
      ? `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 10v4h4l5 4V6l-5 4H4Z"/>
          <path d="m18 9 4 6M22 9l-4 6"/>
        </svg>`
      : `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 10v4h4l5 4V6l-5 4H4Z"/>
          <path d="M17 9.5a4 4 0 0 1 0 5M19.5 7a7.5 7.5 0 0 1 0 10"/>
        </svg>`;
  });
}

function togglePlay(article){
  if(!article)return;

  const paused=article.classList.contains("paused");

  if(paused){
    article.classList.remove("paused");
    playArticle(article);
  }else{
    article.classList.add("paused");
    pauseArticle(article);
  }
}

function openYouTube(video){
  window.open(
    "https://www.youtube.com/shorts/"+encodeURIComponent(video.id),
    "_blank",
    "noopener,noreferrer"
  );
}

/* =========================================================
   COMMENTS
   ========================================================= */

function openComments(video){
  currentShare=video;

  const list=document.getElementById("commentList");
  list.innerHTML="";

  const stored=comments[video.id];

  const entries=Array.isArray(stored)&&stored.length
    ?stored
    :[
      {
        name:"ShortsFlow",
        avatar:"SF",
        text:"Watching this one on ShortsFlow 👀"
      },
      {
        name:"Viewer",
        avatar:"V",
        text:"This one is actually funny 😂"
      }
    ];

  entries.forEach(comment=>{
    const row=document.createElement("div");
    row.className="comment";

    row.innerHTML=`
      <div class="avatar">${esc(comment.avatar||"U")}</div>
      <div>
        <strong>@${esc(comment.name||"Viewer")}</strong>
        <p>${esc(comment.text||"")}</p>
      </div>
    `;

    list.appendChild(row);
  });

  document.getElementById("commentInput").value="";

  openModal(commentsModal);
}

document.getElementById("commentForm").addEventListener("submit",event=>{
  event.preventDefault();

  if(!currentShare)return;

  const input=document.getElementById("commentInput");
  const text=input.value.trim();

  if(!text)return;

  if(!comments[currentShare.id]){
    comments[currentShare.id]=[];
  }

  comments[currentShare.id].push({
    name:"You",
    avatar:"Y",
    text
  });

  localStorage.setItem(
    "shortsflow_comments_v3",
    JSON.stringify(comments)
  );

  input.value="";

  openComments(currentShare);
  showToast("Comment posted");
});

/* =========================================================
   SHARE
   ========================================================= */

function openShare(video){
  currentShare=video;
  openModal(shareModal);
}

document.getElementById("copyLink").addEventListener("click",async()=>{
  if(!currentShare)return;

  const link=
    location.href.split("#")[0]+
    "#short-"+currentShare.id;

  try{
    await navigator.clipboard.writeText(link);
    showToast("ShortsFlow link copied");
  }catch{
    showToast("Copy failed");
  }
});

document.getElementById("nativeShare").addEventListener("click",async()=>{
  if(!currentShare)return;

  const link=
    location.href.split("#")[0]+
    "#short-"+currentShare.id;

  if(navigator.share){
    try{
      await navigator.share({
        title:"ShortsFlow",
        text:currentShare.title,
        url:link
      });
      closeModal();
    }catch{}
  }else{
    try{
      await navigator.clipboard.writeText(link);
      showToast("Link copied");
    }catch{
      showToast("Copy failed");
    }
  }
});

/* =========================================================
   MODALS
   ========================================================= */

function openModal(which){
  modalBackdrop.classList.add("open");

  [
    settingsModal,
    commentsModal,
    shareModal
  ].forEach(modal=>{
    modal.hidden=true;
  });

  which.hidden=false;
}

function closeModal(){
  modalBackdrop.classList.remove("open");
}

modalBackdrop.addEventListener("click",event=>{
  if(
    event.target===modalBackdrop ||
    event.target.closest("[data-close]")
  ){
    closeModal();
  }
});

/* =========================================================
   SETTINGS
   ========================================================= */

function setSwitch(element,on){
  element.classList.toggle("on",on);
}

function updateSettingsUI(){
  setSwitch(
    document.getElementById("autoplaySwitch"),
    settings.autoplay
  );

  setSwitch(
    document.getElementById("muteSwitch"),
    settings.muted
  );

  setSwitch(
    document.getElementById("smartSwitch"),
    settings.smartFeed
  );

  updateSoundIcons();
}

document.getElementById("settingsBtn").addEventListener("click",()=>{
  updateSettingsUI();
  openModal(settingsModal);
});

document.getElementById("autoplaySwitch").addEventListener("click",()=>{
  settings.autoplay=!settings.autoplay;
  saveSettings();
  updateSettingsUI();

  if(settings.autoplay&&activeArticle){
    playArticle(activeArticle);
  }else if(activeArticle){
    pauseArticle(activeArticle);
  }

  showToast(
    settings.autoplay
      ?"Autoplay on"
      :"Autoplay off"
  );
});

document.getElementById("muteSwitch").addEventListener("click",()=>{
  settings.muted=!settings.muted;
  saveSettings();
  updateSettingsUI();

  if(activeArticle){
    const iframe=activeArticle.querySelector("iframe");

    if(settings.muted){
      sendYouTubeCommand(iframe,"mute");
    }else{
      sendYouTubeCommand(iframe,"unMute");
    }
  }

  showToast(
    settings.muted
      ?"Mute on"
      :"Mute off"
  );
});

document.getElementById("smartSwitch").addEventListener("click",()=>{
  settings.smartFeed=!settings.smartFeed;
  saveSettings();

  updateSettingsUI();

  currentIndex=0;
  buildFeed(lastFeedList);

  showToast(
    settings.smartFeed
      ?"Smart Feed on"
      :"Smart Feed off"
  );
});

document.getElementById("resetSmart").addEventListener("click",()=>{
  smartData={
    categories:{},
    videos:{}
  };

  saveSmart();

  showToast("Smart Feed reset");

  setTimeout(()=>{
    currentIndex=0;
    buildFeed(lastFeedList);
  },250);
});

/* =========================================================
   SEARCH
   ========================================================= */

document.getElementById("searchBtn").addEventListener("click",()=>{
  const panel=document.getElementById("searchPanel");

  panel.classList.toggle("open");

  if(panel.classList.contains("open")){
    document.getElementById("searchInput").focus();
  }
});

document.getElementById("clearSearch").addEventListener("click",()=>{
  document.getElementById("searchInput").value="";
  currentIndex=0;
  buildFeed(VIDEOS);
});

document.getElementById("searchInput").addEventListener("input",event=>{
  const query=event.target.value.toLowerCase().trim();

  if(!query){
    buildFeed(VIDEOS);
    return;
  }

  const filtered=VIDEOS.filter(video=>[
    video.id,
    video.title,
    video.creator,
    video.category
  ].join(" ").toLowerCase().includes(query));

  currentIndex=0;
  buildFeed(filtered);
});

/* =========================================================
   FOLLOWING
   ========================================================= */

function getFollowing(){
  try{
    const value=JSON.parse(
      localStorage.getItem("shortsflow_following_v3")||"[]"
    );

    return Array.isArray(value)?value:[];
  }catch{
    return [];
  }
}

document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    document.querySelectorAll(".tab")
      .forEach(item=>item.classList.remove("active"));

    tab.classList.add("active");

    if(tab.dataset.feed==="following"){
      const following=getFollowing();

      const list=VIDEOS.filter(video=>
        following.includes(video.creator)
      );

      if(!list.length){
        showToast("Follow creators to see them here");
        return;
      }

      currentIndex=0;
      buildFeed(list);
    }else{
      currentIndex=0;
      buildFeed(VIDEOS);
    }
  });
});

/* =========================================================
   FEED CLICK EVENTS
   ========================================================= */

feed.addEventListener("click",event=>{
  const article=event.target.closest(".short");

  if(!article)return;

  const videoId=article.dataset.videoId;
  const video=VIDEOS.find(item=>item.id===videoId);

  if(!video)return;

  const action=event.target.closest("[data-action]");

  if(action){

    const type=action.dataset.action;

    if(type==="like"){
      toggleLike(video,article);
      return;
    }

    if(type==="comments"){
      openComments(video);
      return;
    }

    if(type==="share"){
      openShare(video);
      return;
    }

    if(type==="follow"){
      toggleFollow(video,article);
      return;
    }

    if(type==="sound"){
      toggleMute(article);
      return;
    }

    if(type==="youtube"){
      openYouTube(video);
      return;
    }
  }

  /*
    Clicking the actual iframe can't be intercepted because
    it belongs to YouTube. The keyboard Space control still
    toggles the active Short.
  }
});

/* =========================================================
   DOUBLE CLICK LIKE
   ========================================================= */

feed.addEventListener("dblclick",event=>{
  const article=event.target.closest(".short");

  if(!article)return;

  const video=VIDEOS.find(
    item=>item.id===article.dataset.videoId
  );

  if(!video)return;

  if(!liked.includes(video.id)){
    toggleLike(video,article);
  }
});

/* =========================================================
   MOUSE WHEEL NAVIGATION
   ========================================================= */

let wheelLock=false;

feed.addEventListener("wheel",event=>{
  if(Math.abs(event.deltaY)<10||wheelLock)return;

  wheelLock=true;

  const current=getCurrentShort();

  const target=
    event.deltaY>0
      ?current?.nextElementSibling
      :current?.previousElementSibling;

  if(target){
    target.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
  }

  setTimeout(()=>{
    wheelLock=false;
  },550);
},{passive:true});

/* =========================================================
   TOUCH NAVIGATION
   ========================================================= */

let touchStartY=0;

feed.addEventListener("touchstart",event=>{
  touchStartY=event.touches[0].clientY;
},{passive:true});

feed.addEventListener("touchend",event=>{
  const endY=event.changedTouches[0].clientY;
  const distance=touchStartY-endY;

  if(Math.abs(distance)<55)return;

  const current=getCurrentShort();

  const target=
    distance>0
      ?current?.nextElementSibling
      :current?.previousElementSibling;

  if(target){
    target.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
  }
},{passive:true});

/* =========================================================
   KEYBOARD NAVIGATION
   ========================================================= */

function getCurrentShort(){
  const shorts=[...feed.querySelectorAll(".short")];
  return shorts[currentIndex]||shorts[0];
}

function activateIndex(index){
  const shorts=[...feed.querySelectorAll(".short")];

  if(!shorts[index])return;

  shorts[index].scrollIntoView({
    behavior:"instant",
    block:"start"
  });

  activateShort(shorts[index]);
}

function activateShort(article){
  if(!article)return;

  if(activeArticle&&activeArticle!==article){
    finishWatching(activeArticle);
    pauseArticle(activeArticle);
    restartShort(activeArticle);
    activeArticle.classList.remove("active");
  }

  activeArticle=article;

  const shorts=[...feed.querySelectorAll(".short")];
  currentIndex=shorts.indexOf(article);

  article.classList.add("active");

  startWatchTimer(
    VIDEOS.find(v=>v.id===article.dataset.videoId)
  );

  if(settings.autoplay){
    setTimeout(()=>{
      playArticle(article);
    },80);
  }
}

document.addEventListener("keydown",event=>{

  if(event.key==="Escape"){
    closeModal();
    document.getElementById("searchPanel").classList.remove("open");
    return;
  }

  if(event.target.matches("input,textarea"))return;

  if(event.key==="ArrowDown"||event.key==="PageDown"){
    event.preventDefault();

    const current=getCurrentShort();
    const target=current?.nextElementSibling;

    if(target){
      target.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });
    }

    return;
  }

  if(event.key==="ArrowUp"||event.key==="PageUp"){
    event.preventDefault();

    const current=getCurrentShort();
    const target=current?.previousElementSibling;

    if(target){
      target.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });
    }

    return;
  }

  if(event.key===" "){
    event.preventDefault();

    const current=getCurrentShort();

    if(current){
      togglePlay(current);
    }
  }
});

/* =========================================================
   HASH LINKS
   ========================================================= */

function openHashShort(){
  if(!location.hash.startsWith("#short-"))return;

  const id=location.hash.slice(7);

  const index=orderedVideos.findIndex(
    video=>video.id===id
  );

  if(index>=0){
    setTimeout(()=>{
      activateIndex(index);
    },150);
  }
}

window.addEventListener("hashchange",openHashShort);

/* =========================================================
   INITIALISE
   ========================================================= */

updateSettingsUI();

buildFeed(VIDEOS);

setTimeout(()=>{
  openHashShort();
},250);

/*
  Before leaving/reloading, record the active watch.
*/
window.addEventListener("beforeunload",()=>{
  if(activeArticle){
    finishWatching(activeArticle);
  }
});

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    if(activeArticle){
      finishWatching(activeArticle);
      pauseArticle(activeArticle);
    }
  }else if(activeArticle&&settings.autoplay){
    playArticle(activeArticle);
    startWatchTimer(
      VIDEOS.find(v=>v.id===activeArticle.dataset.videoId)
    );
  }
});

</script>
