<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    position: relative;
}

button {
    font: inherit;
}

#app {
    width: 100%;
    height: 100%;
    position: relative;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.035), transparent 28%),
        radial-gradient(circle at 80% 80%, rgba(120,80,255,.035), transparent 30%),
        #050505;
}

#feed {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: #555 transparent;
}

#feed::-webkit-scrollbar {
    width: 7px;
}

#feed::-webkit-scrollbar-track {
    background: transparent;
}

#feed::-webkit-scrollbar-thumb {
    background: #444;
    border-radius: 20px;
}

.short {
    width: 100%;
    height: 100vh;
    min-height: 100vh;
    position: relative;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at 50% 45%, rgba(70,70,70,.15), transparent 45%),
        #050505;
    overflow: hidden;
}

.short::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(
        180deg,
        rgba(0,0,0,.55) 0%,
        transparent 18%,
        transparent 70%,
        rgba(0,0,0,.8) 100%
    );
    z-index: 3;
}

.video-shell {
    position: relative;
    width: min(430px, 100vw);
    height: min(765px, 100vh);
    aspect-ratio: 9 / 16;
    border-radius: 22px;
    overflow: hidden;
    background: #111;
    box-shadow:
        0 0 0 1px rgba(255,255,255,.07),
        0 25px 80px rgba(0,0,0,.65);
    z-index: 2;
}

.video-shell iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #111;
}

.loading {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1;
    pointer-events: none;
}

.spinner {
    width: 38px;
    height: 38px;
    border: 3px solid rgba(255,255,255,.2);
    border-top-color: white;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.topbar {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    height: 72px;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    pointer-events: none;
    background: linear-gradient(
        180deg,
        rgba(0,0,0,.7),
        transparent
    );
}

.logo {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -.5px;
    text-shadow: 0 2px 15px rgba(0,0,0,.8);
}

.logo-icon {
    width: 31px;
    height: 31px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #ff1744, #ff0050);
    box-shadow: 0 7px 25px rgba(255,0,70,.3);
    font-size: 15px;
}

.top-actions {
    pointer-events: auto;
    display: flex;
    gap: 9px;
}

.icon-button {
    width: 42px;
    height: 42px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 50%;
    background: rgba(25,25,25,.72);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    color: white;
    cursor: pointer;
    display: grid;
    place-items: center;
    font-size: 18px;
    transition: .2s ease;
}

.icon-button:hover {
    transform: scale(1.06);
    background: rgba(50,50,50,.85);
}

.icon-button:active {
    transform: scale(.94);
}

.info {
    position: absolute;
    left: max(20px, calc(50% - 215px));
    bottom: 30px;
    max-width: min(380px, calc(100vw - 100px));
    z-index: 10;
    text-shadow: 0 2px 12px rgba(0,0,0,.9);
}

.creator {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 8px;
}

.title {
    font-size: 15px;
    line-height: 1.35;
    color: #eee;
    margin-bottom: 9px;
}

.category {
    display: inline-flex;
    align-items: center;
    padding: 5px 9px;
    border-radius: 999px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.08);
    color: #ddd;
    font-size: 12px;
    backdrop-filter: blur(10px);
}

.actions {
    position: absolute;
    right: max(20px, calc(50% - 285px));
    bottom: 28px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.action {
    width: 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: white;
    border: 0;
    background: transparent;
    cursor: pointer;
    text-shadow: 0 2px 8px black;
}

.action-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(25,25,25,.7);
    border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    font-size: 21px;
    transition: .2s ease;
}

.action:hover .action-circle {
    transform: scale(1.08);
    background: rgba(55,55,55,.85);
}

.action.liked .action-circle {
    background: rgba(255,30,80,.2);
    border-color: rgba(255,30,80,.5);
    color: #ff3b6b;
}

.action-label {
    font-size: 11px;
    color: #ddd;
}

.progress {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;
    background: rgba(255,255,255,.12);
    z-index: 20;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: white;
    transition: width .1s linear;
}

#settingsOverlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 20px;
}

#settingsOverlay.open {
    display: flex;
}

.settings {
    width: min(470px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 24px;
    padding: 24px;
    background: rgba(24,24,27,.95);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 30px 100px rgba(0,0,0,.65);
}

.settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
}

.settings-header h2 {
    font-size: 24px;
}

.close-settings {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    color: white;
    cursor: pointer;
    font-size: 20px;
}

.setting {
    padding: 17px 0;
    border-top: 1px solid rgba(255,255,255,.08);
}

.setting:first-of-type {
    border-top: 0;
}

.setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.setting-name {
    font-weight: 700;
    font-size: 15px;
}

.setting-description {
    color: #999;
    font-size: 12px;
    line-height: 1.4;
    margin-top: 4px;
}

.switch {
    position: relative;
    width: 48px;
    height: 28px;
    flex-shrink: 0;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: #3a3a3c;
    cursor: pointer;
    transition: .2s;
}

.slider::before {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    left: 3px;
    top: 3px;
    border-radius: 50%;
    background: white;
    transition: .2s;
}

.switch input:checked + .slider {
    background: #34c759;
}

.switch input:checked + .slider::before {
    transform: translateX(20px);
}

.reset-button {
    width: 100%;
    margin-top: 18px;
    padding: 13px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 13px;
    background: rgba(255,255,255,.07);
    color: white;
    cursor: pointer;
    font-weight: 700;
}

.reset-button:hover {
    background: rgba(255,255,255,.12);
}

.empty-message {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
}

@media (max-width: 600px) {
    .topbar {
        padding: 0 13px;
        height: 62px;
    }

    .logo {
        font-size: 19px;
    }

    .logo-icon {
        width: 28px;
        height: 28px;
    }

    .video-shell {
        width: 100vw;
        height: 100vh;
        max-height: none;
        border-radius: 0;
        box-shadow: none;
    }

    .info {
        left: 15px;
        bottom: 25px;
        max-width: calc(100vw - 90px);
    }

    .actions {
        right: 12px;
        bottom: 25px;
    }

    .action-circle {
        width: 45px;
        height: 45px;
    }
}
</style>

const DEFAULT_SETTINGS = {
    autoplay: true,
    mute: true,
    smartFeed: true
};

/* =========================================================
   STORAGE HELPERS
========================================================= */

function loadSettings() {
    try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY));

        if (!saved || typeof saved !== "object") {
            return {...DEFAULT_SETTINGS};
        }

        return {
            autoplay: saved.autoplay !== false,
            mute: saved.mute !== false,
            smartFeed: saved.smartFeed !== false
        };
    } catch (error) {
        console.warn("Could not load ShortsFlow settings:", error);
        return {...DEFAULT_SETTINGS};
    }
}


function saveSettings() {
    localStorage.setItem(
        SETTINGS_KEY,
        JSON.stringify(settings)
    );
}


function loadSmartData() {
    try {
        const saved = JSON.parse(localStorage.getItem(SMART_KEY));

        if (!saved || typeof saved !== "object") {
            return {
                categories: {},
                videos: {}
            };
        }

        if (!saved.categories) {
            saved.categories = {};
        }

        if (!saved.videos) {
            saved.videos = {};
        }

        return saved;
    } catch (error) {
        console.warn("Could not load smart feed data:", error);

        return {
            categories: {},
            videos: {}
        };
    }
}


function saveSmartData() {
    localStorage.setItem(
        SMART_KEY,
        JSON.stringify(smartData)
    );
}


function loadLikes() {
    try {
        const saved = JSON.parse(localStorage.getItem(LIKES_KEY));

        return saved && typeof saved === "object"
            ? saved
            : {};
    } catch {
        return {};
    }
}


function saveLikes() {
    localStorage.setItem(
        LIKES_KEY,
        JSON.stringify(likes)
    );
}


/* =========================================================
   SMART FEED
========================================================= */

function clampScore(value) {
    return Math.max(
        MIN_SCORE,
        Math.min(MAX_SCORE, value)
    );
}


function ensureCategory(category) {

    if (!smartData.categories[category]) {
        smartData.categories[category] = {
            score: 0,
            skips: 0,
            watches: 0,
            lastAction: null
        };
    }

    return smartData.categories[category];
}


function ensureVideo(videoId) {

    if (!smartData.videos[videoId]) {
        smartData.videos[videoId] = {
            skips: 0,
            watches: 0,
            totalSeconds: 0
        };
    }

    return smartData.videos[videoId];
}


function recordSkip(video) {

    if (!settings.smartFeed || !video) {
        return;
    }

    const category = ensureCategory(video.category);
    const videoData = ensureVideo(video.id);

    category.skips++;
    category.score--;
    category.lastAction = "skip";

    videoData.skips++;

    if (category.skips >= SKIP_LIMIT) {
        category.score -= 2;
    }

    category.score = clampScore(category.score);

    saveSmartData();
}


function recordWatch(video, seconds) {

    if (!settings.smartFeed || !video) {
        return;
    }

    if (!Number.isFinite(seconds) || seconds < WATCH_THRESHOLD) {
        return;
    }

    const category = ensureCategory(video.category);
    const videoData = ensureVideo(video.id);

    category.watches++;
    category.lastAction = "watch";

    videoData.watches++;
    videoData.totalSeconds += seconds;

    if (seconds >= STRONG_WATCH_THRESHOLD) {
        category.score += 3;
    } else {
        category.score += 1;
    }

    if (category.score > 0 && category.skips > 0) {
        category.skips--;
    }

    category.score = clampScore(category.score);

    saveSmartData();
}


function smartSortVideos(videos) {

    if (!settings.smartFeed) {
        return [...videos];
    }

    const groups = {};

    videos.forEach(video => {

        if (!groups[video.category]) {
            groups[video.category] = [];
        }

        groups[video.category].push(video);
    });

    const categories = Object.keys(groups);

    categories.sort((a, b) => {

        const scoreA =
            smartData.categories[a]?.score || 0;

        const scoreB =
            smartData.categories[b]?.score || 0;

        return scoreB - scoreA;
    });

    const normal = [];
    const demoted = [];

    categories.forEach(category => {

        const score =
            smartData.categories[category]?.score || 0;

        if (score <= -3) {
            demoted.push(category);
        } else {
            normal.push(category);
        }
    });

    const result = [];

    let added = true;

    while (added) {

        added = false;

        normal.forEach(category => {

            const list = groups[category];

            if (list.length > 0) {

                result.push(list.shift());

                const score =
                    smartData.categories[category]?.score || 0;

                if (score > 0 && list.length > 0) {
                    result.push(list.shift());
                }

                added = true;
            }
        });
    }

    demoted.forEach(category => {

        while (groups[category].length) {
            result.push(groups[category].shift());
        }
    });

    return result;
}


/* =========================================================
   YOUTUBE
========================================================= */

function youtubeURL(videoId) {

    const autoplay =
        settings.autoplay ? 1 : 0;

    const mute =
        settings.mute ? 1 : 0;

    return (
        "https://www.youtube.com/embed/" +
        encodeURIComponent(videoId) +
        "?autoplay=" + autoplay +
        "&mute=" + mute +
        "&playsinline=1" +
        "&rel=0" +
        "&modestbranding=1" +
        "&enablejsapi=1"
    );
}


/* =========================================================
   CREATE SHORT
========================================================= */

function createShort(video, index) {

    const article = document.createElement("article");

    article.className = "short";

    article.dataset.videoId = video.id;

    article.dataset.index = index;

    article.dataset.category = video.category;

    const shell = document.createElement("div");

    shell.className = "video-shell";

    const loading = document.createElement("div");

    loading.className = "loading";

    loading.innerHTML =
        '<div class="spinner"></div>';

    shell.appendChild(loading);

    const iframe = document.createElement("iframe");

    iframe.title = video.title;

    iframe.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";

    iframe.allowFullscreen = true;

    iframe.loading =
        index < 2 ? "eager" : "lazy";

    iframe.dataset.videoId = video.id;

    if (index < 2) {
        iframe.src = youtubeURL(video.id);
    }

    iframe.addEventListener("load", () => {
        loading.style.display = "none";
    });

    shell.appendChild(iframe);

    article.appendChild(shell);

    const info = document.createElement("div");

    info.className = "info";

    const creator = document.createElement("div");

    creator.className = "creator";

    creator.textContent =
        "@" + video.creator;

    const title = document.createElement("div");

    title.className = "title";

    title.textContent =
        video.title;

    const category = document.createElement("div");

    category.className = "category";

    category.textContent =
        video.category;

    info.appendChild(creator);
    info.appendChild(title);
    info.appendChild(category);

    article.appendChild(info);


    /* ACTIONS */

    const actions = document.createElement("div");

    actions.className = "actions";


    /* LIKE */

    const likeButton =
        document.createElement("button");

    likeButton.className = "action";

    if (likes[video.id]) {
        likeButton.classList.add("liked");
    }

    likeButton.innerHTML = `
        <span class="action-circle">♥</span>
        <span class="action-label">Like</span>
    `;

    likeButton.addEventListener("click", event => {

        event.stopPropagation();

        if (likes[video.id]) {
            delete likes[video.id];
            likeButton.classList.remove("liked");
        } else {
            likes[video.id] = true;
            likeButton.classList.add("liked");
        }

        saveLikes();
    });


    /* SHARE */

    const shareButton =
        document.createElement("button");

    shareButton.className = "action";

    shareButton.innerHTML = `
        <span class="action-circle">↗</span>
        <span class="action-label">Share</span>
    `;

    shareButton.addEventListener("click", async event => {

        event.stopPropagation();

        const url =
            "https://www.youtube.com/shorts/" +
            video.id;

        try {

            if (navigator.share) {

                await navigator.share({
                    title: video.title,
                    url
                });

            } else if (navigator.clipboard) {

                await navigator.clipboard.writeText(url);

                shareButton.querySelector(".action-label").textContent =
                    "Copied!";

                setTimeout(() => {
                    shareButton.querySelector(".action-label").textContent =
                        "Share";
                }, 1200);
            }

        } catch (error) {
            console.log("Share cancelled.");
        }
    });


    /* OPEN YOUTUBE */

    const openButton =
        document.createElement("button");

    openButton.className = "action";

    openButton.innerHTML = `
        <span class="action-circle">▶</span>
        <span class="action-label">YouTube</span>
    `;

    openButton.addEventListener("click", event => {

        event.stopPropagation();

        window.open(
            "https://www.youtube.com/shorts/" +
            video.id,
            "_blank",
            "noopener,noreferrer"
        );
    });


    actions.appendChild(likeButton);
    actions.appendChild(shareButton);
    actions.appendChild(openButton);

    article.appendChild(actions);


    /* PROGRESS */

    const progress =
        document.createElement("div");

    progress.className = "progress";

    progress.innerHTML =
        '<div class="progress-fill"></div>';

    article.appendChild(progress);

    return article;
}


/* =========================================================
   LAZY LOAD
========================================================= */

function loadIframe(article) {

    if (!article) {
        return;
    }

    const iframe =
        article.querySelector("iframe");

    if (!iframe) {
        return;
    }

    if (
        iframe.getAttribute("src") &&
        iframe.getAttribute("src") !== "about:blank"
    ) {
        return;
    }

    const videoId =
        article.dataset.videoId;

    if (!videoId) {
        return;
    }

    iframe.src =
        youtubeURL(videoId);
}


/* =========================================================
   RESTART VIDEO
========================================================= */

function restartShort(article) {

    if (!article) {
        return;
    }

    const iframe =
        article.querySelector("iframe");

    if (!iframe) {
        return;
    }

    const videoId =
        article.dataset.videoId;

    if (!videoId) {
        return;
    }

    if (resettingVideos.has(videoId)) {
        return;
    }

    resettingVideos.add(videoId);

    iframe.src = "about:blank";

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            iframe.src =
                youtubeURL(videoId);

            setTimeout(() => {

                resettingVideos.delete(videoId);

            }, 300);
        });
    });
}


/* =========================================================
   WATCH TRACKING
========================================================= */

function stopWatchTimer() {

    if (watchTimer) {

        clearInterval(watchTimer);

        watchTimer = null;
    }
}


function startWatchTimer(article) {

    stopWatchTimer();

    if (!article) {
        return;
    }

    watchStartedAt =
        Date.now();

    updateProgress(article);

    watchTimer = setInterval(() => {

        updateProgress(article);

    }, 100);
}


function finishWatch(article) {

    if (!article) {
        return;
    }

    const seconds =
        (Date.now() - watchStartedAt) / 1000;

    const index =
        Number(article.dataset.index);

    const video =
        orderedVideos[index];

    if (!video) {
        return;
    }

    if (seconds >= WATCH_THRESHOLD) {

        recordWatch(
            video,
            seconds
        );

    } else {

        recordSkip(video);
    }
}


function updateProgress(article) {

    if (!article) {
        return;
    }

    const fill =
        article.querySelector(".progress-fill");

    if (!fill) {
        return;
    }

    const elapsed =
        (Date.now() - watchStartedAt) / 1000;

    const percentage =
        Math.min(
            100,
            (elapsed / 60) * 100
        );

    fill.style.width =
        percentage + "%";
}


/* =========================================================
   FEED BUILD
========================================================= */

function buildFeed() {

    const feed =
        document.getElementById("feed");

    feed.innerHTML = "";

    orderedVideos =
        smartSortVideos(VIDEOS);

    if (!orderedVideos.length) {

        document.getElementById(
            "emptyMessage"
        ).style.display = "flex";

        return;
    }

    document.getElementById(
        "emptyMessage"
    ).style.display = "none";

    orderedVideos.forEach(
        (video, index) => {

            const article =
                createShort(
                    video,
                    index
                );

            feed.appendChild(article);
        }
    );

    built = true;

    setupObserver();

    const first =
        feed.querySelector(".short");

    if (first) {

        loadIframe(first);

        activeArticle = first;

        activeIndex = 0;

        startWatchTimer(first);
    }
}


/* =========================================================
   INTERSECTION OBSERVER
========================================================= */

let observer = null;

function setupObserver() {

    if (observer) {
        observer.disconnect();
    }

    observer =
        new IntersectionObserver(
            entries => {

                let bestEntry = null;

                entries.forEach(entry => {

                    if (
                        entry.isIntersecting &&
                        entry.intersectionRatio >= .65
                    ) {

                        if (
                            !bestEntry ||
                            entry.intersectionRatio >
                            bestEntry.intersectionRatio
                        ) {
                            bestEntry = entry;
                        }
                    }
                });

                if (!bestEntry) {
                    return;
                }

                const article =
                    bestEntry.target;

                if (
                    activeArticle &&
                    article !== activeArticle
                ) {

                    finishWatch(
                        activeArticle
                    );

                    restartShort(
                        activeArticle
                    );
                }

                if (article !== activeArticle) {

                    activeArticle =
                        article;

                    activeIndex =
                        Number(
                            article.dataset.index
                        );

                    loadIframe(article);

                    const next =
                        article.nextElementSibling;

                    const previous =
                        article.previousElementSibling;

                    if (next) {
                        loadIframe(next);
                    }

                    if (previous) {
                        loadIframe(previous);
                    }

                    startWatchTimer(article);
                }

            },
            {
                threshold: [
                    .65,
                    .8,
                    .95
                ]
            }
        );

    document
        .querySelectorAll(".short")
        .forEach(article => {

            observer.observe(article);

        });
}

    stopWatchTimer();

    activeArticle = null;

    activeIndex = 0;

    built = false;

    buildFeed();

    document.getElementById(
        "feed"
    ).scrollTo({
        top: 0,
        behavior: "instant"
    });
}


/* =========================================================
   KEYBOARD NAVIGATION
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            settingsOverlay.classList.contains(
                "open"
            )
        ) {

            if (event.key === "Escape") {

                settingsOverlay.classList.remove(
                    "open"
                );
            }

            return;
        }

        if (
            event.key === "ArrowDown" ||
            event.key === "PageDown"
        ) {

            event.preventDefault();

            goToIndex(
                activeIndex + 1
            );
        }

        if (
            event.key === "ArrowUp" ||
            event.key === "PageUp"
        ) {

            event.preventDefault();

            goToIndex(
                activeIndex - 1
            );
        }
    }
);


function goToIndex(index) {

    if (!orderedVideos.length) {
        return;
    }

    index =
        Math.max(
            0,
            Math.min(
                orderedVideos.length - 1,
                index
            )
        );

    const article =
        document.querySelector(
            `.short[data-index="${index}"]`
        );

    if (!article) {
        return;
    }

    article.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}


/* =========================================================
   MOUSE WHEEL / TOUCH FRIENDLY FEED
========================================================= */

let wheelLocked = false;

document.getElementById(
    "feed"
).addEventListener(
    "wheel",
    event => {

        if (Math.abs(event.deltaY) < 25) {
            return;
        }

        if (wheelLocked) {
            event.preventDefault();
            return;
        }

        wheelLocked = true;

        if (event.deltaY > 0) {

            goToIndex(
                activeIndex + 1
            );

        } else {

            goToIndex(
                activeIndex - 1
            );
        }

        setTimeout(() => {

            wheelLocked = false;

        }, 550);

    },
    {
        passive: false
    }
);


/* =========================================================
   INITIALISE
========================================================= */

syncSettingsUI();

buildFeed();


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (document.hidden) {

            if (activeArticle) {
                finishWatch(activeArticle);
            }

            stopWatchTimer();

        } else {

            if (activeArticle) {
                startWatchTimer(activeArticle);
            }
        }
    }
);


/* =========================================================
   SAFETY FALLBACK
========================================================= */

window.addEventListener(
    "error",
    event => {

        console.error(
            "ShortsFlow error:",
            event.error || event.message
        );
    }
);

window.addEventListener(
    "unhandledrejection",
    event => {

        console.error(
            "ShortsFlow promise error:",
            event.reason
        );
    }
);

</script>
