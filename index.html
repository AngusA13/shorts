<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Shorts AI Feed</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
    color: inherit;
}

.app {
    position: relative;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #050505;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    position: fixed;
    z-index: 500;
    top: 0;
    left: 0;
    right: 0;

    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 10px 18px;

    pointer-events: none;
}

.topbar > * {
    pointer-events: auto;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 20px;
    font-weight: 850;

    text-shadow:
        0 2px 12px rgba(0,0,0,.8);
}

.brand-icon {
    width: 36px;
    height: 36px;

    display: grid;
    place-items: center;

    border-radius: 11px;

    background: white;
    color: black;

    box-shadow:
        0 8px 30px rgba(0,0,0,.4);
}

.top-actions {
    display: flex;
    gap: 8px;
}

.top-button {
    width: 42px;
    height: 42px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background: rgba(20,20,20,.7);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    font-size: 18px;

    transition: .2s;
}

.top-button:hover {
    background: rgba(60,60,60,.8);
    transform: translateY(-1px);
}

.top-button:active {
    transform: scale(.9);
}

/* =========================================================
   FEED
========================================================= */

.feed {
    width: 100%;
    height: 100%;

    overflow-y: auto;
    overflow-x: hidden;

    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;

    scrollbar-width: none;

    overscroll-behavior-y: contain;
}

.feed::-webkit-scrollbar {
    display: none;
}

.short {
    position: relative;

    width: 100%;
    height: 100dvh;
    min-height: 100dvh;

    overflow: hidden;

    scroll-snap-align: start;
    scroll-snap-stop: always;

    background: #080808;
}

.short::after {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    z-index: 8;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.55),
            transparent 24%,
            transparent 58%,
            rgba(0,0,0,.88)
        );
}

/* =========================================================
   YOUTUBE
========================================================= */

.player-container {
    position: absolute;
    inset: 0;

    display: grid;
    place-items: center;

    background: #000;
}

.youtube-player {
    position: absolute;

    width: 100vw;
    height: 56.25vw;

    min-width: 177.78vh;
    min-height: 100vh;

    border: 0;
}

.youtube-player iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

/* =========================================================
   VIDEO LOADING
========================================================= */

.loading {
    position: absolute;
    z-index: 50;

    inset: 0;

    display: grid;
    place-items: center;

    pointer-events: none;

    transition: .3s;
}

.loading.hidden {
    opacity: 0;
}

.spinner {
    width: 40px;
    height: 40px;

    border-radius: 50%;

    border:
        3px solid
        rgba(255,255,255,.15);

    border-top-color: white;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================================
   VIDEO INFORMATION
========================================================= */

.video-info {
    position: absolute;

    z-index: 30;

    left: 20px;
    right: 90px;
    bottom: 28px;

    text-shadow:
        0 2px 8px rgba(0,0,0,.9);
}

.channel-row {
    display: flex;
    align-items: center;

    gap: 10px;

    margin-bottom: 10px;
}

.avatar {
    width: 43px;
    height: 43px;

    border-radius: 50%;

    display: grid;
    place-items: center;

    background:
        linear-gradient(
            135deg,
            #ff0050,
            #7a2cff,
            #00cfff
        );

    border:
        2px solid
        rgba(255,255,255,.9);

    font-weight: 900;

    overflow: hidden;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.channel {
    font-weight: 800;
    font-size: 15px;
}

.title {
    font-size: 20px;
    line-height: 1.2;

    font-weight: 850;

    margin-bottom: 7px;
}

.description {
    font-size: 14px;

    line-height: 1.4;

    max-width: 650px;

    opacity: .9;
}

.category-pill {
    display: inline-flex;

    margin-top: 8px;

    padding: 5px 9px;

    border-radius: 999px;

    background:
        rgba(255,255,255,.12);

    border:
        1px solid
        rgba(255,255,255,.1);

    font-size: 11px;

    font-weight: 750;

    backdrop-filter: blur(10px);
}

/* =========================================================
   ACTIONS
========================================================= */

.actions {
    position: absolute;

    z-index: 40;

    right: 15px;
    bottom: 28px;

    width: 58px;

    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 13px;
}

.action {
    width: 54px;

    min-height: 60px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 3px;

    background: transparent;

    text-shadow:
        0 2px 7px black;
}

.action-icon {
    width: 48px;
    height: 48px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background:
        rgba(20,20,20,.65);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter: blur(14px);

    font-size: 22px;

    transition: .2s;
}

.action:hover .action-icon {
    transform: scale(1.08);
}

.action:active .action-icon {
    transform: scale(.88);
}

.action.liked .action-icon {
    color: #ff315e;

    background:
        rgba(255,0,70,.18);
}

.action-label {
    font-size: 10px;
    font-weight: 750;
}

/* =========================================================
   WATCH INDICATOR
========================================================= */

.watch-time {
    position: absolute;

    z-index: 25;

    top: 72px;
    left: 18px;

    padding: 5px 9px;

    border-radius: 999px;

    background:
        rgba(0,0,0,.4);

    backdrop-filter: blur(10px);

    font-size: 11px;

    opacity: .7;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress {
    position: absolute;

    z-index: 60;

    left: 0;
    right: 0;
    bottom: 0;

    height: 3px;

    background:
        rgba(255,255,255,.15);
}

.progress-bar {
    height: 100%;

    width: 0%;

    background: white;
}

/* =========================================================
   MODAL
========================================================= */

.modal-layer {
    position: fixed;

    z-index: 5000;

    inset: 0;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 18px;

    background:
        rgba(0,0,0,.65);

    backdrop-filter: blur(16px);
}

.modal-layer.open {
    display: flex;
}

.modal {
    width: min(600px,100%);

    max-height: 90dvh;

    overflow-y: auto;

    padding: 24px;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            rgba(35,35,38,.98),
            rgba(15,15,17,.98)
        );

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.65);

    animation:
        modalIn .2s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform:
            translateY(15px)
            scale(.97);
    }

    to {
        opacity: 1;
        transform: none;
    }
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 20px;
}

.modal-title {
    font-size: 23px;
    font-weight: 900;
}

.close {
    width: 38px;
    height: 38px;

    border-radius: 50%;

    display: grid;
    place-items: center;

    background:
        rgba(255,255,255,.09);

    font-size: 18px;
}

/* =========================================================
   SETTINGS
========================================================= */

.setting-label {
    font-size: 13px;

    opacity: .65;

    margin:
        18px 0 8px;
}

.input {
    width: 100%;

    padding: 14px 15px;

    border-radius: 13px;

    outline: none;

    color: white;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.1);
}

.input:focus {
    border-color:
        rgba(255,255,255,.4);
}

.primary {
    width: 100%;

    margin-top: 13px;

    padding: 14px;

    border-radius: 13px;

    background: white;

    color: black;

    font-weight: 850;
}

.secondary {
    width: 100%;

    margin-top: 9px;

    padding: 13px;

    border-radius: 13px;

    background:
        rgba(255,255,255,.08);

    font-weight: 750;
}

.help {
    font-size: 13px;

    line-height: 1.5;

    opacity: .65;

    margin-bottom: 15px;
}

/* =========================================================
   INTERESTS
========================================================= */

.interests {
    display: flex;
    flex-wrap: wrap;

    gap: 7px;

    margin-top: 10px;
}

.interest {
    padding: 7px 10px;

    border-radius: 999px;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.08);

    font-size: 12px;

    cursor: pointer;

    transition: .2s;
}

.interest.active {
    background: white;
    color: black;
}

/* =========================================================
   STATS
========================================================= */

.stats {
    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 9px;

    margin-top: 10px;
}

.stat {
    padding: 14px;

    border-radius: 15px;

    background:
        rgba(255,255,255,.06);
}

.stat-value {
    font-size: 22px;
    font-weight: 900;
}

.stat-label {
    font-size: 11px;
    opacity: .55;
}

/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;

    z-index: 9000;

    left: 50%;
    bottom: 25px;

    transform:
        translate(-50%,20px);

    opacity: 0;

    pointer-events: none;

    padding: 12px 17px;

    border-radius: 999px;

    background:
        rgba(25,25,25,.95);

    border:
        1px solid
        rgba(255,255,255,.1);

    font-size: 13px;
    font-weight: 750;

    transition: .25s;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%,0);
}

/* =========================================================
   DESKTOP
========================================================= */

@media (min-width:800px) {

    .feed {
        width: min(900px,100%);

        margin: auto;

        box-shadow:
            0 0 100px
            rgba(0,0,0,.55);
    }

    .topbar {
        width: min(900px,100%);

        left: 50%;
        right: auto;

        transform:
            translateX(-50%);
    }
}

@media (max-width:600px) {

    .brand {
        font-size: 18px;
    }

    .topbar {
        padding:
            8px 11px;
    }

    .video-info {
        left: 13px;
        right: 72px;
        bottom: 20px;
    }

    .actions {
        right: 7px;
        bottom: 20px;
    }

    .title {
        font-size: 17px;
    }

    .description {
        font-size: 13px;
    }

    .avatar {
        width: 38px;
        height: 38px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="topbar">

        <div class="brand">
            <div class="brand-icon">▶</div>
            <span>Shorts</span>
        </div>

        <div class="top-actions">

            <button
                class="top-button"
                id="refreshButton"
                title="Find more Shorts"
            >
                ↻
            </button>

            <button
                class="top-button"
                id="settingsButton"
                title="Settings"
            >
                ⚙
            </button>

        </div>

    </header>

    <main
        class="feed"
        id="feed"
    ></main>

</div>

<!-- =====================================================
     SETTINGS MODAL
===================================================== -->

<div
    class="modal-layer"
    id="settingsModal"
>

    <div class="modal">

        <div class="modal-header">

            <div class="modal-title">
                Shorts Settings
            </div>

            <button
                class="close"
                data-close="settingsModal"
            >
                ×
            </button>

        </div>

        <div class="help">

            Add your YouTube Data API key below.
            It lets this app search YouTube for more
            videos based on the topics you watch.

        </div>

        <div class="setting-label">
            YouTube Data API key
        </div>

        <input
            class="input"
            id="apiKeyInput"
            type="password"
            placeholder="AIza..."
            autocomplete="off"
        >

        <button
            class="primary"
            id="saveApiKey"
        >
            Save API Key
        </button>

        <div class="setting-label">
            Your interests
        </div>

        <div
            class="interests"
            id="interestList"
        ></div>

        <div class="setting-label">
            Recommendation statistics
        </div>

        <div
            class="stats"
            id="stats"
        ></div>

        <button
            class="secondary"
            id="resetRecommendations"
        >
            Reset Recommendation History
        </button>

        <button
            class="secondary"
            data-close="settingsModal"
        >
            Done
        </button>

    </div>

</div>

<div
    class="toast"
    id="toast"
></div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
/* =========================================================
   CONFIGURATION
========================================================= */

const CATEGORY_CONFIG = {

    gaming: {
        label: "🎮 Gaming",
        queries: [
            "gaming shorts",
            "funny gaming",
            "gaming clips",
            "gaming moments"
        ]
    },

    technology: {
        label: "💻 Technology",
        queries: [
            "technology shorts",
            "cool technology",
            "tech gadgets",
            "computer tech"
        ]
    },

    engineering: {
        label: "⚙️ Engineering",
        queries: [
            "engineering shorts",
            "engineering projects",
            "mechanical engineering",
            "engineering inventions"
        ]
    },

    cars: {
        label: "🚗 Cars",
        queries: [
            "car shorts",
            "car builds",
            "car facts",
            "car modifications"
        ]
    },

    science: {
        label: "🔬 Science",
        queries: [
            "science shorts",
            "cool science",
            "science experiments",
            "science facts"
        ]
    },

    animals: {
        label: "🐶 Animals",
        queries: [
            "animal shorts",
            "funny animals",
            "cute animals",
            "animal facts"
        ]
    },

    comedy: {
        label: "😂 Comedy",
        queries: [
            "comedy shorts",
            "funny shorts",
            "funny clips",
            "comedy sketches"
        ]
    },

    sports: {
        label: "🏀 Sports",
        queries: [
            "sports shorts",
            "sports highlights",
            "football shorts",
            "basketball shorts"
        ]
    },

    food: {
        label: "🍔 Food",
        queries: [
            "food shorts",
            "cooking shorts",
            "food hacks",
            "easy recipes"
        ]
    },

    diy: {
        label: "🔨 DIY",
        queries: [
            "DIY shorts",
            "DIY projects",
            "building projects",
            "maker projects"
        ]
    },

    space: {
        label: "🚀 Space",
        queries: [
            "space shorts",
            "NASA shorts",
            "astronomy shorts",
            "space facts"
        ]
    },

    music: {
        label: "🎵 Music",
        queries: [
            "music shorts",
            "music performances",
            "instrument shorts",
            "music clips"
        ]
    }

};

/* =========================================================
   DEFAULT STARTING VIDEOS
========================================================= */

const STARTING_VIDEOS = [

    {
        id: "M7lc1UVf-VE",
        category: "technology",
        title: "Technology",
        description: "Technology video",
        channel: "YouTube"
    },

    {
        id: "dQw4w9WgXcQ",
        category: "music",
        title: "Music",
        description: "Music video",
        channel: "YouTube"
    }

];

/* =========================================================
   STORAGE
========================================================= */

let apiKey =
    localStorage.getItem(
        "shorts-youtube-api-key"
    ) || "";

let videos =
    JSON.parse(
        localStorage.getItem(
            "shorts-feed-videos"
        ) || "null"
    ) || STARTING_VIDEOS;

let liked =
    JSON.parse(
        localStorage.getItem(
            "shorts-liked"
        ) || "{}"
    );

let watchHistory =
    JSON.parse(
        localStorage.getItem(
            "shorts-watch-history"
        ) || "{}"
    );

let interests =
    JSON.parse(
        localStorage.getItem(
            "shorts-interests"
        ) || "{}"
    );

/*
   Each interest starts at 1.

   Watching a video increases the score.

   Watching longer increases it more.

   Skipping quickly adds almost nothing.
*/

Object.keys(CATEGORY_CONFIG).forEach(category => {

    if (
        typeof interests[category] !== "number"
    ) {
        interests[category] = 1;
    }

});

/* =========================================================
   PLAYER STATE
========================================================= */

let players = {};

let activeIndex = 0;

let playerReady = false;

let watchStartedAt = {};

let watchTimer = {};

let loadingMore = false;

let muted = true;

/* =========================================================
   STORAGE SAVE
========================================================= */

function saveAll() {

    localStorage.setItem(
        "shorts-youtube-api-key",
        apiKey
    );

    localStorage.setItem(
        "shorts-feed-videos",
        JSON.stringify(videos)
    );

    localStorage.setItem(
        "shorts-liked",
        JSON.stringify(liked)
    );

    localStorage.setItem(
        "shorts-watch-history",
        JSON.stringify(watchHistory)
    );

    localStorage.setItem(
        "shorts-interests",
        JSON.stringify(interests)
    );
}

/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function formatNumber(number) {

    number =
        Number(number) || 0;

    if (number >= 1000000) {
        return (
            number / 1000000
        ).toFixed(1) + "M";
    }

    if (number >= 1000) {
        return (
            number / 1000
        ).toFixed(1) + "K";
    }

    return String(number);
}

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        showToast.timer
    );

    showToast.timer =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        },2300);
}

/* =========================================================
   CATEGORY DETECTION
========================================================= */

function detectCategory(video) {

    const text =
        (
            video.title +
            " " +
            video.description +
            " " +
            (video.tags || []).join(" ")
        )
        .toLowerCase();

    const scores = {};

    Object.keys(
        CATEGORY_CONFIG
    ).forEach(category => {

        scores[category] = 0;

        const queries =
            CATEGORY_CONFIG[
                category
            ].queries;

        queries.forEach(query => {

            const words =
                query
                    .toLowerCase()
                    .split(" ");

            words.forEach(word => {

                if (
                    word.length > 3 &&
                    text.includes(word)
                ) {
                    scores[category] += 1;
                }

            });

        });

    });

    let best =
        "technology";

    let bestScore = 0;

    Object.keys(scores)
        .forEach(category => {

            if (
                scores[category] >
                bestScore
            ) {

                best =
                    category;

                bestScore =
                    scores[category];
            }

        });

    return best;
}

/* =========================================================
   RECOMMENDATION ENGINE
========================================================= */

function weightedCategories() {

    const list = [];

    Object.keys(
        CATEGORY_CONFIG
    ).forEach(category => {

        const score =
            Math.max(
                1,
                interests[category] || 1
            );

        /*
           Turn the score into multiple
           entries so categories with
           higher interest have a greater
           chance of being searched.
        */

        const copies =
            Math.min(
                10,
                Math.ceil(
                    Math.sqrt(score)
                )
            );

        for (
            let i = 0;
            i < copies;
            i++
        ) {
            list.push(category);
        }

    });

    return list;
}

function chooseCategory() {

    const list =
        weightedCategories();

    if (!list.length) {
        return "technology";
    }

    return list[
        Math.floor(
            Math.random() *
            list.length
        )
    ];
}

/* =========================================================
   TRACK WATCHING
========================================================= */

function beginWatching(index) {

    const video =
        videos[index];

    if (!video) return;

    watchStartedAt[index] =
        Date.now();

    clearInterval(
        watchTimer[index]
    );

    watchTimer[index] =
        setInterval(() => {

            recordWatchTime(
                index,
                1
            );

        },1000);
}

function stopWatching(index) {

    clearInterval(
        watchTimer[index]
    );

    delete watchTimer[index];

    if (
        watchStartedAt[index]
    ) {

        const seconds =
            Math.floor(
                (
                    Date.now() -
                    watchStartedAt[index]
                ) / 1000
            );

        if (seconds > 0) {

            recordWatchTime(
                index,
                seconds
            );
        }

    }

    delete watchStartedAt[index];
}

function recordWatchTime(
    index,
    seconds
) {

    const video =
        videos[index];

    if (!video) return;

    const category =
        video.category ||
        detectCategory(video);

    if (!watchHistory[video.id]) {

        watchHistory[video.id] = {
            seconds: 0,
            category
        };

    }

    watchHistory[
        video.id
    ].seconds += seconds;

    /*
       Interest growth:

       1-4 sec:
       very small signal

       5-15 sec:
       moderate signal

       15+ sec:
       strong signal
    */

    let gain = 0;

    if (seconds <= 4) {
        gain = .03;
    } else if (seconds <= 15) {
        gain = .08;
    } else {
        gain = .15;
    }

    interests[category] =
        (
            interests[category] ||
            1
        ) + gain;

    saveAll();
}

/* =========================================================
   LIKE = STRONGER SIGNAL
========================================================= */

function toggleLike(index) {

    const video =
        videos[index];

    if (!video) return;

    if (liked[video.id]) {

        delete liked[video.id];

        interests[
            video.category
        ] = Math.max(
            1,
            (
                interests[
                    video.category
                ] || 1
            ) - 2
        );

    } else {

        liked[video.id] = true;

        interests[
            video.category
        ] =
            (
                interests[
                    video.category
                ] || 1
            ) + 3;

        showToast(
            "More videos like this will appear"
        );
    }

    saveAll();

    renderFeed(
        activeIndex
    );
}

/* =========================================================
   CREATE PLAYERS
========================================================= */

function createPlayers() {

    if (!window.YT) {
        return;
    }

    videos.forEach(
        (video,index) => {

            if (
                players[index]
            ) {
                return;
            }

            const element =
                document.getElementById(
                    "player-" + index
                );

            if (!element) {
                return;
            }

            players[index] =
                new YT.Player(
                    element,
                    {

                        videoId:
                            video.id,

                        playerVars: {

                            autoplay: 0,

                            controls: 1,

                            playsinline: 1,

                            rel: 0,

                            modestbranding: 1,

                            enablejsapi: 1,

                            origin:
                                window.location.origin

                        },

                        events: {

                            onReady:
                                function(event) {

                                    event.target.mute();

                                    if (
                                        index ===
                                        activeIndex
                                    ) {

                                        event.target
                                            .playVideo();

                                    }

                                },

                            onStateChange:
                                function(event) {

                                    if (
                                        event.data ===
                                        YT.PlayerState
                                            .PLAYING
                                    ) {

                                        const loading =
                                            document
                                                .getElementById(
                                                    "loading-" +
                                                    index
                                                );

                                        if (
                                            loading
                                        ) {

                                            loading
                                                .classList
                                                .add(
                                                    "hidden"
                                                );

                                        }

                                        beginWatching(
                                            index
                                        );

                                    }

                                    if (
                                        event.data ===
                                        YT.PlayerState
                                            .PAUSED
                                    ) {

                                        stopWatching(
                                            index
                                        );

                                    }

                                    if (
                                        event.data ===
                                        YT.PlayerState
                                            .ENDED
                                    ) {

                                        stopWatching(
                                            index
                                        );

                                        goToShort(
                                            index + 1
                                        );

                                    }

                                }

                    }
                );
        }
    );
}

/* =========================================================
   OBSERVER
========================================================= */

function observeFeed() {

    const sections =
        document.querySelectorAll(
            ".short"
        );

    const observer =
        new IntersectionObserver(
            entries => {

                entries.forEach(
                    entry => {

                        if (
                            entry.isIntersecting &&
                            entry.intersectionRatio >= .65
                        ) {

                            const index =
                                Number(
                                    entry.target
                                        .dataset
                                        .index
                                );

                            activateShort(
                                index
                            );

                        }

                    }
                );

            },
            {
                threshold: [.65]
            }
        );

    sections.forEach(
        section =>
            observer.observe(
                section
            )
    );
}

/* =========================================================
   ACTIVATE
========================================================= */

function activateShort(
    index
) {

    if (
        index === activeIndex
    ) {
        return;
    }

    stopWatching(
        activeIndex
    );

    activeIndex =
        index;

    Object.keys(players)
        .forEach(key => {

            const player =
                players[key];

            if (
                !player ||
                typeof
                player.pauseVideo !==
                "function"
            ) {
                return;
            }

            try {

                if (
                    Number(key) ===
                    index
                ) {

                    player.mute();

                    player.playVideo();

                } else {

                    player.pauseVideo();

                }

            } catch(e) {}

        });

    /*
       Load more when the user gets
       near the end of the feed.
    */

    if (
        videos.length -
        index <= 4
    ) {

        loadMoreRecommendations();

    }
}

/* =========================================================
   GO TO SHORT
========================================================= */

function goToShort(
    index
) {

    if (
        index < 0 ||
        index >= videos.length
    ) {
        return;
    }

    const target =
        document.querySelector(
            `.short[data-index="${index}"]`
        );

    if (!target) {
        return;
    }

    target.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}

/* =========================================================
   YOUTUBE DATA API SEARCH
========================================================= */

async function searchYouTube(
    query,
    maxResults = 8
) {

    if (!apiKey) {

        showToast(
            "Add your YouTube API key in Settings"
        );

        return [];

    }

    const params =
        new URLSearchParams({

            part: "snippet",

            q: query,

            type: "video",

            maxResults:
                String(maxResults),

            order: "relevance",

            regionCode: "AU",

            relevanceLanguage: "en",

            videoEmbeddable: "true",

            videoSyndicated: "true",

            safeSearch: "moderate"

        });

    const url =
        "https://www.googleapis.com/youtube/v3/search?" +
        params.toString() +
        "&key=" +
        encodeURIComponent(
            apiKey
        );

    try {

        const response =
            await fetch(
                url
            );

        const data =
            await response.json();

        if (
            !response.ok
        ) {

            console.error(
                "YouTube API error:",
                data
            );

            if (
                data.error &&
                data.error.message
            ) {

                showToast(
                    data.error.message
                );

            }

            return [];

        }

        return (
            data.items || []
        )
        .filter(
            item =>
                item.id &&
                item.id.videoId
        )
        .map(
            item => ({

                id:
                    item.id.videoId,

                title:
                    item.snippet.title,

                description:
                    item.snippet.description,

                channel:
                    item.snippet.channelTitle,

                channelId:
                    item.snippet.channelId,

                thumbnail:
                    item.snippet.thumbnails
                        ?.high
                        ?.url ||
                    item.snippet.thumbnails
                        ?.medium
                        ?.url,

                publishedAt:
                    item.snippet.publishedAt,

                category:
                    queryCategory(
                        query
                    )

            })
        );

    } catch(error) {

        console.error(
            error
        );

        showToast(
            "Couldn't connect to YouTube"
        );

        return [];
    }
}

/* =========================================================
   FIGURE OUT WHICH CATEGORY A QUERY IS
========================================================= */

function queryCategory(
    query
) {

    const lower =
        query.toLowerCase();

    for (
        const category of
        Object.keys(
            CATEGORY_CONFIG
        )
    ) {

        if (
            CATEGORY_CONFIG[
                category
            ].queries.some(
                q =>
                    lower.includes(
                        q.split(" ")[0]
                    )
            )
        ) {

            return category;

        }

    }

    return "technology";
}

/* =========================================================
   LOAD RECOMMENDATIONS
========================================================= */

async function loadMoreRecommendations() {

    if (
        loadingMore
    ) {
        return;
    }

    if (!apiKey) {

        showToast(
            "Add a YouTube API key to load more"
        );

        return;
    }

    loadingMore = true;

    showToast(
        "Finding more Shorts you might like..."
    );

    /*
       Pick several high-interest categories.
    */

    const categories =
        [];

    const sorted =
        Object.keys(
            interests
        )
        .sort(
            (a,b) =>
                interests[b] -
                interests[a]
        );

    /*
       Take the two strongest
       interests plus one random
       category so the feed doesn't
       become completely repetitive.
    */

    sorted
        .slice(0,2)
        .forEach(
            category =>
                categories.push(
                    category
                )
        );

    const randomCategory =
        chooseCategory();

    if (
        !categories.includes(
            randomCategory
        )
    ) {

        categories.push(
            randomCategory
        );

    }

    const allResults = [];

    for (
        const category of
        categories
    ) {

        const config =
            CATEGORY_CONFIG[
                category
            ];

        if (!config) {
            continue;
        }

        const query =
            config.queries[
                Math.floor(
                    Math.random() *
                    config.queries.length
                )
            ];

        const results =
            await searchYouTube(
                query,
                8
            );

        results.forEach(
            video => {

                video.category =
                    category;

                allResults.push(
                    video
                );

            }
        );

    }

    /*
       Remove videos already shown.
    */

    const existing =
        new Set(
            videos.map(
                video =>
                    video.id
            )
        );

    const fresh =
        allResults
            .filter(
                video =>
                    !existing.has(
                        video.id
                    )
            );

    /*
       Shuffle new results.
    */

    fresh.sort(
        () =>
            Math.random() -
            .5
    );

    /*
       Add them.
    */

    if (
        fresh.length
    ) {

        videos.push(
            ...fresh
        );

        saveAll();

        const oldIndex =
            activeIndex;

        renderFeed(
            oldIndex
        );

        showToast(
            `Found ${fresh.length} new Shorts`
        );

    } else {

        showToast(
            "No new Shorts found"
        );

    }

    loadingMore = false;
}

/* =========================================================
   SHARE
========================================================= */

async function shareVideo(
    index
) {

    const video =
        videos[index];

    const url =
        "https://www.youtube.com/watch?v=" +
        video.id;

    if (
        navigator.share
    ) {

        try {

            await navigator.share({
                title:
                    video.title,
                text:
                    video.description,
                url
            });

            return;

        } catch(e) {}

    }

    try {

        await navigator.clipboard
            .writeText(
                url
            );

        showToast(
            "YouTube link copied"
        );

    } catch(e) {

        window.prompt(
            "Copy this link:",
            url
        );

    }
}

/* =========================================================
   MUTE
========================================================= */

function toggleMute() {

    muted =
        !muted;

    Object.values(
        players
    ).forEach(
        player => {

            try {

                if (
                    muted
                ) {
                    player.mute();
                } else {
                    player.unMute();
                }

            } catch(e) {}

        }
    );

    showToast(
        muted
        ? "Sound muted"
        : "Sound on"
    );
}

/* =========================================================
   STATS
========================================================= */

function renderStats() {

    const container =
        document.getElementById(
            "stats"
        );

    const watched =
        Object.keys(
            watchHistory
        ).length;

    const totalSeconds =
        Object.values(
            watchHistory
        )
        .reduce(
            (total,item) =>
                total +
                (
                    item.seconds ||
                    0
                ),
            0
        );

    const strongest =
        Object.keys(
            interests
        )
        .sort(
            (a,b) =>
                interests[b] -
                interests[a]
        )[0];

    container.innerHTML = `

        <div class="stat">

            <div class="stat-value">
                ${watched}
            </div>

            <div class="stat-label">
                Videos watched
            </div>

        </div>

        <div class="stat">

            <div class="stat-value">
                ${Math.floor(
                    totalSeconds / 60
                )}m
            </div>

            <div class="stat-label">
                Watch time
            </div>

        </div>

        <div class="stat">

            <div class="stat-value">
                ${
                    CATEGORY_CONFIG[
                        strongest
                    ]?.label ||
                    "None"
                }
            </div>

            <div class="stat-label">
                Strongest interest
            </div>

        </div>

        <div class="stat">

            <div class="stat-value">
                ${videos.length}
            </div>

            <div class="stat-label">
                Videos in feed
            </div>

        </div>

    `;

}

/* =========================================================
   KEYBOARD NAVIGATION
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.target.tagName ===
                "INPUT"
        ) {
            return;
        }

        if (
            event.key ===
            "ArrowDown"
        ) {

            event.preventDefault();

            goToShort(
                Math.min(
                    activeIndex + 1,
                    videos.length - 1
                )
            );

        }

        if (
            event.key ===
            "ArrowUp"
        ) {

            event.preventDefault();

            goToShort(
                Math.max(
                    activeIndex - 1,
                    0
                )
            );

        }

        if (
            event.key.toLowerCase() ===
            "m"
        ) {

            toggleMute();

        }

    }
);

/* =========================================================
   MOUSE WHEEL
========================================================= */

let wheelLock =
    false;

document
    .getElementById(
        "feed"
    )
    .addEventListener(
        "wheel",
        event => {

            if (
                wheelLock ||
                Math.abs(
                    event.deltaY
                ) < 20
            ) {
                return;
            }

            wheelLock =
                true;

            if (
                event.deltaY > 0
            ) {

                goToShort(
                    Math.min(
                        activeIndex + 1,
                        videos.length - 1
                    )
                );

            } else {

                goToShort(
                    Math.max(
                        activeIndex - 1,
                        0
                    )
                );

            }

            setTimeout(
                () => {
                    wheelLock = false;
                },
                650
            );

        },
        {
            passive: true
        }
    );

/* =========================================================
   TOUCH SWIPING
========================================================= */

let touchStartY =
    0;

document
    .getElementById(
        "feed"
    )
    .addEventListener(
        "touchstart",
        event => {

            touchStartY =
                event
                    .changedTouches[0]
                    .clientY;

        },
        {
            passive: true
        }
    );

document
    .getElementById(
        "feed"
    )
    .addEventListener(
        "touchend",
        event => {

            const touchEndY =
                event
                    .changedTouches[0]
                    .clientY;

            const difference =
                touchStartY -
                touchEndY;

            if (
                Math.abs(
                    difference
                ) < 50
            ) {
                return;
            }

            if (
                difference > 0
            ) {

                goToShort(
                    Math.min(
                        activeIndex + 1,
                        videos.length - 1
                    )
                );

            } else {

                goToShort(
                    Math.max(
                        activeIndex - 1,
                        0
                    )
                );

            }

        },
        {
            passive: true
        }
    );

/* =========================================================
   PROGRESS BAR
========================================================= */

setInterval(
    () => {

        const player =
            players[
                activeIndex
            ];

        const bar =
            document.getElementById(
                "progress-" +
                activeIndex
            );

        if (
            !player ||
            !bar
        ) {
            return;
        }

        try {

            const duration =
                player.getDuration();

            const current =
                player.getCurrentTime();

            if (
                duration > 0
            ) {

                bar.style.width =
                    (
                        current /
                        duration *
                        100
                    ) + "%";

            }

        } catch(e) {}

    },
    100
);

/* =========================================================
   DOUBLE CLICK LIKE
========================================================= */

let lastClick =
    0;

document
    .getElementById(
        "feed"
    )
    .addEventListener(
        "click",
        event => {

            if (
                event.target.closest(
                    ".action"
                ) ||
                event.target.closest(
                    ".topbar"
                )
            ) {
                return;
            }

            const now =
                Date.now();

            if (
                now -
                lastClick <
                300
            ) {

                toggleLike(
                    activeIndex
                );

            }

            lastClick =
                now;

        }
    );

/* =========================================================
   START
========================================================= */

renderFeed(
    0
);

</script>

</body>
</html>
