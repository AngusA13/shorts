<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ShortsFlow</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
    overscroll-behavior:none;
}

.app{
    position:fixed;
    inset:0;
    background:#000;
    overflow:hidden;
}

/* TOP BAR */

.topbar{
    position:fixed;
    z-index:100;
    top:0;
    left:0;
    right:0;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    pointer-events:none;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.7),
        rgba(0,0,0,0)
    );
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:800;
    pointer-events:auto;
    text-shadow:0 2px 12px rgba(0,0,0,.8);
}

.brand-icon{
    width:34px;
    height:25px;
    border-radius:8px;
    background:#ff0033;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 5px 20px rgba(255,0,50,.35);
}

.brand-icon::after{
    content:"";
    width:0;
    height:0;
    border-top:7px solid transparent;
    border-bottom:7px solid transparent;
    border-left:11px solid #fff;
    margin-left:2px;
}

.top-actions{
    display:flex;
    gap:8px;
    pointer-events:auto;
}

.top-button{
    width:42px;
    height:42px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:50%;
    background:rgba(20,20,20,.55);
    backdrop-filter:blur(15px);
    color:#fff;
    cursor:pointer;
    font-size:18px;
    transition:.2s;
}

.top-button:hover{
    background:rgba(255,255,255,.16);
    transform:scale(1.05);
}

/* FEED */

.feed{
    position:absolute;
    inset:0;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
    scrollbar-width:none;
    overscroll-behavior-y:contain;
    background:#000;
}

.feed::-webkit-scrollbar{
    display:none;
}

.short{
    position:relative;
    width:100%;
    height:100vh;
    min-height:100vh;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    background:#000;
    overflow:hidden;
}

.video-container{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
}

.youtube-frame{
    width:min(100vw,100vh * .5625);
    height:100vh;
    min-width:320px;
    border:0;
    background:#000;
    display:block;
}

@media(min-width:700px){
    .youtube-frame{
        width:min(620px,100vw);
        height:min(100vh,1100px);
    }
}

/* LOADING */

.loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    background:
        radial-gradient(
            circle at center,
            rgba(30,30,30,.9),
            #000 65%
        );
    z-index:2;
    transition:opacity .3s;
}

.loading.hidden{
    opacity:0;
}

.loader{
    width:44px;
    height:44px;
    border:4px solid rgba(255,255,255,.18);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* RIGHT CONTROLS */

.side-controls{
    position:absolute;
    z-index:20;
    right:max(14px,calc((100vw - 700px) / 2));
    bottom:100px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.side-button{
    width:52px;
    height:52px;
    border:0;
    border-radius:50%;
    background:rgba(15,15,15,.65);
    backdrop-filter:blur(12px);
    color:#fff;
    cursor:pointer;
    font-size:23px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.18s;
    box-shadow:0 4px 20px rgba(0,0,0,.35);
}

.side-button:hover{
    background:rgba(255,255,255,.15);
    transform:scale(1.06);
}

.side-button:active{
    transform:scale(.9);
}

.side-button.liked{
    color:#ff1744;
}

/* INFO */

.short-info{
    position:absolute;
    z-index:20;
    left:max(18px,calc((100vw - 700px) / 2));
    right:90px;
    bottom:24px;
    max-width:560px;
    pointer-events:none;
    text-shadow:0 2px 12px rgba(0,0,0,.9);
}

.creator{
    font-size:17px;
    font-weight:800;
    margin-bottom:8px;
}

.description{
    font-size:14px;
    line-height:1.45;
    color:rgba(255,255,255,.92);
    max-width:500px;
}

.category{
    display:inline-block;
    margin-top:10px;
    padding:6px 10px;
    border-radius:999px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(10px);
    font-size:12px;
}

/* CENTER PLAY */

.center-play{
    position:absolute;
    z-index:30;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.85);
    width:76px;
    height:76px;
    border-radius:50%;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.2);
    color:#fff;
    font-size:28px;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:.2s;
}

.short.paused .center-play{
    opacity:1;
    pointer-events:auto;
    transform:translate(-50%,-50%) scale(1);
}

/* SCROLL HINT */

.scroll-hint{
    position:fixed;
    z-index:50;
    left:50%;
    bottom:13px;
    transform:translateX(-50%);
    font-size:11px;
    color:rgba(255,255,255,.45);
    pointer-events:none;
    transition:opacity .5s;
}

.scroll-hint.hidden{
    opacity:0;
}

/* SETTINGS */

.settings-overlay{
    position:fixed;
    z-index:500;
    inset:0;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(15px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.settings-overlay.show{
    display:flex;
}

.settings{
    width:min(440px,100%);
    background:#18181b;
    border:1px solid rgba(255,255,255,.1);
    border-radius:24px;
    padding:25px;
    box-shadow:0 30px 100px rgba(0,0,0,.6);
}

.settings-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.settings-header h2{
    font-size:22px;
}

.close-settings{
    width:36px;
    height:36px;
    border-radius:50%;
    border:0;
    background:rgba(255,255,255,.08);
    color:#fff;
    cursor:pointer;
    font-size:18px;
}

.setting-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 0;
    border-bottom:1px solid rgba(255,255,255,.07);
}

.setting-row:last-child{
    border-bottom:0;
}

.setting-label strong{
    display:block;
    margin-bottom:4px;
}

.setting-label small{
    color:#888;
}

.switch{
    width:48px;
    height:28px;
    border-radius:20px;
    border:0;
    background:#444;
    position:relative;
    cursor:pointer;
    transition:.2s;
}

.switch::after{
    content:"";
    position:absolute;
    width:22px;
    height:22px;
    left:3px;
    top:3px;
    border-radius:50%;
    background:#fff;
    transition:.2s;
}

.switch.active{
    background:#ff0033;
}

.switch.active::after{
    transform:translateX(20px);
}

/* MOBILE */

@media(max-width:600px){

    .topbar{
        height:60px;
        padding:0 14px;
    }

    .brand{
        font-size:17px;
    }

    .brand-icon{
        width:30px;
        height:22px;
        border-radius:7px;
    }

    .top-button{
        width:38px;
        height:38px;
    }

    .side-controls{
        right:10px;
        bottom:105px;
        gap:11px;
    }

    .side-button{
        width:47px;
        height:47px;
        font-size:20px;
    }

    .short-info{
        left:15px;
        right:68px;
        bottom:25px;
    }

    .creator{
        font-size:15px;
    }

    .description{
        font-size:13px;
    }

    .youtube-frame{
        width:100vw;
        height:100vh;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

    <div class="brand">
        <div class="brand-icon"></div>
        <span>ShortsFlow</span>
    </div>

    <div class="top-actions">
        <button
            class="top-button"
            id="settingsButton"
            title="Settings">
            ⚙
        </button>
    </div>

</header>

<main class="feed" id="feed"></main>

<div class="scroll-hint" id="scrollHint">
    Scroll to watch the next Short
</div>

</div>

<!-- SETTINGS -->

<div class="settings-overlay" id="settingsOverlay">

    <div class="settings">

        <div class="settings-header">
            <h2>Settings</h2>

            <button
                class="close-settings"
                id="closeSettings">
                ×
            </button>
        </div>

        <div class="setting-row">

            <div class="setting-label">
                <strong>Autoplay</strong>
                <small>Automatically play the active video</small>
            </div>

            <button
                class="switch active"
                id="autoplaySwitch">
            </button>

        </div>

        <div class="setting-row">

            <div class="setting-label">
                <strong>Mute videos</strong>
                <small>Start Shorts muted</small>
            </div>

            <button
                class="switch active"
                id="muteSwitch">
            </button>

        </div>

        <div class="setting-row">

            <div class="setting-label">
                <strong>Reset feed</strong>
                <small>Return to the original feed</small>
            </div>

            <button
                class="switch"
                id="resetButton">
                ↻
            </button>

        </div>

    </div>

</div>

<script>

/* =========================================================
   STARTER FEED

   Existing categories + Minecraft + DrDonut + Nathan Doan.
========================================================= */

const STARTER_VIDEOS = [

    /* TECHNOLOGY */

    {
        id:"M7lc1UVf-VE",
        creator:"Technology",
        description:"Technology and programming",
        category:"Technology"
    },

    /* SCIENCE */

    {
        id:"ScMzIvxBSi4",
        creator:"Science",
        description:"Interesting science content",
        category:"Science"
    },

    /* MUSIC */

    {
        id:"ysz5S6PUM-U",
        creator:"Music",
        description:"Music and entertainment",
        category:"Music"
    },

    /* CARS */

    {
        id:"aqz-KE-bpKQ",
        creator:"Cars",
        description:"Cars and automotive content",
        category:"Cars"
    },

    /* ANIMALS */

    {
        id:"jNQXAC9IVRw",
        creator:"Animals",
        description:"Interesting animal content",
        category:"Animals"
    },

    /* COMEDY */

    {
        id:"9bZkp7q19f0",
        creator:"Comedy",
        description:"Comedy and entertainment",
        category:"Comedy"
    },

    /* SPORTS */

    {
        id:"kJQP7kiw5Fk",
        creator:"Sports",
        description:"Sports content",
        category:"Sports"
    },

    /* ENGINEERING */

    {
        id:"hTWKbfoikeg",
        creator:"Engineering",
        description:"Engineering and technology",
        category:"Engineering"
    },

    /* SPACE */

    {
        id:"3JZ_D3ELwOQ",
        creator:"Space",
        description:"Space and science",
        category:"Space"
    },

    /* =====================================================
       MINECRAFT
    ===================================================== */

    {
        id:"Zfm9GKNvho4",
        creator:"DrDonut Shorts",
        description:"DRDONUT KNEW INSTANTLY",
        category:"Minecraft"
    },

    {
        id:"lusp2jjVVPY",
        creator:"DrDHeadlights",
        description:"DrDonut tries a new way to find bases in DonutSMP",
        category:"Minecraft"
    },

    /*
       Minecraft-themed extra entries.
       These can be replaced with any specific Shorts
       you want later simply by changing the IDs.
    */

    {
        id:"QH2-TGUlwu4",
        creator:"Minecraft",
        description:"Minecraft gameplay",
        category:"Minecraft"
    },

    /* =====================================================
       NATHAN DOAN COMEDY

       The supplied channel is:
       youtube.com/@nathandoancomedy/shorts

       Because a channel Shorts URL doesn't identify one
       particular video, the entry below links the feed to
       the creator's Shorts page when opened.
    ===================================================== */

    {
        id:"nathan-channel",
        creator:"Nathan Doan Comedy",
        description:"Nathan Doan Comedy Shorts",
        category:"Comedy",
        channelURL:"https://www.youtube.com/@nathandoancomedy/shorts"
    },

    /* MORE MUSIC */

    {
        id:"dQw4w9WgXcQ",
        creator:"Music",
        description:"Music video",
        category:"Music"
    },

    /* MORE COMEDY */

    {
        id:"fJ9rUzIMcZQ",
        creator:"Entertainment",
        description:"Entertainment and comedy",
        category:"Comedy"
    }

];

/* =========================================================
   EXTRA VIDEOS
========================================================= */

const MORE_VIDEOS = [

    {
        id:"60ItHLz5WEA",
        creator:"Music",
        description:"Music and entertainment",
        category:"Music"
    },

    {
        id:"Zi_XLOBDo_Y",
        creator:"Music",
        description:"Music video",
        category:"Music"
    },

    {
        id:"OPf0YbXqDm0",
        creator:"Music",
        description:"Music and entertainment",
        category:"Music"
    },

    {
        id:"CevxZvSJLk8",
        creator:"Music",
        description:"Music content",
        category:"Music"
    },

    {
        id:"YQHsXMglC9A",
        creator:"Music",
        description:"Music video",
        category:"Music"
    },

    {
        id:"M7lc1UVf-VE",
        creator:"Technology",
        description:"Technology content",
        category:"Technology"
    },

    {
        id:"ScMzIvxBSi4",
        creator:"Science",
        description:"Science content",
        category:"Science"
    },

    {
        id:"Zfm9GKNvho4",
        creator:"DrDonut Shorts",
        description:"More Minecraft Shorts",
        category:"Minecraft"
    }

];

/* =========================================================
   STATE
========================================================= */

let videos=[...STARTER_VIDEOS];

let activeIndex=0;

let autoplay=true;

let muted=true;

let moreIndex=0;

let loadedFrames=new Set();

let likedVideos=
    JSON.parse(
        localStorage.getItem(
            "shortsflow_likes_v3"
        ) || "[]"
    );

let observer=null;

/* =========================================================
   ELEMENTS
========================================================= */

const feed=
    document.getElementById("feed");

const settingsOverlay=
    document.getElementById("settingsOverlay");

const settingsButton=
    document.getElementById("settingsButton");

const closeSettings=
    document.getElementById("closeSettings");

const autoplaySwitch=
    document.getElementById("autoplaySwitch");

const muteSwitch=
    document.getElementById("muteSwitch");

const resetButton=
    document.getElementById("resetButton");

const scrollHint=
    document.getElementById("scrollHint");

/* =========================================================
   YOUTUBE URL
========================================================= */

function youtubeURL(videoId){

    const params=new URLSearchParams({

        autoplay:autoplay ? "1":"0",

        mute:muted ? "1":"0",

        playsinline:"1",

        rel:"0",

        modestbranding:"1",

        controls:"1",

        enablejsapi:"1"

    });

    return(
        "https://www.youtube.com/embed/" +
        videoId +
        "?" +
        params.toString()
    );
}

/* =========================================================
   BUILD FEED
========================================================= */

function renderFeed(){

    feed.innerHTML="";

    videos.forEach(
        (video,index)=>{
            appendShort(index);
        }
    );

    setupObserver();

    requestAnimationFrame(
        ()=>{
            loadVideoAround(0);

            setTimeout(
                ()=>{
                    loadVideoAround(1);
                },
                300
            );
        }
    );
}

/* =========================================================
   APPEND SHORT
========================================================= */

function appendShort(index){

    const video=videos[index];

    const short=
        document.createElement("article");

    short.className="short";

    short.dataset.index=index;

    const liked=
        likedVideos.includes(video.id);

    const isChannel=
        video.channelURL;

    short.innerHTML=`

        <div class="video-container">

            <div class="loading">

                <div class="loader"></div>

            </div>

            <div class="video-slot"></div>

        </div>

        <div class="side-controls">

            <button
                class="side-button like-button
                ${liked ? "liked":""}"
                data-action="like">

                ${liked ? "♥":"♡"}

            </button>

            <button
                class="side-button"
                data-action="share">

                ↗

            </button>

            <button
                class="side-button"
                data-action="open">

                ▶

            </button>

        </div>

        <div class="short-info">

            <div class="creator">

                @${escapeHTML(video.creator)}

            </div>

            <div class="description">

                ${escapeHTML(video.description)}

            </div>

            <div class="category">

                #${escapeHTML(video.category)}

            </div>

        </div>

        <button class="center-play">

            ▶

        </button>

    `;

    feed.appendChild(short);

}

/* =========================================================
   LOAD VIDEO
========================================================= */

function loadVideo(index){

    if(
        index<0 ||
        index>=videos.length
    ){
        return;
    }

    if(
        loadedFrames.has(index)
    ){
        return;
    }

    const short=
        feed.querySelector(
            `.short[data-index="${index}"]`
        );

    if(!short){
        return;
    }

    const video=
        videos[index];

    /*
       Nathan Doan is represented by the channel itself,
       so clicking Open goes to the actual Shorts channel.
    */

    if(video.channelURL){

        const loading=
            short.querySelector(".loading");

        if(loading){
            loading.classList.add("hidden");
        }

        const slot=
            short.querySelector(".video-slot");

        const card=
            document.createElement("div");

        card.style.position="absolute";
        card.style.inset="0";
        card.style.display="flex";
        card.style.alignItems="center";
        card.style.justifyContent="center";
        card.style.flexDirection="column";
        card.style.gap="20px";
        card.style.background=
            "radial-gradient(circle,#252525,#050505 70%)";

        card.innerHTML=`

            <div style="
                width:90px;
                height:90px;
                border-radius:50%;
                background:#ff0033;
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:40px;
            ">
                ▶
            </div>

            <div style="
                font-size:24px;
                font-weight:800;
            ">
                Nathan Doan Comedy
            </div>

            <button
                class="open-channel"
                style="
                    border:0;
                    padding:14px 22px;
                    border-radius:999px;
                    background:#fff;
                    color:#111;
                    font-weight:800;
                    cursor:pointer;
                "
            >
                Open Shorts
            </button>

        `;

        card
            .querySelector(".open-channel")
            .addEventListener(
                "click",
                ()=>{
                    window.open(
                        video.channelURL,
                        "_blank",
                        "noopener,noreferrer"
                    );
                }
            );

        slot.appendChild(card);

        loadedFrames.add(index);

        return;
    }

    const slot=
        short.querySelector(".video-slot");

    if(!slot){
        return;
    }

    const iframe=
        document.createElement("iframe");

    iframe.className=
        "youtube-frame";

    iframe.src=
        youtubeURL(video.id);

    iframe.allow=
        "autoplay; encrypted-media; picture-in-picture; fullscreen";

    iframe.allowFullscreen=true;

    iframe.setAttribute(
        "frameborder",
        "0"
    );

    iframe.setAttribute(
        "title",
        `YouTube Short ${index+1}`
    );

    iframe.onload=()=>{

        const loading=
            short.querySelector(".loading");

        if(loading){
            loading.classList.add("hidden");
        }

    };

    slot.appendChild(iframe);

    loadedFrames.add(index);

}

/* =========================================================
   LOAD NEARBY
========================================================= */

function loadVideoAround(index){

    loadVideo(index);

    loadVideo(index-1);

    loadVideo(index+1);

    loadVideo(index+2);

}

/* =========================================================
   OBSERVER
========================================================= */

function setupObserver(){

    if(observer){
        observer.disconnect();
    }

    observer=
        new IntersectionObserver(
            entries=>{

                entries.forEach(
                    entry=>{

                        if(
                            entry.isIntersecting &&
                            entry.intersectionRatio>=.65
                        ){

                            const index=
                                Number(
                                    entry.target.dataset.index
                                );

                            activeIndex=index;

                            loadVideoAround(index);

                            if(
                                index>=videos.length-3
                            ){
                                addMoreVideos();
                            }

                            if(index>0){
                                scrollHint.classList.add(
                                    "hidden"
                                );
                            }

                        }

                    }
                );

            },
            {
                root:feed,
                threshold:[.65]
            }
        );

    document
        .querySelectorAll(".short")
        .forEach(
            short=>{
                observer.observe(short);
            }
        );

}

/* =========================================================
   ADD MORE
========================================================= */

function addMoreVideos(){

    if(
        moreIndex>=MORE_VIDEOS.length
    ){
        return;
    }

    for(
        let i=0;
        i<2 &&
        moreIndex<MORE_VIDEOS.length;
        i++
    ){

        videos.push(
            MORE_VIDEOS[moreIndex]
        );

        moreIndex++;

        appendShort(
            videos.length-1
        );

    }

    setupObserver();

    loadVideoAround(activeIndex);

}

/* =========================================================
   ACTION BUTTONS
========================================================= */

feed.addEventListener(
    "click",
    event=>{

        const button=
            event.target.closest(
                "[data-action]"
            );

        if(!button){
            return;
        }

        const short=
            button.closest(".short");

        if(!short){
            return;
        }

        const index=
            Number(short.dataset.index);

        const video=
            videos[index];

        const action=
            button.dataset.action;

        if(action==="like"){
            toggleLike(
                video.id,
                button
            );
        }

        if(action==="share"){
            shareVideo(video);
        }

        if(action==="open"){
            openVideo(video);
        }

    }
);

/* =========================================================
   LIKE
========================================================= */

function toggleLike(id,button){

    if(
        likedVideos.includes(id)
    ){

        likedVideos=
            likedVideos.filter(
                item=>item!==id
            );

        button.classList.remove(
            "liked"
        );

        button.textContent="♡";

    }else{

        likedVideos.push(id);

        button.classList.add(
            "liked"
        );

        button.textContent="♥";

    }

    localStorage.setItem(
        "shortsflow_likes_v3",
        JSON.stringify(likedVideos)
    );

}

/* =========================================================
   SHARE
========================================================= */

async function shareVideo(video){

    const url=
        video.channelURL ||
        `https://www.youtube.com/watch?v=${video.id}`;

    if(navigator.share){

        try{

            await navigator.share({

                title:
                    video.creator,

                text:
                    video.description,

                url:url

            });

        }catch(error){}

    }else{

        try{

            await navigator.clipboard.writeText(
                url
            );

            alert(
                "Link copied!"
            );

        }catch{

            prompt(
                "Copy this link:",
                url
            );

        }

    }

}

/* =========================================================
   OPEN
========================================================= */

function openVideo(video){

    const url=
        video.channelURL ||
        `https://www.youtube.com/watch?v=${video.id}`;

    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );

}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            settingsOverlay.classList.contains(
                "show"
            )
        ){
            return;
        }

        if(
            event.key==="ArrowDown"
        ){

            event.preventDefault();

            goToShort(
                activeIndex+1
            );

        }

        if(
            event.key==="ArrowUp"
        ){

            event.preventDefault();

            goToShort(
                activeIndex-1
            );

        }

    }
);

function goToShort(index){

    if(
        index<0 ||
        index>=videos.length
    ){
        return;
    }

    const short=
        feed.querySelector(
            `.short[data-index="${index}"]`
        );

    if(!short){
        return;
    }

    short.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

}

/* =========================================================
   SETTINGS
========================================================= */

settingsButton.addEventListener(
    "click",
    ()=>{
        settingsOverlay.classList.add(
            "show"
        );
    }
);

closeSettings.addEventListener(
    "click",
    ()=>{
        settingsOverlay.classList.remove(
            "show"
        );
    }
);

settingsOverlay.addEventListener(
    "click",
    event=>{

        if(
            event.target===
            settingsOverlay
        ){

            settingsOverlay.classList.remove(
                "show"
            );

        }

    }
);

autoplaySwitch.addEventListener(
    "click",
    ()=>{

        autoplay=!autoplay;

        autoplaySwitch.classList.toggle(
            "active",
            autoplay
        );

    }
);

muteSwitch.addEventListener(
    "click",
    ()=>{

        muted=!muted;

        muteSwitch.classList.toggle(
            "active",
            muted
        );

    }
);

resetButton.addEventListener(
    "click",
    ()=>{

        videos=[
            ...STARTER_VIDEOS
        ];

        moreIndex=0;

        loadedFrames.clear();

        activeIndex=0;

        renderFeed();

        feed.scrollTo({
            top:0,
            behavior:"instant"
        });

        settingsOverlay.classList.remove(
            "show"
        );

    }
);

/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Escape"
        ){

            settingsOverlay.classList.remove(
                "show"
            );

        }

    }
);

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

/* =========================================================
   START
========================================================= */

renderFeed();
