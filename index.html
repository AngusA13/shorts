<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Shorts</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:white;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,input{
    font:inherit;
}

button{
    border:0;
    color:inherit;
    cursor:pointer;
}

.app{
    width:100%;
    height:100dvh;
    position:relative;
    overflow:hidden;
    background:#050505;
}

/* TOP BAR */

.topbar{
    position:fixed;
    z-index:1000;
    top:0;
    left:0;
    right:0;
    height:70px;
    padding:10px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    pointer-events:none;
}

.topbar>*{
    pointer-events:auto;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:850;
    text-shadow:0 2px 15px #000;
}

.brandIcon{
    width:36px;
    height:36px;
    border-radius:11px;
    background:white;
    color:#111;
    display:grid;
    place-items:center;
    font-size:15px;
    box-shadow:0 7px 25px rgba(0,0,0,.4);
}

.topButtons{
    display:flex;
    gap:8px;
}

.topButton{
    width:42px;
    height:42px;
    border-radius:50%;
    background:rgba(25,25,25,.72);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    display:grid;
    place-items:center;
    font-size:18px;
    transition:.2s;
}

.topButton:hover{
    background:rgba(65,65,65,.85);
    transform:translateY(-1px);
}

.topButton:active{
    transform:scale(.9);
}

/* FEED */

.feed{
    width:100%;
    height:100%;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
    scrollbar-width:none;
    overscroll-behavior-y:contain;
}

.feed::-webkit-scrollbar{
    display:none;
}

.short{
    width:100%;
    height:100dvh;
    min-height:100dvh;
    position:relative;
    overflow:hidden;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    background:#080808;
}

.shortOverlay{
    position:absolute;
    inset:0;
    z-index:10;
    pointer-events:none;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.5),
            transparent 25%,
            transparent 58%,
            rgba(0,0,0,.9)
        );
}

/* PLAYER */

.playerArea{
    position:absolute;
    inset:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.player{
    position:absolute;
    width:100vw;
    height:56.25vw;
    min-width:177.78vh;
    min-height:100vh;
    border:0;
}

/* LOADING */

.loading{
    position:absolute;
    z-index:50;
    inset:0;
    display:grid;
    place-items:center;
    pointer-events:none;
    transition:.3s;
}

.loading.hidden{
    opacity:0;
}

.spinner{
    width:42px;
    height:42px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.15);
    border-top-color:white;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* ERROR */

.playerError{
    position:absolute;
    z-index:45;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    padding:30px;
    text-align:center;
}

.playerError.show{
    display:flex;
}

.playerErrorIcon{
    width:65px;
    height:65px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    display:grid;
    place-items:center;
    font-size:28px;
}

.playerErrorTitle{
    font-size:20px;
    font-weight:800;
}

.playerErrorText{
    max-width:400px;
    opacity:.65;
    font-size:13px;
    line-height:1.5;
}

/* INFORMATION */

.videoInfo{
    position:absolute;
    z-index:30;
    left:20px;
    right:90px;
    bottom:28px;
    text-shadow:0 2px 8px #000;
}

.channelRow{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    display:grid;
    place-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#ff0050,#7b2cff,#00d4ff);
    border:2px solid rgba(255,255,255,.9);
    font-weight:900;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.channel{
    font-weight:800;
    font-size:15px;
}

.title{
    font-size:20px;
    line-height:1.2;
    font-weight:850;
    margin-bottom:7px;
}

.description{
    font-size:14px;
    line-height:1.4;
    max-width:650px;
    opacity:.9;
}

.category{
    display:inline-flex;
    margin-top:9px;
    padding:5px 9px;
    border-radius:999px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(10px);
    font-size:11px;
    font-weight:750;
}

/* ACTIONS */

.actions{
    position:absolute;
    z-index:40;
    right:15px;
    bottom:28px;
    width:58px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
}

.action{
    width:54px;
    min-height:60px;
    background:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    text-shadow:0 2px 8px #000;
}

.actionIcon{
    width:48px;
    height:48px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:rgba(20,20,20,.65);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(14px);
    transition:.2s;
    font-size:22px;
}

.action:hover .actionIcon{
    transform:scale(1.08);
}

.action:active .actionIcon{
    transform:scale(.88);
}

.action.liked .actionIcon{
    color:#ff315e;
    background:rgba(255,0,70,.18);
}

.actionLabel{
    font-size:10px;
    font-weight:750;
}

/* PROGRESS */

.progress{
    position:absolute;
    z-index:100;
    bottom:0;
    left:0;
    right:0;
    height:3px;
    background:rgba(255,255,255,.15);
}

.progressBar{
    height:100%;
    width:0;
    background:white;
}

/* MODALS */

.modalLayer{
    position:fixed;
    z-index:5000;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(0,0,0,.68);
    backdrop-filter:blur(16px);
}

.modalLayer.open{
    display:flex;
}

.modal{
    width:min(600px,100%);
    max-height:90dvh;
    overflow-y:auto;
    padding:24px;
    border-radius:25px;
    background:linear-gradient(145deg,rgba(35,35,38,.98),rgba(15,15,17,.98));
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 30px 100px rgba(0,0,0,.65);
    animation:modalIn .2s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(12px) scale(.97);
    }

    to{
        opacity:1;
        transform:none;
    }
}

.modalHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.modalTitle{
    font-size:23px;
    font-weight:900;
}

.close{
    width:38px;
    height:38px;
    border-radius:50%;
    background:rgba(255,255,255,.09);
    display:grid;
    place-items:center;
    font-size:18px;
}

.help{
    font-size:13px;
    line-height:1.5;
    opacity:.65;
    margin-bottom:16px;
}

.label{
    font-size:12px;
    opacity:.65;
    margin:17px 0 8px;
}

.input{
    width:100%;
    padding:14px;
    border-radius:13px;
    outline:none;
    color:white;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
}

.input:focus{
    border-color:rgba(255,255,255,.4);
}

.primary{
    width:100%;
    padding:14px;
    margin-top:13px;
    border-radius:13px;
    background:white;
    color:#111;
    font-weight:850;
}

.secondary{
    width:100%;
    padding:13px;
    margin-top:9px;
    border-radius:13px;
    background:rgba(255,255,255,.08);
    font-weight:750;
}

/* INTERESTS */

.interests{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.interest{
    padding:7px 10px;
    border-radius:999px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.08);
    font-size:12px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.stat{
    padding:14px;
    border-radius:15px;
    background:rgba(255,255,255,.06);
}

.statValue{
    font-size:22px;
    font-weight:900;
}

.statLabel{
    font-size:11px;
    opacity:.55;
}

/* TOAST */

.toast{
    position:fixed;
    z-index:9000;
    left:50%;
    bottom:25px;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    padding:12px 17px;
    border-radius:999px;
    background:rgba(25,25,25,.95);
    border:1px solid rgba(255,255,255,.1);
    font-size:13px;
    font-weight:750;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

@media(min-width:800px){

    .feed{
        width:min(900px,100%);
        margin:auto;
        box-shadow:0 0 100px rgba(0,0,0,.55);
    }

    .topbar{
        width:min(900px,100%);
        left:50%;
        right:auto;
        transform:translateX(-50%);
    }
}

@media(max-width:600px){

    .topbar{
        padding:8px 11px;
    }

    .brand{
        font-size:18px;
    }

    .videoInfo{
        left:13px;
        right:72px;
        bottom:20px;
    }

    .actions{
        right:7px;
        bottom:20px;
    }

    .title{
        font-size:17px;
    }

    .description{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

    <div class="brand">
        <div class="brandIcon">▶</div>
        <span>Shorts</span>
    </div>

    <div class="topButtons">

        <button
            class="topButton"
            id="refreshButton"
            title="Find more"
        >
            ↻
        </button>

        <button
            class="topButton"
            id="settingsButton"
            title="Settings"
        >
            ⚙
        </button>

    </div>

</header>

<main
    class="feed"
    id="feed"
></main>

</div>

<!-- SETTINGS -->

<div
    class="modalLayer"
    id="settingsModal"
>

<div class="modal">

<div class="modalHeader">

    <div class="modalTitle">
        Shorts Settings
    </div>

    <button
        class="close"
        data-close="settingsModal"
    >
        ×
    </button>

</div>

<div class="help">

    Add a YouTube Data API v3 key to let
    the app search YouTube for more videos
    based on what you watch.

</div>

<div class="label">
    YouTube Data API key
</div>

<input
    id="apiKeyInput"
    class="input"
    type="password"
    placeholder="AIza..."
>

<button
    class="primary"
    id="saveApiKey"
>
    Save API Key
</button>

<div class="label">
    What the feed has learned
</div>

<div
    class="interests"
    id="interests"
></div>

<div class="label">
    Statistics
</div>

<div
    class="stats"
    id="stats"
></div>

<button
    class="secondary"
    id="resetButton"
>
    Reset Recommendation Data
</button>

<button
    class="secondary"
    data-close="settingsModal"
>
    Done
</button>

</div>

</div>

<div
    class="toast"
    id="toast"
></div>

<!-- YOUTUBE API -->

<script src="https://www.youtube.com/iframe_api"></script>

<script>

/* =========================================================
   CATEGORIES
========================================================= */

const categories = {

    gaming:{
        name:"🎮 Gaming",
        searches:[
            "gaming shorts",
            "gaming clips",
            "funny gaming",
            "gaming moments"
        ]
    },

    tech:{
        name:"💻 Technology",
        searches:[
            "technology shorts",
            "cool technology",
            "tech gadgets",
            "computer technology"
        ]
    },

    engineering:{
        name:"⚙️ Engineering",
        searches:[
            "engineering shorts",
            "engineering projects",
            "mechanical engineering",
            "engineering inventions"
        ]
    },

    cars:{
        name:"🚗 Cars",
        searches:[
            "car shorts",
            "car builds",
            "car modifications",
            "car facts"
        ]
    },

    science:{
        name:"🔬 Science",
        searches:[
            "science shorts",
            "science facts",
            "science experiments",
            "cool science"
        ]
    },

    animals:{
        name:"🐶 Animals",
        searches:[
            "animal shorts",
            "funny animals",
            "animal facts",
            "cute animals"
        ]
    },

    comedy:{
        name:"😂 Comedy",
        searches:[
            "comedy shorts",
            "funny shorts",
            "funny clips",
            "comedy sketches"
        ]
    },

    sports:{
        name:"🏀 Sports",
        searches:[
            "sports shorts",
            "sports highlights",
            "football shorts",
            "basketball shorts"
        ]
    },

    food:{
        name:"🍔 Food",
        searches:[
            "food shorts",
            "cooking shorts",
            "food hacks",
            "easy recipes"
        ]
    },

    diy:{
        name:"🔨 DIY",
        searches:[
            "DIY shorts",
            "DIY projects",
            "maker projects",
            "building projects"
        ]
    },

    space:{
        name:"🚀 Space",
        searches:[
            "space shorts",
            "NASA shorts",
            "astronomy shorts",
            "space facts"
        ]
    },

    music:{
        name:"🎵 Music",
        searches:[
            "music shorts",
            "music clips",
            "instrument shorts",
            "music performances"
        ]
    }

};

/* =========================================================
   STARTING VIDEOS
========================================================= */

/*
   These are only starter videos so the page
   isn't empty before you add your API key.
*/

let videos = [

    {
        id:"M7lc1UVf-VE",
        category:"tech",
        title:"YouTube Player API",
        description:"Technology starter video",
        channel:"YouTube"
    },

    {
        id:"dQw4w9WgXcQ",
        category:"music",
        title:"Music starter video",
        description:"Music starter video",
        channel:"YouTube"
    }

];

/* =========================================================
   LOAD SAVED DATA
========================================================= */

const savedVideos =
    JSON.parse(
        localStorage.getItem(
            "shortsVideos"
        ) || "[]"
    );

if(savedVideos.length){

    const existing =
        new Set(
            videos.map(v=>v.id)
        );

    savedVideos.forEach(video=>{

        if(!existing.has(video.id)){
            videos.push(video);
        }

    });

}

let interests =
    JSON.parse(
        localStorage.getItem(
            "shortsInterests"
        ) || "{}"
    );

let watchHistory =
    JSON.parse(
        localStorage.getItem(
            "shortsHistory"
        ) || "{}"
    );

let liked =
    JSON.parse(
        localStorage.getItem(
            "shortsLiked"
        ) || "{}"
    );

let apiKey =
    localStorage.getItem(
        "youtubeApiKey"
    ) || "";

Object.keys(categories).forEach(category=>{

    if(
        typeof interests[category] !==
        "number"
    ){
        interests[category]=1;
    }

});

/* =========================================================
   STATE
========================================================= */

let players={};

let activeIndex=0;

let youtubeReady=false;

let loadingMore=false;

let muted=true;

let watchStarted={};

let watchIntervals={};

/* =========================================================
   SAVE
========================================================= */

function save(){

    localStorage.setItem(
        "shortsVideos",
        JSON.stringify(videos)
    );

    localStorage.setItem(
        "shortsInterests",
        JSON.stringify(interests)
    );

    localStorage.setItem(
        "shortsHistory",
        JSON.stringify(watchHistory)
    );

    localStorage.setItem(
        "shortsLiked",
        JSON.stringify(liked)
    );

}

/* =========================================================
   ESCAPE
========================================================= */

function esc(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* =========================================================
   TOAST
========================================================= */

function toast(message){

    const element =
        document.getElementById(
            "toast"
        );

    element.textContent=message;

    element.classList.add(
        "show"
    );

    clearTimeout(
        toast.timer
    );

    toast.timer=setTimeout(()=>{

        element.classList.remove(
            "show"
        );

    },2400);

}

/* =========================================================
   RENDER
========================================================= */

function render(){

    const feed =
        document.getElementById(
            "feed"
        );

    /*
       Destroy old YouTube players
       before rebuilding the DOM.
    */

    Object.values(players).forEach(player=>{

        try{
            player.destroy();
        }catch(e){}

    });

    players={};

    feed.innerHTML="";

    videos.forEach((video,index)=>{

        const category =
            video.category ||
            "tech";

        const likedState =
            !!liked[video.id];

        const section =
            document.createElement(
                "section"
            );

        section.className="short";

        section.dataset.index=index;

        section.innerHTML=`

            <div class="playerArea">

                <div
                    class="player"
                    id="player-${index}"
                ></div>

            </div>

            <div
                class="loading"
                id="loading-${index}"
            >
                <div class="spinner"></div>
            </div>

            <div
                class="playerError"
                id="error-${index}"
            >

                <div class="playerErrorIcon">
                    ▶
                </div>

                <div class="playerErrorTitle">
                    Video couldn't be loaded
                </div>

                <div class="playerErrorText">
                    This video may not allow
                    embedding. Swipe to continue.
                </div>

            </div>

            <div class="shortOverlay"></div>

            <div class="videoInfo">

                <div class="channelRow">

                    <div class="avatar">

                        ${
                            video.thumbnail
                            ?
                            `<img
                                src="${esc(video.thumbnail)}"
                                alt=""
                            >`
                            :
                            esc(
                                (
                                    video.channel ||
                                    "Y"
                                ).charAt(0)
                            )
                        }

                    </div>

                    <div class="channel">
                        @${esc(
                            video.channel ||
                            "YouTube"
                        )}
                    </div>

                </div>

                <div class="title">
                    ${esc(
                        video.title ||
                        "YouTube Short"
                    )}
                </div>

                <div class="description">
                    ${esc(
                        video.description ||
                        ""
                    )}
                </div>

                <div class="category">

                    ${
                        categories[
                            category
                        ]?.name ||
                        "🎬 Video"
                    }

                </div>

            </div>

            <div class="actions">

                <button
                    class="
                        action
                        ${likedState?"liked":""}
                    "
                    onclick="
                        likeVideo(${index})
                    "
                >

                    <div class="actionIcon">
                        ${
                            likedState
                            ?"♥"
                            :"♡"
                        }
                    </div>

                    <div class="actionLabel">
                        ${
                            likedState
                            ?"Liked"
                            :"Like"
                        }
                    </div>

                </button>

                <button
                    class="action"
                    onclick="
                        shareVideo(${index})
                    "
                >

                    <div class="actionIcon">
                        ↗
                    </div>

                    <div class="actionLabel">
                        Share
                    </div>

                </button>

                <button
                    class="action"
                    onclick="
                        muteToggle()
                    "
                >

                    <div class="actionIcon">
                        🔊
                    </div>

                    <div class="actionLabel">
                        Sound
                    </div>

                </button>

                <button
                    class="action"
                    onclick="
                        openYouTube(${index})
                    "
                >

                    <div class="actionIcon">
                        ▶
                    </div>

                    <div class="actionLabel">
                        YouTube
                    </div>

                </button>

            </div>

            <div class="progress">

                <div
                    class="progressBar"
                    id="progress-${index}"
                ></div>

            </div>

        `;

        feed.appendChild(section);

    });

    observe();

    if(youtubeReady){

        setTimeout(
            createPlayers,
            150
        );

    }

}

/* =========================================================
   YOUTUBE READY
========================================================= */

window.onYouTubeIframeAPIReady=function(){

    youtubeReady=true;

    createPlayers();

};

/* =========================================================
   CREATE PLAYERS
========================================================= */

function createPlayers(){

    if(
        !youtubeReady ||
        !window.YT ||
        !YT.Player
    ){
        return;
    }

    videos.forEach((video,index)=>{

        if(players[index]){
            return;
        }

        const element =
            document.getElementById(
                "player-"+index
            );

        if(!element){
            return;
        }

        try{

            players[index]=
                new YT.Player(
                    element,
                    {

                        videoId:
                            video.id,

                        playerVars:{
                            autoplay:0,
                            controls:1,
                            playsinline:1,
                            rel:0,
                            modestbranding:1
                        },

                        events:{

                            onReady:event=>{

                                try{

                                    event.target.mute();

                                    if(
                                        index===
                                        activeIndex
                                    ){

                                        event.target
                                            .playVideo();

                                    }

                                }catch(e){}

                            },

                            onStateChange:event=>{

                                if(
                                    event.data===
                                    YT.PlayerState.PLAYING
                                ){

                                    const loading =
                                        document.getElementById(
                                            "loading-"+index
                                        );

                                    if(loading){
                                        loading.classList
                                            .add(
                                                "hidden"
                                            );
                                    }

                                    startWatch(index);

                                }

                                if(
                                    event.data===
                                    YT.PlayerState.PAUSED
                                ){

                                    stopWatch(index);

                                }

                                if(
                                    event.data===
                                    YT.PlayerState.ENDED
                                ){

                                    stopWatch(index);

                                    goTo(
                                        index+1
                                    );

                                }

                            },

                            onError:event=>{

                                console.log(
                                    "YouTube error",
                                    event.data,
                                    video.id
                                );

                                const loading =
                                    document.getElementById(
                                        "loading-"+index
                                    );

                                if(loading){
                                    loading.classList
                                        .add(
                                            "hidden"
                                        );
                                }

                                const error =
                                    document.getElementById(
                                        "error-"+index
                                    );

                                if(error){
                                    error.classList
                                        .add(
                                            "show"
                                        );
                                }

                            }

                        }

                    }
                );

        }catch(error){

            console.error(
                "Could not create player:",
                error
            );

        }

    });

}

/* =========================================================
   OBSERVE
========================================================= */

function observe(){

    const sections =
        document.querySelectorAll(
            ".short"
        );

    const observer =
        new IntersectionObserver(
            entries=>{

                entries.forEach(entry=>{

                    if(
                        entry.isIntersecting &&
                        entry.intersectionRatio>.65
                    ){

                        activate(
                            Number(
                                entry.target
                                    .dataset
                                    .index
                            )
                        );

                    }

                });

            },
            {
                threshold:[.65]
            }
        );

    sections.forEach(section=>{
        observer.observe(section);
    });

}

/* =========================================================
   ACTIVATE
========================================================= */

function activate(index){

    if(
        index<0 ||
        index>=videos.length
    ){
        return;
    }

    if(index!==activeIndex){

        stopWatch(
            activeIndex
        );

    }

    activeIndex=index;

    Object.keys(players).forEach(key=>{

        const player=
            players[key];

        if(
            !player ||
            typeof player.playVideo!=="function"
        ){
            return;
        }

        try{

            if(
                Number(key)===
                index
            ){

                player.mute();
                player.playVideo();

            }else{

                player.pauseVideo();

            }

        }catch(e){}

    });

    /*
       When only a few videos remain,
       automatically search for more.
    */

    if(
        videos.length-index<=3
    ){

        loadMore();

    }

}

/* =========================================================
   GO TO
========================================================= */

function goTo(index){

    if(
        index<0 ||
        index>=videos.length
    ){
        return;
    }

    const target =
        document.querySelector(
            `.short[data-index="${index}"]`
        );

    if(target){

        target.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    }

}

/* =========================================================
   WATCH TRACKING
========================================================= */

function startWatch(index){

    stopWatch(index);

    const video=
        videos[index];

    if(!video){
        return;
    }

    watchStarted[index]=Date.now();

    watchIntervals[index]=
        setInterval(()=>{

            addWatchTime(
                index,
                1
            );

        },1000);

}

function stopWatch(index){

    if(
        watchIntervals[index]
    ){

        clearInterval(
            watchIntervals[index]
        );

        delete watchIntervals[index];

    }

    if(
        watchStarted[index]
    ){

        const seconds=
            Math.floor(
                (
                    Date.now()-
                    watchStarted[index]
                )/1000
            );

        if(seconds>0){

            addWatchTime(
                index,
                seconds
            );

        }

        delete watchStarted[index];

    }

}

function addWatchTime(
    index,
    seconds
){

    const video=
        videos[index];

    if(!video){
        return;
    }

    const category=
        video.category ||
        "tech";

    if(
        !watchHistory[
            video.id
        ]
    ){

        watchHistory[
            video.id
        ]={
            seconds:0,
            category
        };

    }

    watchHistory[
        video.id
    ].seconds+=seconds;

    /*
       Longer watching gives
       a stronger interest signal.
    */

    let gain=.03;

    if(seconds>5){
        gain=.08;
    }

    if(seconds>15){
        gain=.15;
    }

    interests[
        category
    ]=
        (
            interests[
                category
            ]||1
        )+gain;

    save();

}

/* =========================================================
   LIKE
========================================================= */

function likeVideo(index){

    const video=
        videos[index];

    if(!video){
        return;
    }

    if(liked[video.id]){

        delete liked[video.id];

        interests[
            video.category
        ]=
            Math.max(
                1,
                (
                    interests[
                        video.category
                    ]||1
                )-2
            );

    }else{

        liked[video.id]=true;

        interests[
            video.category
        ]=
            (
                interests[
                    video.category
                ]||1
            )+3;

        toast(
            "We'll show you more like this"
        );

    }

    save();

    render();

    setTimeout(()=>{
        goTo(index);
    },100);

}

/* =========================================================
   CHOOSE CATEGORY
========================================================= */

function chooseCategory(){

    const weighted=[];

    Object.keys(categories)
        .forEach(category=>{

            const score=
                Math.max(
                    1,
                    interests[
                        category
                    ]||1
                );

            const copies=
                Math.min(
                    12,
                    Math.ceil(
                        Math.sqrt(
                            score
                        )
                    )
                );

            for(
                let i=0;
                i<copies;
                i++
            ){

                weighted.push(
                    category
                );

            }

        });

    return weighted[
        Math.floor(
            Math.random()*
            weighted.length
        )
    ];

}

/* =========================================================
   SEARCH YOUTUBE
========================================================= */

async function youtubeSearch(
    query
){

    if(!apiKey){

        toast(
            "Add your YouTube API key in Settings"
        );

        return [];

    }

    const params=
        new URLSearchParams({

            part:"snippet",

            q:query,

            type:"video",

            maxResults:"10",

            order:"relevance",

            regionCode:"AU",

            relevanceLanguage:"en",

            videoEmbeddable:"true"

        });

    const url=
        "https://www.googleapis.com/youtube/v3/search?"+
        params.toString()+
        "&key="+
        encodeURIComponent(
            apiKey
        );

    try{

        const response=
            await fetch(url);

        const data=
            await response.json();

        if(!response.ok){

            console.error(
                "YouTube API:",
                data
            );

            toast(
                data.error?.message ||
                "YouTube API error"
            );

            return [];

        }

        return(
            data.items||[]
        )
        .filter(
            item=>
                item.id &&
                item.id.videoId
        )
        .map(
            item=>({

                id:
                    item.id.videoId,

                title:
                    item.snippet.title,

                description:
                    item.snippet.description,

                channel:
                    item.snippet.channelTitle,

                thumbnail:
                    item.snippet.thumbnails
                        ?.high
                        ?.url,

                category:
                    currentSearchCategory

            })
        );

    }catch(error){

        console.error(
            error
        );

        toast(
            "Couldn't connect to YouTube"
        );

        return [];

    }

}

/* =========================================================
   CURRENT SEARCH CATEGORY
========================================================= */

let currentSearchCategory=
    "tech";

/* =========================================================
   LOAD MORE
========================================================= */

async function loadMore(){

    if(loadingMore){
        return;
    }

    if(!apiKey){

        /*
           Don't repeatedly spam
           the user with this message.
        */

        return;

    }

    loadingMore=true;

    const selected=[];

    /*
       Get the user's strongest interests.
    */

    const sorted=
        Object.keys(
            interests
        ).sort(
            (a,b)=>
                interests[b]-
                interests[a]
        );

    /*
       Two learned categories.
    */

    sorted
        .slice(0,2)
        .forEach(category=>{
            selected.push(
                category
            );
        });

    /*
       One random category keeps
       discovery alive.
    */

    const random=
        chooseCategory();

    if(
        !selected.includes(
            random
        )
    ){

        selected.push(
            random
        );

    }

    const results=[];

    for(
        const category of
        selected
    ){

        const config=
            categories[
                category
            ];

        if(!config){
            continue;
        }

        const query=
            config.searches[
                Math.floor(
                    Math.random()*
                    config.searches.length
                )
            ];

        currentSearchCategory=
            category;

        const found=
            await youtubeSearch(
                query
            );

        found.forEach(video=>{

            video.category=
                category;

            results.push(
                video
            );

        });

    }

    /*
       Remove duplicates.
    */

    const existing=
        new Set(
            videos.map(
                video=>
                    video.id
            )
        );

    const fresh=
        results.filter(
            video=>
                !existing.has(
                    video.id
                )
        );

    /*
       Shuffle.
    */

    fresh.sort(
        ()=>Math.random()-.5
    );

    if(fresh.length){

        videos.push(
            ...fresh
        );

        save();

        const oldIndex=
            activeIndex;

        render();

        setTimeout(()=>{

            goTo(
                oldIndex
            );

        },200);

        toast(
            `Found ${fresh.length} more Shorts`
        );

    }

    loadingMore=false;

}

   REFRESH

document

/* =========================================================
   MUTE
========================================================= */

function muteToggle(){

    muted=!muted;

    Object.values(
        players
    ).forEach(player=>{

        try{

            if(muted){
                player.mute();
            }else{
                player.unMute();
            }

        }catch(e){}

    });

    toast(
        muted
        ?"Sound muted"
        :"Sound on"
    );

}

/* =========================================================
   SHARE
========================================================= */

async function shareVideo(index){

    const video=
        videos[index];

    const url=
        "https://www.youtube.com/watch?v="+
        video.id;

    if(navigator.share){

        try{

            await navigator.share({
                title:video.title,
                text:video.description,
                url
            });

            return;

        }catch(e){}

    }

    try{

        await navigator.clipboard.writeText(
            url
        );

        toast(
            "YouTube link copied"
        );

    }catch(e){

        window.prompt(
            "Copy this link:",
            url
        );

    }

}

/* =========================================================
   INTERESTS UI
========================================================= */

function renderInterests(){

    const element=
        document.getElementById(
            "interests"
        );

    const sorted=
        Object.keys(
            interests
        ).sort(
            (a,b)=>
                interests[b]-
                interests[a]
        );

    element.innerHTML=
        sorted.map(
            category=>`

                <div class="interest">

                    ${
                        categories[
                            category
                        ].name
                    }

                    ·
                    ${
                        interests[
                            category
                        ].toFixed(1)
                    }

                </div>

            `
        ).join("");

}

/* =========================================================
   STATS
========================================================= */

function renderStats(){

    const element=
        document.getElementById(
            "stats"
        );

    const watched=
        Object.keys(
            watchHistory
        ).length;

    const seconds=
        Object.values(
            watchHistory
        )
        .reduce(
            (total,item)=>
                total+
                (
                    item.seconds||0
                ),
            0
        );

    const strongest=
        Object.keys(
            interests
        ).sort(
            (a,b)=>
                interests[b]-
                interests[a]
        )[0];

    element.innerHTML=`

        <div class="stat">

            <div class="statValue">
                ${watched}
            </div>

            <div class="statLabel">
                Videos watched
            </div>

        </div>

        <div class="stat">

            <div class="statValue">
                ${Math.floor(
                    seconds/60
                )}m
            </div>

            <div class="statLabel">
                Watch time
            </div>

        </div>

        <div class="stat">

            <div class="statValue">
                ${
                    categories[
                        strongest
                    ]?.name||
                    "None"
                }
            </div>

            <div class="statLabel">
                Strongest interest
            </div>

        </div>

        <div class="stat">

            <div class="statValue">
                ${videos.length}
            </div>

            <div class="statLabel">
                Videos loaded
            </div>

        </div>

    `;

}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.target.tagName===
            "INPUT"
        ){
            return;
        }

        if(
            event.key===
            "ArrowDown"
        ){

            event.preventDefault();

            goTo(
                Math.min(
                    activeIndex+1,
                    videos.length-1
                )
            );

        }

        if(
            event.key===
            "ArrowUp"
        ){

            event.preventDefault();

            goTo(
                Math.max(
                    activeIndex-1,
                    0
                )
            );

        }

        if(
            event.key.toLowerCase()==="m"
        ){

            muteToggle();

        }

    }
);

/* =========================================================
   MOUSE WHEEL
========================================================= */

let wheelLocked=false;

document
    .getElementById(
        "feed"
    )
    .addEventListener(
        "wheel",
        event=>{

            if(
                wheelLocked||
                Math.abs(
                    event.deltaY
                )<20
            ){
                return;
            }

            wheelLocked=true;

            if(
                event.deltaY>0
            ){

                goTo(
                    Math.min(
                        activeIndex+1,
                        videos.length-1
                    )
                );

            }else{

                goTo(
                    Math.max(
                        activeIndex-1,
                        0
                    )
                );

            }

            setTimeout(
                ()=>{
                    wheelLocked=false;
                },
                650
            );

        },
        {
            passive:true
        }
    );

/* =========================================================
   TOUCH
========================================================= */

let touchStart=0;

document
    .getElementById(
        "feed"
    )
    .addEventListener(
        "touchstart",
        event=>{

            touchStart=
                event.changedTouches[0]
                    .clientY;

        },
        {
            passive:true
        }
    );

document
    .getElementById(
        "feed"
    )
    .addEventListener(
        "touchend",
        event=>{

            const touchEnd=
                event.changedTouches[0]
                    .clientY;

            const difference=
                touchStart-
                touchEnd;

            if(
                Math.abs(
                    difference
                )<50
            ){
                return;
            }

            if(
                difference>0
            ){

                goTo(
                    Math.min(
                        activeIndex+1,
                        videos.length-1
                    )
                );

            }else{

                goTo(
                    Math.max(
                        activeIndex-1,
                        0
                    )
                );

            }

        },
        {
            passive:true
        }
    );

/* =========================================================
   PROGRESS
========================================================= */

setInterval(()=>{

    const player=
        players[
            activeIndex
        ];

    const bar=
        document.getElementById(
            "progress-"+
            activeIndex
        );

    if(
        !player||
        !bar
    ){
        return;
    }

    try{

        const duration=
            player.getDuration();

        const current=
            player.getCurrentTime();

        if(
            duration>0
        ){

            bar.style.width=
                (
                    current/
                    duration*
                    100
                )+"%";

        }

    }catch(e){}

},100);

/* =========================================================
   START
========================================================= */

render();

</script>
